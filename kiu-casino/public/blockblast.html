<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="description" content="🧩 Block Blast - Xếp khối nổ hàng! Kiếm vàng tại Pixel PlayZone">
    <meta property="og:title" content="🧩 Block Blast - Pixel PlayZone">
    <meta name="theme-color" content="#0a0a2e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>">
    <title>🧩 BLOCK BLAST - Pixel PlayZone</title>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/theme.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #080820;
            --sf: rgba(12, 10, 35, .97);
            --sf2: rgba(18, 14, 45, .93);
            --bdr: rgba(100, 120, 255, .1);
            --accent: #667eea;
            --accent2: #764ba2;
            --gold: #FFD700;
            --grn: #00ff9d;
            --red: #ff4757;
            --txt: #f0f0ff;
            --muted: rgba(255, 255, 255, .4);
            --font: 'DearPix', 'Orbitron', sans-serif;
            --font2: 'DearPix', 'Rajdhani', sans-serif;
            --gap: 2.5px;
        }

        html,
        body {
            overscroll-behavior: none;
        }

        body {
            font-family: var(--font2);
            background: var(--bg);
            min-height: 100vh;
            min-height: 100dvh;
            color: var(--txt);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            touch-action: manipulation;
        }

        /* ═══ AMBIENT BG ═══ */
        .bg-amb {
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            background:
                radial-gradient(ellipse 55% 40% at 20% 10%, rgba(102, 126, 234, .06) 0%, transparent 60%),
                radial-gradient(ellipse 50% 55% at 80% 85%, rgba(118, 75, 162, .04) 0%, transparent 60%),
                radial-gradient(ellipse 35% 35% at 55% 45%, rgba(255, 107, 107, .025) 0%, transparent 50%);
        }

        .bg-grd {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(102, 126, 234, .02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(102, 126, 234, .02) 1px, transparent 1px);
            background-size: 36px 36px;
            animation: drift 50s linear infinite;
        }

        @keyframes drift {
            to {
                transform: translate(36px, 36px)
            }
        }

        /* ═══ TOP BAR ═══ */
        .topbar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px;
            height: 50px;
            background: rgba(6, 4, 22, .92);
            backdrop-filter: blur(18px) saturate(1.3);
            border-bottom: 1px solid rgba(255, 255, 255, .03);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .back {
            background: rgba(255, 255, 255, .04);
            border: 1px solid rgba(255, 255, 255, .07);
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            text-decoration: none;
            font-size: 13px;
            transition: .2s;
            font-family: var(--font);
            letter-spacing: .5px;
        }

        .back:hover {
            background: rgba(102, 126, 234, .12);
            border-color: rgba(102, 126, 234, .25);
        }

        .topbar-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font);
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 2.5px;
            background: linear-gradient(135deg, #fff, rgba(102, 126, 234, .9));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .topbar-title .ico {
            font-size: 19px;
            -webkit-text-fill-color: initial;
        }

        .bal {
            display: flex;
            align-items: center;
            gap: 4px;
            background: linear-gradient(135deg, rgba(255, 215, 0, .08), rgba(255, 215, 0, .02));
            border: 1px solid rgba(255, 215, 0, .18);
            border-radius: 50px;
            padding: 5px 12px;
            font-weight: 700;
            color: var(--gold);
            font-size: 13px;
            font-family: var(--font);
            position: relative;
            overflow: hidden;
        }

        .bal::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .12), transparent);
            animation: shimmer 4.5s ease infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-200%)
            }

            100% {
                transform: translateX(200%)
            }
        }

        /* ═══ GAME WRAP ═══ */
        .gw {
            width: min(100vw, 460px);
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 8px 8px 14px;
            position: relative;
        }

        /* ═══ SCORE BAR ═══ */
        .score-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }

        .sc {
            flex: 1;
            text-align: center;
            padding: 7px 4px 6px;
            background: var(--sf);
            border-radius: 10px;
            border: 1px solid var(--bdr);
            position: relative;
            overflow: hidden;
        }

        .sc::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1.5px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            opacity: .35;
        }

        .sc .lbl {
            font-size: 9px;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .sc .val {
            font-size: 19px;
            font-weight: 900;
            font-family: var(--font);
            line-height: 1.1;
            margin-top: 1px;
        }

        .sc .val.gold {
            color: var(--gold);
            text-shadow: 0 0 8px rgba(255, 215, 0, .2);
        }

        .sc .val.purple {
            color: var(--accent);
        }

        .sc .val.bump {
            animation: bump .3s cubic-bezier(.175, .885, .32, 1.275);
        }

        @keyframes bump {
            0% {
                transform: scale(1)
            }

            40% {
                transform: scale(1.22)
            }

            100% {
                transform: scale(1)
            }
        }

        /* ═══ GRID ═══ */
        .grid-wrap {
            position: relative;
            margin: 0 auto;
            width: 100%;
            aspect-ratio: 1;
            max-width: 400px;
        }

        #bb-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: var(--gap);
            width: 100%;
            height: 100%;
            padding: 7px;
            background: var(--sf);
            border-radius: 14px;
            border: 1.5px solid var(--bdr);
            box-shadow:
                0 12px 40px rgba(0, 0, 0, .4),
                inset 0 1px 0 rgba(255, 255, 255, .02),
                0 0 25px rgba(102, 126, 234, .04);
            position: relative;
            z-index: 1;
            transition: border-color .3s, box-shadow .3s;
        }

        #bb-grid.flash {
            border-color: rgba(102, 126, 234, .4);
            box-shadow:
                0 12px 40px rgba(0, 0, 0, .4),
                inset 0 1px 0 rgba(255, 255, 255, .02),
                0 0 40px rgba(102, 126, 234, .12);
        }

        #bb-grid.shake {
            animation: shake .35s ease;
        }

        #bb-grid.go-shake {
            animation: goShake .55s ease;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0)
            }

            20% {
                transform: translateX(-3px)
            }

            40% {
                transform: translateX(3px)
            }

            60% {
                transform: translateX(-2px)
            }

            80% {
                transform: translateX(2px)
            }
        }

        @keyframes goShake {

            0%,
            100% {
                transform: translate(0) rotate(0)
            }

            12% {
                transform: translate(-5px, 1px) rotate(-.5deg)
            }

            30% {
                transform: translate(5px, -1px) rotate(.5deg)
            }

            48% {
                transform: translate(-3px, 1px) rotate(-.3deg)
            }

            65% {
                transform: translate(3px, 0) rotate(.2deg)
            }

            82% {
                transform: translate(-1px) rotate(-.1deg)
            }
        }

        /* ═══ CELLS ═══ */
        .bb-cell {
            border-radius: 3.5px;
            border: 1.5px solid rgba(255, 255, 255, .028);
            background: rgba(255, 255, 255, .014);
            transition: background .1s, border-color .1s, box-shadow .1s, transform .15s;
            position: relative;
        }

        /* Checkerboard effect */
        .bb-cell.even {
            background: rgba(255, 255, 255, .024);
        }

        .bb-cell.filled {
            border-style: solid;
        }

        /* Glass shine highlight on filled block */
        .bb-cell.filled::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 50%;
            bottom: 50%;
            background: rgba(255, 255, 255, .2);
            border-radius: 2px;
            pointer-events: none;
        }

        /* Near-complete row/col hint (subtle glow) */
        .bb-cell.near {
            background: rgba(102, 126, 234, .06) !important;
            border-color: rgba(102, 126, 234, .15) !important;
            animation: nearPulse 1.5s ease-in-out infinite;
        }

        @keyframes nearPulse {

            0%,
            100% {
                box-shadow: 0 0 0 transparent
            }

            50% {
                box-shadow: 0 0 6px rgba(102, 126, 234, .15)
            }
        }

        /* Ghost preview */
        .bb-cell.ghost.gv {
            border-style: solid;
            animation: ghPulse .65s ease-in-out infinite;
        }

        .bb-cell.ghost.gi {
            border-style: dashed;
        }

        @keyframes ghPulse {

            0%,
            100% {
                opacity: .5
            }

            50% {
                opacity: 1
            }
        }

        /* Pop-in on place */
        .bb-cell.pop {
            animation: pop .3s cubic-bezier(.175, .885, .32, 1.275);
        }

        @keyframes pop {
            0% {
                transform: scale(0) rotate(6deg)
            }

            55% {
                transform: scale(1.14) rotate(-1deg)
            }

            100% {
                transform: scale(1) rotate(0)
            }
        }

        /* Sweep animation — staggered per cell */
        .bb-cell.sweep {
            animation: sweep .35s ease-out forwards;
        }

        @keyframes sweep {
            0% {
                transform: scale(1);
                opacity: 1;
                filter: brightness(1)
            }

            40% {
                transform: scale(1.1);
                filter: brightness(1.8);
                opacity: .8
            }

            70% {
                transform: scale(1.05) translateY(-2px);
                opacity: .3
            }

            100% {
                transform: scale(0) translateY(4px);
                opacity: 0
            }
        }

        /* Legacy clearing class in case */
        .bb-cell.clearing {
            animation: sweep .3s ease-out forwards;
        }

        #bb-particles {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        /* ═══ SLOTS ═══ */
        .slots {
            margin-top: 8px;
            display: flex;
            gap: 6px;
            justify-content: center;
            align-items: center;
            padding: 10px 6px;
            background: var(--sf);
            border-radius: 14px;
            border: 1px solid var(--bdr);
            min-height: 85px;
        }

        .bb-slot {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 68px;
            max-width: 130px;
            padding: 6px;
            border-radius: 10px;
            background: rgba(255, 255, 255, .015);
            border: 1.5px solid rgba(255, 255, 255, .04);
            transition: all .25s cubic-bezier(.4, 0, .2, 1);
            cursor: grab;
            position: relative;
        }

        .bb-slot:active {
            cursor: grabbing;
        }

        .bb-slot:hover:not(.empty):not(.no-fit) {
            border-color: rgba(102, 126, 234, .25);
            background: rgba(102, 126, 234, .04);
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 6px 16px rgba(102, 126, 234, .1);
        }

        .bb-slot.empty {
            opacity: .2;
            cursor: default;
            border-style: dashed;
        }

        .bb-slot.no-fit {
            opacity: .3;
            cursor: not-allowed;
            border-color: rgba(255, 60, 60, .08);
            filter: saturate(.4);
        }

        .bb-slot.dragging {
            opacity: .15;
            transform: scale(.8);
        }

        .bb-slot.bounce {
            animation: bounceback .35s ease;
        }

        @keyframes bounceback {
            0% {
                transform: scale(.85)
            }

            50% {
                transform: scale(1.08)
            }

            100% {
                transform: scale(1)
            }
        }

        .bb-slot-preview {
            display: grid;
            gap: 1.5px;
        }

        .bb-mini {
            border-radius: 2.5px;
            border: 1px solid transparent;
            position: relative;
        }

        .bb-mini.filled::after {
            content: '';
            position: absolute;
            top: 1px;
            left: 1px;
            right: 50%;
            bottom: 50%;
            background: rgba(255, 255, 255, .14);
            border-radius: 1px;
        }

        .bb-mini.empty-cell {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        /* ═══ DRAG PIECE ═══ */
        .bb-drag-piece {
            position: fixed;
            z-index: 10000;
            pointer-events: none;
            display: grid;
            gap: var(--gap);
            filter: drop-shadow(0 8px 24px rgba(0, 0, 0, .5));
            transform: scale(1.05);
            transition: transform .1s;
        }

        .bb-drag-cell {
            border-radius: 3.5px;
            border: 1.5px solid transparent;
            position: relative;
        }

        .bb-drag-cell.filled::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 50%;
            bottom: 50%;
            background: rgba(255, 255, 255, .22);
            border-radius: 2px;
        }

        .bb-drag-cell.empty-cell {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        /* ═══ COMBO ═══ */
        #bb-combo {
            position: fixed;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-family: var(--font);
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 215, 0, .5), 0 0 40px rgba(255, 107, 107, .2), 0 2px 4px rgba(0, 0, 0, .4);
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        #bb-combo.show {
            animation: comboPop 1.7s cubic-bezier(.175, .885, .32, 1.275) forwards;
        }

        @keyframes comboPop {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(-5deg);
                opacity: 0
            }

            10% {
                transform: translate(-50%, -50%) scale(1.3) rotate(2deg);
                opacity: 1
            }

            22% {
                transform: translate(-50%, -50%) scale(1) rotate(0)
            }

            65% {
                opacity: 1
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -75%) scale(.8)
            }
        }

        /* ═══ FLOAT SCORE ═══ */
        .bb-float {
            position: fixed;
            font-family: var(--font);
            font-size: 24px;
            font-weight: 900;
            color: var(--gold);
            text-shadow: 0 0 14px rgba(255, 215, 0, .45), 0 2px 3px rgba(0, 0, 0, .3);
            z-index: 200;
            pointer-events: none;
            animation: floatUp 1.15s ease-out forwards;
            transform: translateX(-50%);
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1)
            }

            30% {
                transform: translateX(-50%) translateY(-15px) scale(1.15)
            }

            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-75px) scale(.9)
            }
        }

        /* ═══ GOLD NOTIFICATION ═══ */
        .gold-notif {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(255, 215, 0, .15), rgba(255, 215, 0, .05));
            border: 1px solid rgba(255, 215, 0, .3);
            color: var(--gold);
            font-family: var(--font);
            font-weight: 800;
            font-size: 16px;
            padding: 10px 24px;
            border-radius: 50px;
            z-index: 600;
            animation: notifIn 2.2s ease-out forwards;
            box-shadow: 0 4px 20px rgba(255, 215, 0, .15);
            pointer-events: none;
        }

        @keyframes notifIn {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(20px)
            }

            12% {
                opacity: 1;
                transform: translateX(-50%) translateY(0)
            }

            75% {
                opacity: 1
            }

            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-10px)
            }
        }

        /* ═══ GAME OVER ═══ */
        .go-overlay {
            position: fixed;
            inset: 0;
            background: rgba(4, 2, 16, .84);
            backdrop-filter: blur(12px);
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            opacity: 0;
            visibility: hidden;
            transition: opacity .4s, visibility .4s;
        }

        .go-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .go-box {
            background: linear-gradient(155deg, rgba(12, 10, 38, .99), rgba(22, 16, 50, .99));
            border: 1.5px solid rgba(102, 126, 234, .18);
            border-radius: 20px;
            padding: 24px 20px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .55), 0 0 45px rgba(102, 126, 234, .06);
            animation: goIn .4s cubic-bezier(.175, .885, .32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .go-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2.5px;
            background: linear-gradient(90deg, #ff6b6b, var(--gold), #4ecdc4, var(--accent), #fd79a8);
        }

        @keyframes goIn {
            from {
                transform: scale(.65);
                opacity: 0
            }

            to {
                transform: scale(1);
                opacity: 1
            }
        }

        .go-title {
            font-family: var(--font);
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 3px;
            background: linear-gradient(135deg, #ff6b6b, var(--gold));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .go-sub {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 12px;
        }

        #bb-new-record {
            display: none;
            background: linear-gradient(135deg, rgba(255, 215, 0, .1), rgba(255, 215, 0, .03));
            border: 1px solid rgba(255, 215, 0, .22);
            border-radius: 8px;
            padding: 6px 10px;
            color: var(--gold);
            font-weight: 800;
            font-size: 13px;
            margin-bottom: 12px;
            animation: recPulse 1.5s ease-in-out infinite;
        }

        @keyframes recPulse {

            0%,
            100% {
                box-shadow: 0 0 0 transparent
            }

            50% {
                box-shadow: 0 0 15px rgba(255, 215, 0, .12)
            }
        }

        .go-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin-bottom: 10px;
        }

        .go-st {
            padding: 8px 3px;
            background: rgba(0, 0, 0, .2);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, .03);
        }

        .go-st .lbl {
            font-size: 9px;
            color: var(--muted);
            font-weight: 700;
            letter-spacing: .8px;
            text-transform: uppercase;
        }

        .go-st .val {
            font-size: 18px;
            font-weight: 900;
            font-family: var(--font);
            margin-top: 1px;
        }

        .go-st .val.gold {
            color: var(--gold)
        }

        .go-st .val.purple {
            color: var(--accent)
        }

        .go-st .val.cyan {
            color: #4ecdc4
        }

        .go-st .val.pink {
            color: #fd79a8
        }

        .go-st .val.lime {
            color: #a8e6cf
        }

        /* Main score in game over */
        .go-main-score {
            margin-bottom: 10px;
        }

        .go-main-score .lbl {
            font-size: 10px;
            color: var(--muted);
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .go-main-score .val {
            font-size: 36px;
            font-weight: 900;
            font-family: var(--font);
            color: var(--gold);
            text-shadow: 0 0 15px rgba(255, 215, 0, .2);
            line-height: 1;
        }

        .go-rw {
            background: linear-gradient(135deg, rgba(0, 255, 157, .06), rgba(0, 255, 157, .015));
            border: 1px solid rgba(0, 255, 157, .15);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 12px;
        }

        .go-rw .lbl {
            font-size: 9px;
            color: rgba(0, 255, 157, .6);
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .go-rw .val {
            font-size: 22px;
            font-weight: 900;
            color: var(--grn);
            font-family: var(--font);
            text-shadow: 0 0 10px rgba(0, 255, 157, .2);
        }

        .go-btns {
            display: flex;
            gap: 6px;
        }

        .go-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-family: var(--font2);
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: .8px;
            transition: .2s;
            text-transform: uppercase;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .go-btn-play {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            box-shadow: 0 4px 15px rgba(102, 126, 234, .25);
        }

        .go-btn-play:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(102, 126, 234, .4);
        }

        .go-btn-exit {
            background: rgba(255, 255, 255, .04);
            color: rgba(255, 255, 255, .6);
            border: 1px solid rgba(255, 255, 255, .06);
        }

        .go-btn-exit:hover {
            background: rgba(255, 255, 255, .07);
            color: #fff;
        }

        /* ═══ INFO ═══ */
        .info {
            text-align: center;
            padding: 6px;
            margin-top: 4px;
            color: var(--muted);
            font-size: 11px;
            letter-spacing: .2px;
        }

        .info span {
            color: var(--gold);
            font-weight: 700;
        }

        /* ═══ RESPONSIVE ═══ */
        @media (max-width: 400px) {
            .gw {
                padding: 5px 5px 10px
            }

            #bb-grid {
                padding: 5px;
                border-radius: 11px;
            }

            .slots {
                padding: 7px 4px;
                gap: 4px;
                min-height: 65px
            }

            .bb-slot {
                min-height: 55px;
                padding: 4px
            }

            .sc .val {
                font-size: 16px
            }

            .topbar {
                padding: 0 8px;
                height: 44px
            }

            .back {
                padding: 5px 9px;
                font-size: 11px
            }

            .bal {
                padding: 4px 9px;
                font-size: 11px
            }

            .topbar-title {
                font-size: 14px
            }

            .go-box {
                padding: 20px 16px
            }

            .go-main-score .val {
                font-size: 30px
            }
        }

        @media (min-width: 481px) {
            .gw {
                padding: 12px 12px 20px
            }

            .grid-wrap {
                max-width: 420px
            }
        }

        @media (min-height: 750px) {
            .gw {
                justify-content: center
            }
        }
    </style>
</head>

<body>
    <div class="bg-amb"></div>
    <div class="bg-grd"></div>

    <!-- Top Bar -->
    <div class="topbar">
        <a href="/" class="back">← LOBBY</a>
        <div class="topbar-title">
            <span class="ico">🧩</span> BLOCK BLAST
        </div>
        <div class="bal">💰 <span id="bb-balance">...</span></div>
    </div>

    <!-- Game -->
    <div class="gw">
        <!-- Score Bar -->
        <div class="score-bar">
            <div class="sc">
                <div class="lbl">ĐIỂM SỐ</div>
                <div class="val gold" id="bb-score">0</div>
            </div>
            <div class="sc">
                <div class="lbl">KỶ LỤC</div>
                <div class="val purple" id="bb-best">0</div>
            </div>
        </div>

        <!-- Grid -->
        <div class="grid-wrap">
            <div id="bb-grid"></div>
            <canvas id="bb-particles"></canvas>
        </div>

        <!-- Slots -->
        <div class="slots" id="bb-slots">
            <div class="bb-slot" data-slot="0">
                <div class="bb-slot-preview"></div>
            </div>
            <div class="bb-slot" data-slot="1">
                <div class="bb-slot-preview"></div>
            </div>
            <div class="bb-slot" data-slot="2">
                <div class="bb-slot-preview"></div>
            </div>
        </div>

        <div class="info">
            🎯 Xếp đầy hàng/cột để nổ · 1 Điểm = <span>5 Vàng 💰</span> · Ô nhấp nháy = sắp đầy!
        </div>
    </div>

    <!-- Combo -->
    <div id="bb-combo"></div>

    <!-- Game Over -->
    <div class="go-overlay" id="bb-gameover">
        <div class="go-box">
            <div class="go-title">GAME OVER</div>
            <div class="go-sub">Không còn nước đi!</div>

            <div id="bb-new-record">🎉 KỶ LỤC MỚI!</div>

            <!-- Main Score -->
            <div class="go-main-score">
                <div class="lbl">Điểm số</div>
                <div class="val" id="bb-final-score">0</div>
            </div>

            <!-- Stats -->
            <div class="go-stats">
                <div class="go-st">
                    <div class="lbl">Kỷ lục</div>
                    <div class="val purple" id="bb-final-best">0</div>
                </div>
                <div class="go-st">
                    <div class="lbl">Hàng nổ</div>
                    <div class="val cyan" id="bb-final-lines">0</div>
                </div>
                <div class="go-st">
                    <div class="lbl">Nước đi</div>
                    <div class="val lime" id="bb-final-moves">0</div>
                </div>
            </div>

            <!-- Reward -->
            <div class="go-rw">
                <div class="lbl">💰 Phần thưởng</div>
                <div class="val">+<span id="bb-final-reward">0</span> Vàng</div>
            </div>

            <!-- Buttons -->
            <div class="go-btns">
                <button class="go-btn go-btn-play" id="bb-restart">🔄 CHƠI LẠI</button>
                <a href="/" class="go-btn go-btn-exit">🏠 LOBBY</a>
            </div>
        </div>
    </div>

    <script src="js/blockblast.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/sound-system.js"></script>
    <script src="/js/notify-system.js"></script>
    <script src="/js/tutorial-system.js"></script>
    <script src="/js/chat-system.js"></script>
    <script src="/js/live-feed.js"></script>
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => { });</script>
</body>

</html>
