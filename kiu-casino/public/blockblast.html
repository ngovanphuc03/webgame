<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="description" content="🧩 Block Blast - Xếp khối nổ hàng! Kiếm vàng tại Pixel PlayZone">
    <meta property="og:title" content="🧩 Block Blast - Pixel PlayZone">
    <meta name="theme-color" content="#0a0a2e">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>">
    <title>🧩 BLOCK BLAST - Pixel PlayZone</title>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/theme.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0a2e;
            --sf: rgba(15, 12, 40, .96);
            --sf2: rgba(20, 16, 50, .9);
            --bdr: rgba(100, 120, 255, .12);
            --accent: #667eea;
            --accent2: #764ba2;
            --gold: #FFD700;
            --grn: #00ff9d;
            --red: #ff4757;
            --txt: #fff;
            --muted: rgba(255, 255, 255, .45);
            --rad: 14px;
            --gap: 3px;
            --font: 'DearPix', 'Orbitron', sans-serif;
            --font2: 'DearPix', 'Rajdhani', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font2);
            background: var(--bg);
            min-height: 100vh;
            min-height: 100dvh;
            color: var(--txt);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            touch-action: manipulation;
        }

        /* ═══ AMBIENT BG ═══ */
        .bg-ambient {
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            background:
                radial-gradient(ellipse 50% 40% at 20% 15%, rgba(102, 126, 234, .07) 0%, transparent 60%),
                radial-gradient(ellipse 50% 50% at 80% 75%, rgba(118, 75, 162, .05) 0%, transparent 60%),
                radial-gradient(ellipse 40% 40% at 50% 50%, rgba(255, 107, 107, .03) 0%, transparent 50%);
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(102, 126, 234, .025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(102, 126, 234, .025) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: drift 40s linear infinite;
        }

        @keyframes drift {
            to {
                transform: translate(40px, 40px)
            }
        }

        /* ═══ TOP BAR ═══ */
        .topbar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 14px;
            height: 52px;
            background: rgba(8, 6, 25, .9);
            backdrop-filter: blur(20px) saturate(1.4);
            border-bottom: 1px solid rgba(255, 255, 255, .04);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .back {
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .08);
            color: #fff;
            padding: 7px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            text-decoration: none;
            font-size: 14px;
            transition: .25s;
            font-family: var(--font);
        }

        .back:hover {
            background: rgba(102, 126, 234, .15);
            border-color: rgba(102, 126, 234, .3);
        }

        .topbar-title {
            display: flex;
            align-items: center;
            gap: 7px;
            font-family: var(--font);
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, .85);
        }

        .topbar-title .icon {
            font-size: 20px;
        }

        .bal {
            display: flex;
            align-items: center;
            gap: 5px;
            background: linear-gradient(135deg, rgba(255, 215, 0, .1), rgba(255, 215, 0, .03));
            border: 1px solid rgba(255, 215, 0, .22);
            border-radius: 50px;
            padding: 6px 14px;
            font-weight: 700;
            color: var(--gold);
            font-size: 14px;
            font-family: var(--font);
            position: relative;
            overflow: hidden;
        }

        .bal::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .15), transparent);
            animation: shimmer 4s ease infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-200%)
            }

            100% {
                transform: translateX(200%)
            }
        }

        /* ═══ GAME WRAP ═══ */
        .gw {
            width: min(100vw, 460px);
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px 10px 16px;
            position: relative;
        }

        /* ═══ SCORE BAR ═══ */
        .score-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .sc {
            flex: 1;
            text-align: center;
            padding: 8px 4px;
            background: var(--sf);
            border-radius: 12px;
            border: 1px solid var(--bdr);
            position: relative;
            overflow: hidden;
        }

        .sc::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            opacity: .4;
        }

        .sc .lbl {
            font-size: 10px;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 1px;
        }

        .sc .val {
            font-size: 20px;
            font-weight: 900;
            font-family: var(--font);
        }

        .sc .val.gold {
            color: var(--gold);
            text-shadow: 0 0 10px rgba(255, 215, 0, .25);
        }

        .sc .val.purple {
            color: var(--accent);
        }

        .sc .val.bump {
            animation: bump .35s cubic-bezier(.175, .885, .32, 1.275);
        }

        @keyframes bump {
            0% {
                transform: scale(1)
            }

            45% {
                transform: scale(1.2)
            }

            100% {
                transform: scale(1)
            }
        }

        /* ═══ GRID ═══ */
        .grid-wrap {
            position: relative;
            margin: 0 auto;
            width: 100%;
            aspect-ratio: 1;
            max-width: 400px;
        }

        #bb-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: var(--gap);
            width: 100%;
            height: 100%;
            padding: 8px;
            background: var(--sf);
            border-radius: 16px;
            border: 2px solid var(--bdr);
            box-shadow:
                0 16px 50px rgba(0, 0, 0, .45),
                inset 0 1px 0 rgba(255, 255, 255, .03),
                0 0 30px rgba(102, 126, 234, .05);
            position: relative;
            z-index: 1;
        }

        #bb-grid.shake {
            animation: shake .35s ease;
        }

        #bb-grid.game-over-shake {
            animation: goShake .5s ease;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0)
            }

            20% {
                transform: translateX(-3px)
            }

            40% {
                transform: translateX(3px)
            }

            60% {
                transform: translateX(-2px)
            }

            80% {
                transform: translateX(2px)
            }
        }

        @keyframes goShake {

            0%,
            100% {
                transform: translateX(0) rotate(0)
            }

            15% {
                transform: translateX(-5px) rotate(-.4deg)
            }

            35% {
                transform: translateX(5px) rotate(.4deg)
            }

            55% {
                transform: translateX(-3px) rotate(-.2deg)
            }

            75% {
                transform: translateX(3px) rotate(.2deg)
            }
        }

        /* Cells */
        .bb-cell {
            border-radius: 4px;
            border: 1.5px solid rgba(255, 255, 255, .035);
            background: rgba(255, 255, 255, .018);
            transition: background .12s, border-color .12s, box-shadow .12s;
            position: relative;
        }

        .bb-cell.filled {
            border-width: 1.5px;
            border-style: solid;
        }

        .bb-cell.filled::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 55%;
            bottom: 55%;
            background: rgba(255, 255, 255, .18);
            border-radius: 2px;
        }

        .bb-cell.ghost.ghost-valid {
            border-style: solid;
            animation: pulse .7s ease-in-out infinite;
        }

        .bb-cell.ghost.ghost-invalid {
            border-style: dashed;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: .55
            }

            50% {
                opacity: 1
            }
        }

        .bb-cell.pop {
            animation: pop .28s cubic-bezier(.175, .885, .32, 1.275);
        }

        @keyframes pop {
            0% {
                transform: scale(0) rotate(8deg)
            }

            60% {
                transform: scale(1.12) rotate(-1deg)
            }

            100% {
                transform: scale(1) rotate(0)
            }
        }

        .bb-cell.clearing {
            animation: clear .28s ease-out forwards;
        }

        @keyframes clear {
            0% {
                transform: scale(1);
                opacity: 1
            }

            50% {
                transform: scale(1.15);
                opacity: .6;
                filter: brightness(1.8)
            }

            100% {
                transform: scale(0);
                opacity: 0
            }
        }

        #bb-particles {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        /* ═══ SLOTS ═══ */
        .slots {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            padding: 12px 8px;
            background: var(--sf);
            border-radius: 16px;
            border: 1px solid var(--bdr);
            min-height: 90px;
        }

        .bb-slot {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 72px;
            max-width: 130px;
            padding: 8px;
            border-radius: 12px;
            background: rgba(255, 255, 255, .018);
            border: 1.5px solid rgba(255, 255, 255, .05);
            transition: all .25s ease;
            cursor: grab;
            position: relative;
        }

        .bb-slot:active {
            cursor: grabbing;
        }

        .bb-slot:hover:not(.empty):not(.no-fit) {
            border-color: rgba(102, 126, 234, .28);
            background: rgba(102, 126, 234, .05);
            transform: translateY(-3px);
            box-shadow: 0 6px 18px rgba(102, 126, 234, .12);
        }

        .bb-slot.empty {
            opacity: .25;
            cursor: default;
        }

        .bb-slot.no-fit {
            opacity: .35;
            cursor: not-allowed;
            border-color: rgba(255, 60, 60, .12);
        }

        .bb-slot.dragging {
            opacity: .2;
            transform: scale(.85);
        }

        .bb-slot-preview {
            display: grid;
            gap: 2px;
        }

        .bb-mini {
            border-radius: 3px;
            border: 1px solid transparent;
            position: relative;
        }

        .bb-mini.filled::after {
            content: '';
            position: absolute;
            top: 1px;
            left: 1px;
            right: 55%;
            bottom: 55%;
            background: rgba(255, 255, 255, .15);
            border-radius: 1px;
        }

        .bb-mini.empty-cell {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        /* ═══ DRAG PIECE ═══ */
        .bb-drag-piece {
            position: fixed;
            z-index: 10000;
            pointer-events: none;
            display: grid;
            gap: var(--gap);
            filter: drop-shadow(0 6px 20px rgba(0, 0, 0, .45));
            transform: scale(1.04);
        }

        .bb-drag-cell {
            border-radius: 4px;
            border: 1.5px solid transparent;
            position: relative;
        }

        .bb-drag-cell.filled::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 55%;
            bottom: 55%;
            background: rgba(255, 255, 255, .22);
            border-radius: 2px;
        }

        .bb-drag-cell.empty-cell {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        /* ═══ COMBO ═══ */
        #bb-combo {
            position: fixed;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-family: var(--font);
            font-size: 26px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 18px rgba(255, 215, 0, .5), 0 0 35px rgba(255, 107, 107, .25);
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            letter-spacing: 2px;
        }

        #bb-combo.show {
            animation: comboPop 1.5s cubic-bezier(.175, .885, .32, 1.275) forwards;
        }

        @keyframes comboPop {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0
            }

            12% {
                transform: translate(-50%, -50%) scale(1.25);
                opacity: 1
            }

            25% {
                transform: translate(-50%, -50%) scale(1)
            }

            70% {
                opacity: 1
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -75%) scale(.8)
            }
        }

        /* ═══ FLOAT SCORE ═══ */
        .bb-float {
            position: fixed;
            font-family: var(--font);
            font-size: 22px;
            font-weight: 900;
            color: var(--gold);
            text-shadow: 0 0 12px rgba(255, 215, 0, .4);
            z-index: 200;
            pointer-events: none;
            animation: floatUp 1.1s ease-out forwards;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0)
            }

            100% {
                opacity: 0;
                transform: translateY(-70px)
            }
        }

        /* ═══ GAME OVER ═══ */
        .go-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 3, 20, .82);
            backdrop-filter: blur(10px);
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity .35s, visibility .35s;
        }

        .go-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .go-box {
            background: linear-gradient(150deg, rgba(15, 12, 42, .98), rgba(25, 18, 55, .98));
            border: 2px solid rgba(102, 126, 234, .2);
            border-radius: 22px;
            padding: 28px 24px;
            max-width: 370px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 70px rgba(0, 0, 0, .55), 0 0 50px rgba(102, 126, 234, .08);
            animation: goIn .45s cubic-bezier(.175, .885, .32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .go-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #ff6b6b, var(--gold), #4ecdc4, var(--accent));
        }

        @keyframes goIn {
            from {
                transform: scale(.7);
                opacity: 0
            }

            to {
                transform: scale(1);
                opacity: 1
            }
        }

        .go-title {
            font-family: var(--font);
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #ff6b6b, var(--gold));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .go-sub {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 16px;
        }

        #bb-new-record {
            display: none;
            background: linear-gradient(135deg, rgba(255, 215, 0, .12), rgba(255, 215, 0, .04));
            border: 1px solid rgba(255, 215, 0, .25);
            border-radius: 8px;
            padding: 7px 12px;
            color: var(--gold);
            font-weight: 800;
            font-size: 14px;
            margin-bottom: 14px;
            animation: recPulse 1.5s ease-in-out infinite;
        }

        @keyframes recPulse {

            0%,
            100% {
                box-shadow: 0 0 0 rgba(255, 215, 0, 0)
            }

            50% {
                box-shadow: 0 0 18px rgba(255, 215, 0, .15)
            }
        }

        .go-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .go-st {
            padding: 10px 4px;
            background: rgba(0, 0, 0, .25);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, .04);
        }

        .go-st .lbl {
            font-size: 10px;
            color: var(--muted);
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .go-st .val {
            font-size: 20px;
            font-weight: 900;
            font-family: var(--font);
            margin-top: 1px;
        }

        .go-st .val.gold {
            color: var(--gold);
        }

        .go-st .val.purple {
            color: var(--accent);
        }

        .go-st .val.cyan {
            color: #4ecdc4;
        }

        .go-st .val.pink {
            color: #fd79a8;
        }

        .go-rw {
            background: linear-gradient(135deg, rgba(0, 255, 157, .07), rgba(0, 255, 157, .02));
            border: 1px solid rgba(0, 255, 157, .18);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
        }

        .go-rw .lbl {
            font-size: 10px;
            color: rgba(0, 255, 157, .65);
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .go-rw .val {
            font-size: 24px;
            font-weight: 900;
            color: var(--grn);
            font-family: var(--font);
            text-shadow: 0 0 12px rgba(0, 255, 157, .25);
        }

        .go-btns {
            display: flex;
            gap: 8px;
        }

        .go-btn {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 12px;
            font-family: var(--font2);
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 1px;
            transition: .25s;
            text-transform: uppercase;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .go-btn-play {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            box-shadow: 0 4px 18px rgba(102, 126, 234, .3);
        }

        .go-btn-play:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 25px rgba(102, 126, 234, .45);
        }

        .go-btn-exit {
            background: rgba(255, 255, 255, .05);
            color: rgba(255, 255, 255, .65);
            border: 1px solid rgba(255, 255, 255, .08);
        }

        .go-btn-exit:hover {
            background: rgba(255, 255, 255, .08);
            color: #fff;
        }

        /* ═══ INFO BAR ═══ */
        .info {
            text-align: center;
            padding: 7px;
            margin-top: 6px;
            color: var(--muted);
            font-size: 12px;
            letter-spacing: .3px;
        }

        .info span {
            color: var(--gold);
            font-weight: 700;
        }

        /* ═══ RESPONSIVE ═══ */
        @media (max-width: 400px) {
            .gw {
                padding: 6px 6px 12px;
            }

            #bb-grid {
                padding: 5px;
                border-radius: 12px;
            }

            .slots {
                padding: 8px 5px;
                gap: 5px;
                min-height: 70px;
            }

            .bb-slot {
                min-height: 58px;
                padding: 4px;
            }

            .sc .val {
                font-size: 17px;
            }

            .topbar {
                padding: 0 10px;
                height: 46px;
            }

            .back {
                padding: 5px 10px;
                font-size: 12px;
            }

            .bal {
                padding: 4px 10px;
                font-size: 12px;
            }

            .topbar-title {
                font-size: 15px;
            }
        }

        @media (min-width: 481px) {
            .gw {
                padding: 14px 14px 24px;
            }

            .grid-wrap {
                max-width: 420px;
            }
        }

        @media (min-height: 750px) {
            .gw {
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <div class="bg-ambient"></div>
    <div class="bg-grid"></div>

    <!-- Top Bar -->
    <div class="topbar">
        <a href="/" class="back">← LOBBY</a>
        <div class="topbar-title">
            <span class="icon">🧩</span> BLOCK BLAST
        </div>
        <div class="bal">💰 <span id="bb-balance">...</span></div>
    </div>

    <!-- Game -->
    <div class="gw">
        <!-- Score Bar -->
        <div class="score-bar">
            <div class="sc">
                <div class="lbl">ĐIỂM SỐ</div>
                <div class="val gold" id="bb-score">0</div>
            </div>
            <div class="sc">
                <div class="lbl">KỶ LỤC</div>
                <div class="val purple" id="bb-best">0</div>
            </div>
        </div>

        <!-- Grid -->
        <div class="grid-wrap">
            <div id="bb-grid"></div>
            <canvas id="bb-particles"></canvas>
        </div>

        <!-- Slots -->
        <div class="slots" id="bb-slots">
            <div class="bb-slot" data-slot="0">
                <div class="bb-slot-preview"></div>
            </div>
            <div class="bb-slot" data-slot="1">
                <div class="bb-slot-preview"></div>
            </div>
            <div class="bb-slot" data-slot="2">
                <div class="bb-slot-preview"></div>
            </div>
        </div>

        <div class="info">
            🎯 Xếp đầy hàng hoặc cột để nổ · 1 Điểm = <span>5 Vàng 💰</span>
        </div>
    </div>

    <!-- Combo -->
    <div id="bb-combo"></div>

    <!-- Game Over -->
    <div class="go-overlay" id="bb-gameover">
        <div class="go-box">
            <div class="go-title">GAME OVER</div>
            <div class="go-sub">Không còn nước đi! 😵</div>

            <div id="bb-new-record">🎉 KỶ LỤC MỚI! 🎉</div>

            <div class="go-stats">
                <div class="go-st">
                    <div class="lbl">Điểm</div>
                    <div class="val gold" id="bb-final-score">0</div>
                </div>
                <div class="go-st">
                    <div class="lbl">Kỷ lục</div>
                    <div class="val purple" id="bb-final-best">0</div>
                </div>
                <div class="go-st">
                    <div class="lbl">Hàng nổ</div>
                    <div class="val cyan" id="bb-final-lines">0</div>
                </div>
                <div class="go-st">
                    <div class="lbl">Nước đi</div>
                    <div class="val pink" id="bb-final-moves">0</div>
                </div>
            </div>

            <div class="go-rw">
                <div class="lbl">💰 Phần thưởng</div>
                <div class="val">+<span id="bb-final-reward">0</span> Vàng</div>
            </div>

            <div class="go-btns">
                <button class="go-btn go-btn-play" id="bb-restart">🔄 CHƠI LẠI</button>
                <a href="/" class="go-btn go-btn-exit">← THOÁT</a>
            </div>
        </div>
    </div>

    <script src="js/blockblast.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/sound-system.js"></script>
    <script src="/js/notify-system.js"></script>
    <script src="/js/tutorial-system.js"></script>
    <script src="/js/chat-system.js"></script>
    <script src="/js/live-feed.js"></script>
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => { });</script>
</body>

</html>
