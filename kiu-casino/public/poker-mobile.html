<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="screen-orientation" content="landscape">
    <title>POKER VIP - Mobile</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="desktop-redirect.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Outfit:wght@600;700;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="mobile-common.css">

    <style>
        /* Hide rotation warnings completely */
        #rotate-warning,
        .portrait-warning {
            display: none !important;
        }

        /* ============================================= */
        /* PREMIUM POKER MOBILE STYLE */
        /* ============================================= */
        body {
            background: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }

        .poker-wrapper {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at center, #1a1025 0%, #000 90%);
            display: flex;
            flex-direction: column;
        }

        /* --- HUD TOP --- */
        .hud-top {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            padding: 0 15px;
            /* handled by safe area in root */
            padding-left: max(15px, env(safe-area-inset-left));
            padding-right: max(15px, env(safe-area-inset-right));
            padding-top: env(safe-area-inset-top);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none;
            /* Let clicks pass through for table, but buttons have pointer-events auto */
        }

        .hud-top>* {
            pointer-events: auto;
        }

        .hud-btn {
            padding: 6px 12px;
            border-radius: 20px;
            text-decoration: none;
            color: #fff;
            font-weight: 600;
            font-size: 13px;
        }

        .table-info {
            padding: 5px 15px;
            border-radius: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 12px;
        }

        .separator {
            opacity: 0.3;
        }

        .game-state {
            color: #aaa;
            font-weight: 600;
        }

        /* --- TABLE AREA --- */
        .poker-table-area {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        .poker-table {
            position: relative;
            width: 85%;
            height: 70%;
            border-radius: 200px;
            transform: rotateX(15deg) translateY(10px);
            /* 3D tilt */
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        .table-rail {
            position: absolute;
            inset: -20px;
            border-radius: 220px;
            background: linear-gradient(180deg, #3e2723, #1b0000);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.8), inset 0 2px 5px rgba(255, 255, 255, 0.1);
            z-index: 1;
        }

        .table-felt {
            position: absolute;
            inset: 0;
            border-radius: 200px;
            background: radial-gradient(ellipse at center, #0f5c2e 0%, #052e17 90%);
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.8);
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .table-logo {
            position: absolute;
            top: 25%;
            font-family: 'Cinzel', serif;
            color: rgba(0, 0, 0, 0.3);
            font-size: 24px;
            letter-spacing: 2px;
        }

        /* --- POT & CARDS --- */
        .pot-display {
            position: absolute;
            top: 38%;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
        }

        .community-area {
            position: absolute;
            top: 50%;
            display: flex;
            gap: 6px;
        }

        .card-mobile {
            width: 50px;
            height: 70px;
            background-color: #fff;
            background-size: cover;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        /* --- SEATS --- */
        .seats-layer {
            position: absolute;
            inset: -30px;
            z-index: 5;
            pointer-events: none;
        }

        .seat-node {
            position: absolute;
            width: 80px;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Positions (Manual tweaked for ellipse 9 seats) 
           0: Bottom Center (Me)
           1: Bottom Right
           2: Right
           3: Top Right
           4: Top Center
           5: Top Left
           6: Left
           7: Bottom Left
           8: ... Wait typically 9max.
           Visual Pos 0 is always ME (Bottom Center)
        */
        .pos-0 {
            bottom: -10px;
            left: 50%;
            transform: translate(-50%, 0);
            z-index: 20;
        }

        .pos-1 {
            bottom: 10px;
            right: 15%;
        }

        .pos-2 {
            top: 50%;
            right: -30px;
            transform: translate(0, -50%);
        }

        .pos-3 {
            top: 10px;
            right: 15%;
        }

        .pos-4 {
            top: -40px;
            left: 50%;
            transform: translate(-50%, 0);
        }

        .pos-5 {
            top: 10px;
            left: 15%;
        }

        .pos-6 {
            top: 50%;
            left: -30px;
            transform: translate(0, -50%);
        }

        .pos-7 {
            bottom: 10px;
            left: 15%;
        }

        .pos-8 {
            display: none;
        }

        /* Backup */

        .seat-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            position: relative;
            background: #222;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .seat-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .active-turn .seat-avatar {
            border-color: var(--gold);
            box-shadow: 0 0 15px var(--gold);
        }

        .seat-info {
            position: absolute;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            padding: 2px 8px;
            border-radius: 10px;
            text-align: center;
            width: 100%;
            transform: translateY(50%);
        }

        .seat-name {
            font-size: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .seat-chips {
            font-size: 10px;
        }

        .seat-bet {
            position: absolute;
            top: -15px;
            padding: 2px 6px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 700;
            background: var(--gold-dark);
            color: #fff;
        }

        /* MY CARDS (HERO) */
        .my-cards-container {
            position: absolute;
            bottom: 65px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
        }

        .hero-card {
            width: 60px;
            height: 84px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.8);
        }

        /* --- CONTROLS BAR --- */
        .controls-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 90px;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.95), transparent);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 20px 15px 20px;
            padding-bottom: max(15px, env(safe-area-inset-bottom));
            transform: translateY(120%);
            transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            z-index: 50;
        }

        .controls-bar.show {
            transform: translateY(0);
        }

        .raise-control {
            width: 200px;
            padding: 10px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 5px;
        }

        .raise-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 700;
        }

        .gold-slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.2);
            -webkit-appearance: none;
        }

        .gold-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: var(--gold);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--gold);
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            border: none;
            border-radius: 15px;
            min-width: 60px;
            height: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            cursor: pointer;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .btn-fold {
            background: #333;
            width: 60px;
        }

        .btn-group-right {
            display: flex;
            gap: 10px;
        }

        .btn-check,
        .btn-call {
            background: linear-gradient(180deg, #3498db, #2980b9);
            width: 90px;
        }

        .btn-raise {
            background: linear-gradient(180deg, var(--gold), var(--gold-dark));
            color: #000;
            width: 90px;
        }

        .btn-text-large {
            font-size: 16px;
            font-weight: 900;
        }

        .btn-sub {
            font-size: 10px;
            opacity: 0.8;
        }

        /* Mobile Toast */
        .mobile-toast {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--gold);
            padding: 10px 20px;
            border-radius: 20px;
            color: var(--gold);
            font-weight: 700;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
        }

        .mobile-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Rotate Warning */
        #rotate-warning {
            display: none;
        }

        @media (orientation: portrait) {
            #rotate-warning {
                display: flex !important;
                position: fixed;
                inset: 0;
                z-index: 9999;
                background: #000;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            .poker-wrapper {
                display: none;
            }
        }

        .portrait-warning {
            display: none !important;
        }
    </style>
</head>

<body>
    <!-- Rotation Warning (Hidden by CSS, but kept for logic) -->
    <div id="rotate-warning">
        <div style="font-size: 80px; margin-bottom: 20px;">🃏➡️</div>
        <div style="font-size: 20px; font-weight: 700; color: var(--gold);">Vui lòng xoay ngang</div>
    </div>

    <!-- Main Game Container -->
    <div class="poker-wrapper">
        <!-- Top HUD -->
        <div class="hud-top">
            <a href="/index-mobile.html" class="hud-btn back-btn glass-panel">
                <span style="font-size: 14px">🚪</span> Thoát
            </a>

            <div class="table-info glass-panel">
                <span class="text-gold font-bold" id="table-name-mobile">VIP TABLE</span>
                <span class="separator">|</span>
                <span class="game-state" id="game-state-mobile">WAITING</span>
            </div>

            <div class="balance-pill glass-panel">
                <span>💰</span>
                <span id="balance-poker-mobile" class="text-gold font-bold">---</span>
            </div>
        </div>

        <!-- The Table -->
        <div class="poker-table-area">
            <div class="poker-table">
                <div class="table-rail"></div>
                <div class="table-felt">
                    <!-- Logo/Watermark -->
                    <div class="table-logo">ROYAL POKER</div>

                    <!-- Community Cards -->
                    <div class="community-area" id="community-mobile"></div>

                    <!-- Pot Display -->
                    <div class="pot-display glass-panel" id="pot-container">
                        <span class="label">POT:</span>
                        <span class="value text-gold" id="pot-mobile">$0</span>
                    </div>

                    <!-- Seats Container -->
                    <div class="seats-layer" id="seats-mobile">
                        <!-- Seats injected by JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Controls (Action Bar) -->
        <div class="controls-bar" id="controls-mobile">
            <!-- Range Slider (Left/Center) -->
            <div class="raise-control glass-panel">
                <div class="raise-info">
                    <span class="label">TO:</span>
                    <span class="value text-gold" id="raise-amount-mobile">$100</span>
                </div>
                <input type="range" class="gold-slider" id="raise-slider-mobile" min="0" max="1000">
            </div>

            <!-- Action Buttons (Right) -->
            <div class="action-buttons">
                <button class="action-btn btn-fold" onclick="Actions('fold')">
                    <div class="btn-icon">❌</div>
                    <div class="btn-text">BỎ</div>
                </button>
                <div class="btn-group-right">
                    <button class="action-btn btn-check" id="btn-check-call-mobile" onclick="Actions('check')">
                        <div class="btn-text-large">XEM</div>
                    </button>
                    <button class="action-btn btn-raise" onclick="Actions('raise')">
                        <div class="btn-text-large">TỐ</div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Win/Showdown Overlay -->
    <div id="win-overlay" class="glass-panel"
        style="display:none; position:fixed; inset:0; z-index:100; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,0,0.9);">
        <div style="font-size:40px; margin-bottom:10px;">🏆</div>
        <div id="win-details" style="text-align:center; color:var(--gold);"></div>
    </div>

    <!-- Notification Toast -->
    <div class="mobile-toast" id="toast-poker-mobile"></div>

    <!-- Logic Script -->
    <script src="poker.js"></script>
    <script>
        // --- MOBILE ADAPTER LOGIC ---

        // 1. Override Seat Finder for Mobile Structure
        function findSeatByPlayerId(pid) {
            // Mobile uses .seat-node and stores ID in data-player-id (if we add it)
            // Or we check derived classes.
            // Let's ensure renderSeats adds data-player-id
            return document.querySelector(`.seat-node[data-player-id="${pid}"]`);
        }

        // 2. Override Handle Win to target Mobile Overlay
        // The original handleWin targets #win-overlay which we just added.
        // But we need to make sure class toggling works.
        // Original uses .active class. We set display:none inline.
        // Let's override to be safe and use flex/none.
        const originalHandleWin = handleWin;
        handleWin = function (data) {
            playSound('win');
            // Highlight Winner
            if (data.winnerId) {
                const seat = findSeatByPlayerId(data.winnerId);
                if (seat) {
                    seat.classList.add('winner-glow');
                    setTimeout(() => seat.classList.remove('winner-glow'), 4000);
                }
            }

            const overlay = document.getElementById('win-overlay');
            const details = document.getElementById('win-details');
            if (details) {
                const name = data.winnerName || 'Winner';
                const amt = data.amount || 0;
                details.innerHTML = `
                    <h2 style="font-size:24px; color:#fff">${name}</h2>
                    <div style="font-size:32px; font-weight:bold; margin:10px 0">+$${amt}</div>
                    <div style="opacity:0.8">${data.desc || ''}</div>
                `;
            }

            if (overlay) {
                overlay.style.display = 'flex';
                setTimeout(() => overlay.style.display = 'none', 4000);
            }
        };

        // 3. Override handleShowdown
        handleShowdown = function (data) {
            playSound('win');
            const overlay = document.getElementById('win-overlay');
            const details = document.getElementById('win-details');

            if (data.results && details) {
                const resultsHtml = data.results.map(r => `
                    <div style="background:rgba(255,255,255,0.1); padding:10px; border-radius:10px; margin:5px 0;">
                        <div style="color:#fff; font-weight:bold">${r.playerName}</div>
                        <div style="font-size:12px; opacity:0.8">${r.handDesc}</div>
                        <div style="color:var(--gold); font-weight:bold; font-size:16px;">+$${r.amount}</div>
                    </div>
                `).join('');
                details.innerHTML = `<h2 style="color:#fff">Showdown</h2>${resultsHtml}`;
            }

            if (overlay) {
                overlay.style.display = 'flex';
                setTimeout(() => overlay.style.display = 'none', 6000);
            }
        };

        // 4. Override Render Seats to include data-player-id
        function renderSeats(data) {
            const container = document.getElementById('seats-mobile');
            if (!container) return;

            const me = data.players.find(p => p && p.id === state.myId);
            const mySeat = me ? me.seat : 0;
            container.innerHTML = '';

            data.players.forEach((p, i) => {
                if (!p) return;
                const visualPos = (i - mySeat + 9) % 9;

                const seatEl = document.createElement('div');
                // Added data-player-id for the finder
                seatEl.setAttribute('data-player-id', p.id);
                seatEl.className = `seat-node pos-${visualPos} ${p.id === data.currentTurn ? 'active-turn' : ''}`;
                if (p.status === 'FOLD') seatEl.classList.add('folded');

                const avatarUrl = p.avatar || `https://ui-avatars.com/api/?name=${p.name}&background=random`;

                seatEl.innerHTML = `
                    <div class="seat-avatar">
                        <img src="${avatarUrl}" />
                        <div class="turn-timer-ring"></div>
                    </div>
                    <div class="seat-info glass-panel">
                        <div class="seat-name">${p.name}</div>
                        <div class="seat-chips text-gold">$${p.chips}</div>
                    </div>
                    ${p.bet > 0 ? `<div class="seat-bet glass-panel">$${p.bet}</div>` : ''}
                `;

                if (p.id === state.myId) {
                    seatEl.classList.add('is-me');
                }
                container.appendChild(seatEl);
            });
            renderMobileHoleCards(data);
        }

        // 4. Render Mobile Hole Cards - CRITICAL FIX
        function renderMobileHoleCards(data) {
            const me = data.players.find(p => p && p.id === state.myId);
            // Check data.myHand first (standard protocol), then fallback to holeCards
            const cards = data.myHand || data.holeCards;

            if (me && cards && cards.length > 0) {
                const mySeatNode = document.querySelector('.seat-node.is-me');
                if (mySeatNode) {
                    // Remove old if any
                    const old = mySeatNode.querySelector('.my-cards-container');
                    if (old) old.remove();

                    let html = '<div class="my-cards-container">';
                    cards.forEach(c => {
                        const bg = getCardBg(c);
                        // Use .hero-card class for sizing
                        html += `<div class="hero-card" style="background-image: ${bg}; background-size:cover;"></div>`;
                    });
                    html += '</div>';
                    mySeatNode.insertAdjacentHTML('beforeend', html);
                }
            }
        }

        // Render Community Cards
        function renderCommunityCards(data) {
            const container = document.getElementById('community-mobile');
            if (!container) return;
            container.innerHTML = '';

            data.communityCards.forEach(card => {
                const el = document.createElement('div');
                el.className = 'card-mobile community-card';
                el.style.backgroundImage = getCardBg(card);
                el.style.backgroundSize = 'cover';
                container.appendChild(el);
            });
        }

        // Render Controls
        function renderControls(data) {
            const bar = document.getElementById('controls-mobile');
            const me = data.players.find(p => p && p.id === state.myId);

            if (!me || me.id !== data.currentTurn || me.status !== 'PLAYING') {
                bar.classList.remove('show');
                return;
            }

            bar.classList.add('show');
            const btnCheckCall = document.getElementById('btn-check-call-mobile');
            const toCall = (data.currentBet || 0) - me.bet;

            if (toCall > 0) {
                btnCheckCall.innerHTML = `<div class="btn-text-large">THEO</div><div class="btn-sub">$${toCall}</div>`;
                btnCheckCall.onclick = () => doAction('call');
                btnCheckCall.className = 'action-btn btn-call';
            } else {
                btnCheckCall.innerHTML = `<div class="btn-text-large">XEM</div>`;
                btnCheckCall.onclick = () => doAction('check');
                btnCheckCall.className = 'action-btn btn-check';
            }

            // Slider Logic
            const slider = document.getElementById('raise-slider-mobile');
            const bb = data.bigBlind || 20;
            const minRaise = (data.currentBet || 0) + (data.lastRaiseSize || bb);
            const maxRaise = me.chips + me.bet;

            slider.min = minRaise;
            slider.max = maxRaise;
            slider.value = minRaise;

            // Fix: Disable slider if logic implies simple all-in? 
            // Keep simple for now.

            document.getElementById('raise-amount-mobile').innerText = `$${minRaise}`;
        }

        function renderPot(data) {
            const pot = data.pots?.reduce((sum, p) => sum + p.amount, 0) || data.pot || 0;
            document.getElementById('pot-mobile').innerText = `$${pot}`;
        }

        function Actions(type) {
            if (type === 'raise') {
                const amount = parseInt(document.getElementById('raise-slider-mobile').value);
                doAction('raise', amount);
            } else {
                doAction(type);
            }
        }

        // Slider Listener
        document.getElementById('raise-slider-mobile')?.addEventListener('input', (e) => {
            document.getElementById('raise-amount-mobile').innerText = `$${e.target.value}`;
        });

        // Orientation Lock
        try { screen.orientation.lock('landscape').catch(() => { }); } catch (e) { }

        // Initial Balance
        fetch('/api/me').then(r => r.json()).then(u => {
            if (u.balance) document.getElementById('balance-poker-mobile').innerText = `$${u.balance}`;
        });

        // Toast override
        showToast = function (msg) {
            const t = document.getElementById('toast-poker-mobile');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }
    </script>
</body>

</html>
