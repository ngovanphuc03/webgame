<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Lịch Sử Giao Dịch - Xem lại tất cả hoạt động tại Pixel PlayZone">
    <meta property="og:title" content="📜 Lịch Sử Giao Dịch - Pixel PlayZone">
    <meta property="og:description" content="Xem lịch sử đặt cược, thắng thua, phần thưởng tại Pixel PlayZone.">
    <meta property="og:image" content="/images/icons/icon-512.svg">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#030014">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📜</text></svg>">
    <title>📜 Lịch Sử Giao Dịch - Pixel PlayZone</title>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --bg: #030014;
            --surface: rgba(12, 6, 30, .95);
            --surface2: rgba(20, 10, 45, .88);
            --border: rgba(139, 92, 246, .15);
            --neon-purple: #8b5cf6;
            --neon-cyan: #00f0ff;
            --neon-green: #00ff9d;
            --neon-red: #ff3355;
            --neon-yellow: #ffd700;
            --font-pixel-en: 'DearPix', 'Orbitron', sans-serif;
            --font-body: 'DearPix', 'Rajdhani', sans-serif;
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: var(--font-pixel-en);
            min-height: 100vh;
            overflow-x: hidden
        }

        .bg-mesh {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, .08), transparent 60%), radial-gradient(ellipse at 80% 20%, rgba(6, 182, 212, .06), transparent 50%);
            pointer-events: none;
            z-index: 0
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            height: 56px;
            background: rgba(3, 0, 20, .85);
            backdrop-filter: blur(20px) saturate(1.5);
            border-bottom: 1px solid rgba(255, 255, 255, .04)
        }

        .topbar a {
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 10px;
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .08);
            transition: .3s
        }

        .topbar a:hover {
            background: rgba(139, 92, 246, .15);
            border-color: rgba(139, 92, 246, .3);
            color: #fff
        }

        .topbar .bal {
            display: flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, rgba(255, 215, 0, .1), rgba(255, 215, 0, .03));
            border: 1px solid rgba(255, 215, 0, .25);
            border-radius: 50px;
            padding: 7px 18px;
            font-weight: 700;
            font-size: 13px;
            color: var(--neon-yellow)
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px
        }

        .page-title {
            text-align: center;
            font-size: 22px;
            color: var(--neon-cyan);
            margin: 10px 0 5px;
            letter-spacing: 3px
        }

        .page-subtitle {
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, .4);
            margin-bottom: 20px
        }

        /* Filters */
        .filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            justify-content: center
        }

        .filter-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: rgba(255, 255, 255, .7);
            cursor: pointer;
            font-size: 12px;
            font-family: var(--font-pixel-en);
            transition: .3s
        }

        .filter-btn.active,
        .filter-btn:hover {
            border-color: var(--neon-purple);
            color: #fff;
            background: rgba(139, 92, 246, .15)
        }

        /* Summary Cards */
        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px
        }

        .summary-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            text-align: center
        }

        .summary-card .label {
            font-size: 10px;
            color: rgba(255, 255, 255, .4);
            text-transform: uppercase;
            letter-spacing: 2px
        }

        .summary-card .value {
            font-size: 20px;
            font-weight: 700;
            margin-top: 4px
        }

        .summary-card .value.green {
            color: var(--neon-green)
        }

        .summary-card .value.red {
            color: var(--neon-red)
        }

        .summary-card .value.cyan {
            color: var(--neon-cyan)
        }

        /* Transaction List */
        .tx-list {
            display: flex;
            flex-direction: column;
            gap: 6px
        }

        .tx-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            transition: .3s;
            cursor: default
        }

        .tx-item:hover {
            border-color: rgba(139, 92, 246, .3);
            background: var(--surface2)
        }

        .tx-icon {
            font-size: 22px;
            min-width: 36px;
            text-align: center
        }

        .tx-info {
            flex: 1;
            min-width: 0
        }

        .tx-type {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, .9)
        }

        .tx-time {
            font-size: 10px;
            color: rgba(255, 255, 255, .35);
            margin-top: 2px
        }

        .tx-detail {
            font-size: 10px;
            color: rgba(255, 255, 255, .3);
            margin-top: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .tx-amount {
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap
        }

        .tx-amount.positive {
            color: var(--neon-green)
        }

        .tx-amount.negative {
            color: var(--neon-red)
        }

        .tx-balance {
            font-size: 10px;
            color: rgba(255, 255, 255, .3);
            text-align: right;
            margin-top: 2px
        }

        /* Load More */
        .load-more {
            display: block;
            margin: 20px auto;
            padding: 12px 40px;
            border-radius: 25px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--neon-cyan);
            cursor: pointer;
            font-family: var(--font-pixel-en);
            font-size: 13px;
            transition: .3s
        }

        .load-more:hover {
            border-color: var(--neon-cyan);
            background: rgba(6, 182, 212, .1)
        }

        .load-more:disabled {
            opacity: .3;
            cursor: default
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, .3)
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px
        }

        .spinner {
            display: flex;
            justify-content: center;
            padding: 40px
        }

        .spinner::after {
            content: '';
            width: 32px;
            height: 32px;
            border: 3px solid transparent;
            border-top-color: var(--neon-purple);
            border-radius: 50%;
            animation: spin 1s linear infinite
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        @media (max-width: 480px) {
            .summary {
                grid-template-columns: 1fr
            }

            .container {
                padding: 12px
            }
        }
    </style>
</head>

<body>
    <noscript>
        <div
            style="background:#030014;color:#fff;padding:40px;text-align:center;font-family:sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;">
            <h2>⚠️ Bạn cần bật JavaScript để chơi Pixel PlayZone!</h2>
        </div>
    </noscript>
    <div id="ppz-loading"
        style="position:fixed;inset:0;background:#030014;z-index:99999;display:flex;justify-content:center;align-items:center;flex-direction:column;transition:opacity .5s">
        <div
            style="width:60px;height:60px;border:3px solid transparent;border-top-color:#8b5cf6;border-bottom-color:#06b6d4;border-radius:50%;animation:spin 1s linear infinite">
        </div>
        <p style="color:#8b5cf6;margin-top:16px;font-size:14px;letter-spacing:4px">LOADING</p>
    </div>
    <div class="bg-mesh"></div>

    <div class="topbar">
        <a href="/">← LOBBY</a>
        <div id="ppz-toolbar" style="display:flex;align-items:center;gap:6px"></div>
        <div class="bal">💰 <span id="bal">0</span> $</div>
    </div>

    <div class="container">
        <h1 class="page-title">📜 LỊCH SỬ GIAO DỊCH</h1>
        <p class="page-subtitle">Tất cả hoạt động trong tài khoản của bạn</p>

        <div class="summary">
            <div class="summary-card">
                <div class="label">Tổng thắng</div>
                <div class="value green" id="totalWin">0</div>
            </div>
            <div class="summary-card">
                <div class="label">Tổng thua</div>
                <div class="value red" id="totalLose">0</div>
            </div>
            <div class="summary-card">
                <div class="label">Lợi nhuận</div>
                <div class="value cyan" id="netProfit">0</div>
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-type="">Tất cả</button>
            <button class="filter-btn" data-type="mines">💣 Mines</button>
            <button class="filter-btn" data-type="crash">🚀 Crash</button>
            <button class="filter-btn" data-type="poker">🂡 Poker</button>
            <button class="filter-btn" data-type="taixiu">🎲 Tài Xỉu</button>
            <button class="filter-btn" data-type="flappy">🐦 Flappy</button>
            <button class="filter-btn" data-type="daily">🎁 Daily</button>
            <button class="filter-btn" data-type="transfer">💸 Transfer</button>
        </div>

        <div id="txList" class="tx-list">
            <div class="spinner"></div>
        </div>

        <button class="load-more" id="loadMore" style="display:none">Tải thêm...</button>
    </div>

    <script>
        const TYPE_MAP = {
            mines_bet: { icon: '💣', label: 'Đặt cược Mines' },
            mines_win: { icon: '💎', label: 'Thắng Mines' },
            mines_lose: { icon: '💥', label: 'Thua Mines' },
            mines_expire_refund: { icon: '⏰', label: 'Hoàn tiền Mines (hết hạn)' },
            crash_bet: { icon: '🚀', label: 'Đặt cược Crash' },
            crash_win: { icon: '🎉', label: 'Thắng Crash' },
            crash_bust: { icon: '💥', label: 'Thua Crash' },
            poker_win: { icon: '🏆', label: 'Thắng Poker' },
            poker_lose: { icon: '😢', label: 'Thua Poker' },
            poker_bet: { icon: '🂡', label: 'Đặt cược Poker' },
            taixiu_bet: { icon: '🎲', label: 'Đặt cược Tài Xỉu' },
            taixiu_win: { icon: '🎯', label: 'Thắng Tài Xỉu' },
            taixiu_lose: { icon: '😢', label: 'Thua Tài Xỉu' },
            flappy_reward: { icon: '🐦', label: 'Thưởng Flappy Bird' },
            daily_claim: { icon: '🎁', label: 'Phần thưởng hàng ngày' },
            signup_bonus: { icon: '🎉', label: 'Bonus đăng ký' },
            transfer_send: { icon: '📤', label: 'Chuyển tiền đi' },
            transfer_receive: { icon: '📥', label: 'Nhận chuyển tiền' },
        };

        let currentType = '';
        let offset = 0;
        const LIMIT = 50;
        let allTxs = [];

        // Fetch balance
        fetch('/api/me', { credentials: 'include' }).then(r => r.json()).then(d => {
            if (d.error) { window.location.href = '/'; return; }
            document.getElementById('bal').textContent = Number(d.balance || 0).toLocaleString('vi');
        }).catch(() => window.location.href = '/');

        // Filters
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentType = btn.dataset.type;
                offset = 0;
                allTxs = [];
                loadTransactions();
            });
        });

        async function loadTransactions() {
            const list = document.getElementById('txList');
            if (offset === 0) list.innerHTML = '<div class="spinner"></div>';

            let url = `/api/admin/transactions?limit=${LIMIT}&offset=${offset}`;
            if (currentType) url += `&type=${currentType}`;

            try {
                const r = await fetch(url, { credentials: 'include' });
                const d = await r.json();
                if (d.error) { list.innerHTML = '<div class="empty-state"><div class="icon">🔒</div><p>Vui lòng đăng nhập</p></div>'; return; }

                const txs = d.transactions || [];
                if (offset === 0) {
                    list.innerHTML = '';
                    allTxs = txs;
                } else {
                    allTxs = allTxs.concat(txs);
                }

                if (allTxs.length === 0) {
                    list.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>Chưa có giao dịch nào</p></div>';
                    document.getElementById('loadMore').style.display = 'none';
                    return;
                }

                // Render only new items
                txs.forEach(tx => {
                    const map = TYPE_MAP[tx.type] || { icon: '📝', label: tx.type };
                    const isPositive = tx.amount > 0;
                    const el = document.createElement('div');
                    el.className = 'tx-item';
                    const detailStr = tx.details ? Object.entries(tx.details).map(([k, v]) => `${k}: ${v}`).join(' • ') : '';
                    const time = new Date(tx.created_at).toLocaleString('vi-VN', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
                    el.innerHTML = `
                        <div class="tx-icon">${map.icon}</div>
                        <div class="tx-info">
                            <div class="tx-type">${map.label}</div>
                            <div class="tx-time">${time}</div>
                            ${detailStr ? `<div class="tx-detail">${detailStr}</div>` : ''}
                        </div>
                        <div>
                            <div class="tx-amount ${isPositive ? 'positive' : 'negative'}">${isPositive ? '+' : ''}${Number(tx.amount || 0).toLocaleString('vi')} $</div>
                            <div class="tx-balance">Số dư: ${Number(tx.balance_after || 0).toLocaleString('vi')} $</div>
                        </div>`;
                    list.appendChild(el);
                });

                // Update summary
                updateSummary();

                // Load more button
                const btn = document.getElementById('loadMore');
                if (txs.length >= LIMIT) {
                    btn.style.display = 'block';
                    offset += LIMIT;
                } else {
                    btn.style.display = 'none';
                }
            } catch (e) {
                console.error(e);
                if (offset === 0) list.innerHTML = '<div class="empty-state"><div class="icon">❌</div><p>Lỗi tải dữ liệu</p></div>';
            }
        }

        function updateSummary() {
            let totalWin = 0, totalLose = 0;
            allTxs.forEach(tx => {
                if (tx.amount > 0) totalWin += tx.amount;
                else totalLose += Math.abs(tx.amount);
            });
            document.getElementById('totalWin').textContent = '+' + totalWin.toLocaleString('vi') + ' $';
            document.getElementById('totalLose').textContent = '-' + totalLose.toLocaleString('vi') + ' $';
            const net = totalWin - totalLose;
            const netEl = document.getElementById('netProfit');
            netEl.textContent = (net >= 0 ? '+' : '') + net.toLocaleString('vi') + ' $';
            netEl.className = 'value ' + (net >= 0 ? 'green' : 'red');
        }

        document.getElementById('loadMore').addEventListener('click', loadTransactions);

        // Initial load
        loadTransactions();
    </script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/sound-system.js"></script>
    <script src="/js/notify-system.js"></script>
    <script src="/js/chat-system.js"></script>
    <script src="/js/live-feed.js"></script>
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => { });</script>
    <script>window.addEventListener('load', () => { const l = document.getElementById('ppz-loading'); if (l) { l.style.opacity = '0'; setTimeout(() => l.remove(), 500) } })</script>
</body>

</html>
