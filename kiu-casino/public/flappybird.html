<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#70c5ce">
    <meta name="description" content="Flappy Bird - Trò chơi giải trí tại Royal Casino">
    <title>Flappy Bird - Royal Casino</title>
    <link rel="stylesheet" href="css/flappybird.css">
    <style>
        /* Asset Preloading (hidden) */
        #assets {
            display: none;
        }
    </style>
</head>

<body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-spinner"></div>
        <p style="color: white; margin-top: 20px; font-size: 14px;">Đang tải...</p>
    </div>

    <!-- Asset Container (Preloaded in DOM for ease of use) -->
    <div id="assets">
        <!-- Blue Bird -->
        <img id="bird-blue-0" src="flappy_assets/sprites/bluebird-downflap.png" alt="blue-down">
        <img id="bird-blue-1" src="flappy_assets/sprites/bluebird-midflap.png" alt="blue-mid">
        <img id="bird-blue-2" src="flappy_assets/sprites/bluebird-upflap.png" alt="blue-up">

        <!-- Red Bird -->
        <img id="bird-red-0" src="flappy_assets/sprites/redbird-downflap.png" alt="red-down">
        <img id="bird-red-1" src="flappy_assets/sprites/redbird-midflap.png" alt="red-mid">
        <img id="bird-red-2" src="flappy_assets/sprites/redbird-upflap.png" alt="red-up">

        <!-- Yellow Bird -->
        <img id="bird-yellow-0" src="flappy_assets/sprites/yellowbird-downflap.png" alt="yellow-down">
        <img id="bird-yellow-1" src="flappy_assets/sprites/yellowbird-midflap.png" alt="yellow-mid">
        <img id="bird-yellow-2" src="flappy_assets/sprites/yellowbird-upflap.png" alt="yellow-up">

        <!-- Backgrounds -->
        <img id="bg-day" src="flappy_assets/sprites/background-day.png" alt="bg-day">
        <img id="bg-night" src="flappy_assets/sprites/background-night.png" alt="bg-night">

        <!-- Ground -->
        <img id="ground" src="flappy_assets/sprites/base.png" alt="ground">

        <!-- Pipes -->
        <img id="pipe-green" src="flappy_assets/sprites/pipe-green.png" alt="pipe-green">
        <img id="pipe-red" src="flappy_assets/sprites/pipe-red.png" alt="pipe-red">

        <!-- UI -->
        <img id="ui-message" src="flappy_assets/sprites/message.png" alt="message">
        <img id="ui-gameover" src="flappy_assets/sprites/gameover.png" alt="gameover">

        <!-- Numbers -->
        <img id="num-0" src="flappy_assets/sprites/0.png" alt="0">
        <img id="num-1" src="flappy_assets/sprites/1.png" alt="1">
        <img id="num-2" src="flappy_assets/sprites/2.png" alt="2">
        <img id="num-3" src="flappy_assets/sprites/3.png" alt="3">
        <img id="num-4" src="flappy_assets/sprites/4.png" alt="4">
        <img id="num-5" src="flappy_assets/sprites/5.png" alt="5">
        <img id="num-6" src="flappy_assets/sprites/6.png" alt="6">
        <img id="num-7" src="flappy_assets/sprites/7.png" alt="7">
        <img id="num-8" src="flappy_assets/sprites/8.png" alt="8">
        <img id="num-9" src="flappy_assets/sprites/9.png" alt="9">
    </div>

    <div id="game-container">
        <a href="/" class="back-btn">Quay lại Casino</a>

        <!-- High Score Badge -->
        <div class="high-score-badge" id="highScoreBadge" style="display: none;">
            🏆 Best: <span id="highScoreValue">0</span>
        </div>

        <!-- User Balance (Coin Display) -->
        <div id="ui-balance" class="balance-badge">
            💰 <span id="userBalance">...</span>
        </div>

        <canvas id="gameCanvas" width="320" height="480"></canvas>

        <!-- Particles Container -->
        <div class="particles" id="particlesContainer"></div>

        <div id="ui-layer">
            <!-- Score Display -->
            <div id="score">0</div>

            <!-- Combo Display -->
            <div class="combo-display" id="comboDisplay"></div>

            <!-- Start Message -->
            <div id="start-message">
                <h1>FLAPPY BIRD</h1>
                <p class="instruction">Nhấn <strong>Space</strong> hoặc <strong>Click/Tap</strong> để nhảy</p>
                <!-- Canvas draws 'Get Ready' here -->
                <!-- No button needed, tap to start -->
            </div>

            <!-- Game Over Message -->
            <div id="game-over" class="hidden">
                <h1>GAME OVER!</h1>

                <div class="score-display">
                    <p>Điểm số của bạn</p>
                    <p class="score-number"><span id="final-score">0</span> điểm</p>
                </div>

                <div class="score-display">
                    <p>Phần thưởng</p>
                    <p class="gold-number">+<span id="gold-earned">0</span> Vàng 💰</p>
                </div>

                <div class="score-display" id="newRecordBadge" style="display: none;">
                    <p style="color: #f5576c; font-size: 16px;">🎉 KỶ LỤC MỚI! 🎉</p>
                </div>

                <button id="btn-restart" class="btn">Chơi lại</button>
            </div>
        </div>
    </div>

    <!-- Audio Elements (Optional - uncomment to enable sounds) -->
    <!--
    <audio id="jumpSound" preload="auto">
        <source src="sounds/jump.mp3" type="audio/mpeg">
    </audio>
    <audio id="scoreSound" preload="auto">
        <source src="sounds/score.mp3" type="audio/mpeg">
    </audio>
    <audio id="gameoverSound" preload="auto">
        <source src="sounds/gameover.mp3" type="audio/mpeg">
    </audio>
    -->

    <script src="js/flappybird.js"></script>
</body>

</html>
