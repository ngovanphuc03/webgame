<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird - Royal Casino</title>
    <link rel="stylesheet" href="css/flappybird.css">
    <style>
        /* Asset Preloading (hidden) */
        #assets {
            display: none;
        }
    </style>
</head>

<body>

    <!-- Asset Container (Preloaded in DOM for ease of use) -->
    <div id="assets">
        <!-- Birds (Style 1 & 2) -->
        <img id="bird-1" src="flappy_assets/Flappy Bird Assets/Player/StyleBird1/Bird1-1.png" alt="bird1">
        <img id="bird-2" src="flappy_assets/Flappy Bird Assets/Player/StyleBird2/Bird2-1.png" alt="bird2">

        <!-- Pipes (Style 1 to 5) -->
        <img id="pipe-1" src="flappy_assets/Flappy Bird Assets/Tiles/Style 1/PipeStyle1.png" alt="pipe1">
        <img id="pipe-2" src="flappy_assets/Flappy Bird Assets/Tiles/Style 2/PipeStyle2.png" alt="pipe2">
        <img id="pipe-3" src="flappy_assets/Flappy Bird Assets/Tiles/Style 3/PipeStyle3.png" alt="pipe3">
        <img id="pipe-4" src="flappy_assets/Flappy Bird Assets/Tiles/Style 4/PipeStyle4.png" alt="pipe4">
        <img id="pipe-5" src="flappy_assets/Flappy Bird Assets/Tiles/Style 5/PipeStyle5.png" alt="pipe5">

        <!-- Grounds/Tiles (Matching Pipes) -->
        <img id="ground-1" src="flappy_assets/Flappy Bird Assets/Tiles/Style 1/TileStyle1.png" alt="ground1">
        <img id="ground-2" src="flappy_assets/Flappy Bird Assets/Tiles/Style 2/TileStyle2.png" alt="ground2">
        <img id="ground-3" src="flappy_assets/Flappy Bird Assets/Tiles/Style 3/TileStyle3.png" alt="ground3">
        <img id="ground-4" src="flappy_assets/Flappy Bird Assets/Tiles/Style 4/TileStyle4.png" alt="ground4">
        <img id="ground-5" src="flappy_assets/Flappy Bird Assets/Tiles/Style 5/TileStyle5.png" alt="ground5">

        <!-- Backgrounds (1 to 5 for variety) -->

        <img id="bg-1" src="flappy_assets/Flappy Bird Assets/Background/Background1.png" alt="bg1">
        <img id="bg-2" src="flappy_assets/Flappy Bird Assets/Background/Background2.png" alt="bg2">
        <img id="bg-3" src="flappy_assets/Flappy Bird Assets/Background/Background3.png" alt="bg3">
        <img id="bg-4" src="flappy_assets/Flappy Bird Assets/Background/Background4.png" alt="bg4">
        <img id="bg-5" src="flappy_assets/Flappy Bird Assets/Background/Background5.png" alt="bg5">
    </div>


    <div id="game-container">
        <a href="/" class="back-btn">← Quay lại Casino</a>
        <canvas id="gameCanvas" width="320" height="480"></canvas>

        <div id="ui-layer">
            <div id="score">0</div>

            <div id="start-message">
                <h1>FLAPPY BIRD</h1>
                <p>Nhấn Space hoặc Click để nhảy</p>
                <p style="color: gold; font-size: 12px;">1 Điểm = 10 Vàng</p>
                <button id="btn-start" class="btn">Bắt Đầu</button>
            </div>

            <div id="game-over" class="hidden">
                <h1>GAME OVER</h1>
                <p>Điểm: <span id="final-score">0</span></p>
                <p style="color: gold;">+<span id="gold-earned">0</span> Vàng</p>
                <button id="btn-restart" class="btn">Chơi Lại</button>
            </div>
        </div>
    </div>

    <script src="js/flappybird.js"></script>
</body>

</html>
