<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>ROYAL CASINO - Mobile</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Be+Vietnam+Pro:wght@400;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="mobile-common.css">

    <style>
        /* DASHBOARD LAYOUT */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding-bottom: var(--nav-height);
            /* Make space for bottom nav */
            background: radial-gradient(circle at 50% -20%, #1e1135 0%, #000 100%);
        }

        /* HEADER */
        .dashboard-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: var(--header-height);
        }

        .user-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 12px 4px 4px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .avatar-circle {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #ffd700, #ffae00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #000;
            font-size: 14px;
        }

        .balance-display {
            font-weight: 700;
            color: var(--gold);
            font-size: 14px;
        }

        /* CONTENT AREA */
        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 10px 20px;
        }

        /* PROMO BANNER */
        .promo-banner {
            width: 100%;
            aspect-ratio: 16/7;
            background: linear-gradient(135deg, #2d1b4e, #0f0a1e);
            border-radius: 20px;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 215, 0, 0.2);
            display: flex;
            align-items: center;
            padding: 20px;
        }

        .promo-text h3 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: 18px;
            margin-bottom: 5px;
        }

        .promo-text p {
            font-size: 12px;
            opacity: 0.7;
        }

        .promo-visual {
            position: absolute;
            right: -20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 80px;
            opacity: 0.2;
        }

        /* GAME GRID */
        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 15px;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 16px;
            background: var(--gold);
            border-radius: 2px;
        }

        .game-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding-bottom: 20px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            transition: all 0.2s;
            text-decoration: none;
            color: white;
        }

        .game-card:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.08);
        }

        .game-icon-3d {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #3a2a5e, #1a102a);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .game-card.hot::after {
            content: 'HOT';
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff4757;
            font-size: 9px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 6px;
        }

        .game-name {
            font-weight: 700;
            font-size: 14px;
        }

        .game-sub {
            font-size: 11px;
            opacity: 0.5;
        }

        /* BOTTOM NAV */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            padding-bottom: var(--safe-bottom);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 10px;
            font-weight: 600;
            width: 60px;
        }

        .nav-item.active {
            color: var(--gold);
        }

        .nav-icon {
            font-size: 22px;
            margin-bottom: 2px;
        }

        .nav-item.active .nav-icon {
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.5));
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="user-pill glass-panel">
                <div class="avatar-circle">VIP</div>
                <div id="username-mobile" style="font-size:12px; font-weight:600;">...</div>
            </div>

            <div class="user-pill glass-panel">
                <span style="font-size:12px;">💰</span>
                <span class="balance-display" id="balance-index-mobile">...</span>
            </div>
        </header>

        <!-- Scrollable Content -->
        <main class="content-scroll">

            <!-- Banner -->
            <div class="promo-banner touch-effect">
                <div class="promo-text">
                    <h3>ROYAL CASINO</h3>
                    <p>Trải nghiệm đẳng cấp thượng lưu.<br>Nạp rút siêu tốc 24/7.</p>
                </div>
                <div class="promo-visual">👑</div>
            </div>

            <!-- Game Grid -->
            <div class="section-title">TRÒ CHƠI NỔI BẬT</div>
            <div class="game-grid">

                <!-- Tai Xiu -->
                <a href="/taixiu-mobile.html" class="game-card hot">
                    <div class="game-icon-3d" style="background: linear-gradient(135deg, #e74c3c, #c0392b);">🎲</div>
                    <div>
                        <div class="game-name">TÀI XỈU</div>
                        <div class="game-sub">Xóc đĩa truyền thống</div>
                    </div>
                </a>

                <!-- Poker -->
                <a href="/poker-mobile.html?buyin=5000" class="game-card">
                    <div class="game-icon-3d" style="background: linear-gradient(135deg, #2980b9, #2c3e50);">🃏</div>
                    <div>
                        <div class="game-name">POKER</div>
                        <div class="game-sub">Texas Hold'em</div>
                    </div>
                </a>

                <!-- Download -->
                <a href="/download.html" class="game-card">
                    <div class="game-icon-3d" style="background: linear-gradient(135deg, #27ae60, #16a085);">📱</div>
                    <div>
                        <div class="game-name">TẢI APP</div>
                        <div class="game-sub">Android APK</div>
                    </div>
                </a>

                <!-- Coming Soon -->
                <div class="game-card" style="opacity: 0.5;">
                    <div class="game-icon-3d" style="background: #333;">🔒</div>
                    <div>
                        <div class="game-name">BẦU CUA</div>
                        <div class="game-sub">Sắp ra mắt</div>
                    </div>
                </div>

            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <div class="nav-item active">
                <span class="nav-icon">🏠</span>
                <span>Trang Chủ</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">💎</span>
                <span>Nạp Tiền</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">📜</span>
                <span>Lịch Sử</span>
            </div>
            <div class="nav-item" onclick="logout()">
                <span class="nav-icon">🚪</span>
                <span>Đăng Xuất</span>
            </div>
        </nav>
    </div>

    <script>
        // Fetch user info
        fetch('/api/me')
            .then(r => r.json())
            .then(user => {
                const userInfoDiv = document.getElementById('user-info-mobile');
                const gamesContainer = document.querySelector('.games-container');

                if (user.error) {
                    // Not logged in: Show Login Button
                    userInfoDiv.innerHTML = `
                        <div style="width:100%; text-align:center;">
                            <a href="/auth/discord" style="
                                display: inline-block;
                                background: #5865F2;
                                color: white;
                                padding: 10px 20px;
                                border-radius: 20px;
                                text-decoration: none;
                                font-weight: bold;
                                font-family: 'Be Vietnam Pro', sans-serif;
                                box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4);
                            ">
                                🎮 Đăng nhập bằng Discord
                            </a>
                        </div>
                    `;
                    // Hide logout button if exists
                    const logoutBtn = document.querySelector('.logout-btn-mobile');
                    if (logoutBtn) logoutBtn.parentElement.style.display = 'none';
                    return;
                }

                // Logged in
                document.getElementById('username-mobile').innerText = user.username || 'Player';
                document.getElementById('balance-index-mobile').innerText = formatMoney(user.balance || 0);
            })
            .catch(err => {
                console.error('Failed to fetch user info:', err);
            });

        // Hide StatusBar in Capacitor
        if (window.Capacitor) {
            import('https://unpkg.com/@capacitor/status-bar@latest/dist/plugin.js').then(module => {
                // StatusBar is usually auto-loaded in Capacitor
            });

            // Try hiding status bar
            const hideStatusBar = async () => {
                try {
                    const { StatusBar } = await import('@capacitor/status-bar'); // This won't work in vanilla without bundler easily.
                    // Fallback to global Capacitor object if available
                } catch (e) { console.log(e); }
            };
        }

        function formatMoney(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        function logout() {
            if (confirm('Bạn có chắc muốn đăng xuất?')) {
                fetch('/logout', { method: 'POST' })
                    .then(() => window.location.href = '/')
                    .catch(() => window.location.href = '/');
            }
        }
    </script>
</body>

</html>
