<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>ROYAL CASINO - Mobile</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Be+Vietnam+Pro:wght@400;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="mobile-common.css">

    <style>
        body {
            background: linear-gradient(180deg, #0a0612 0%, #1a0f2e 100%);
            display: flex;
            flex-direction: column;
            padding: 0;
        }

        .mobile-header {
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.7));
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
        }

        .mobile-logo {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold), #fff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .mobile-tagline {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Be Vietnam Pro', sans-serif;
        }

        .user-info-mobile {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-name-mobile {
            font-weight: 600;
            color: #fff;
        }

        .user-balance-mobile {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 215, 0, 0.1));
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 15px;
            padding: 8px 18px;
            color: var(--gold);
            font-weight: 700;
            font-size: 16px;
        }

        .games-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .game-card-mobile {
            background: linear-gradient(160deg, rgba(40, 30, 60, 0.8), rgba(20, 15, 35, 0.9));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            min-height: 120px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s;
        }

        .game-card-mobile:active {
            transform: scale(0.98);
            border-color: var(--gold);
        }

        .game-icon-mobile {
            font-size: 60px;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 15px;
            flex-shrink: 0;
        }

        .game-info-mobile {
            flex: 1;
        }

        .game-title-mobile {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 5px;
        }

        .game-desc-mobile {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .game-badge-mobile {
            display: inline-block;
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            color: #fff;
            font-size: 10px;
            padding: 4px 10px;
            border-radius: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-new {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #000;
        }

        .footer-mobile {
            padding: 15px;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
            background: rgba(0, 0, 0, 0.3);
        }

        .logout-btn-mobile {
            background: transparent;
            border: 1px solid rgba(255, 100, 100, 0.5);
            color: #ff6b6b;
            padding: 10px 20px;
            border-radius: 15px;
            font-size: 14px;
            margin-top: 10px;
            width: 100%;
        }

        /* Landscape reminder */
        .landscape-reminder {
            background: linear-gradient(90deg, rgba(255, 193, 7, 0.9), rgba(255, 152, 0, 0.9));
            color: #000;
            padding: 10px;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <div class="mobile-header">
        <div class="mobile-logo">👑 ROYAL CASINO</div>
        <div class="mobile-tagline">VIP Gaming Experience</div>
    </div>

    <!-- Landscape Reminder -->
    <div class="landscape-reminder">
        💡 Mẹo: Quay ngang điện thoại để có trải nghiệm tốt nhất khi chơi game!
    </div>

    <!-- User Info -->
    <div class="user-info-mobile" id="user-info-mobile">
        <div class="user-name-mobile" id="username-mobile">...</div>
        <div class="user-balance-mobile" id="balance-index-mobile">...</div>
    </div>

    <!-- Games List -->
    <div class="games-container">
        <a href="/taixiu-mobile.html" class="game-card-mobile">
            <div class="game-icon-mobile">🎲</div>
            <div class="game-info-mobile">
                <div class="game-title-mobile">TÀI XỈU</div>
                <div class="game-desc-mobile">Xóc đĩa truyền thống, tỷ lệ 1:1.98</div>
                <span class="game-badge-mobile">HOT</span>
            </div>
        </a>

        <a href="/poker-mobile.html?buyin=5000" class="game-card-mobile">
            <div class="game-icon-mobile">🃏</div>
            <div class="game-info-mobile">
                <div class="game-title-mobile">POKER</div>
                <div class="game-desc-mobile">Texas Hold'em No Limit</div>
                <span class="game-badge-mobile badge-new">VIP</span>
            </div>
        </a>

        <a href="/download.html" class="game-card-mobile"
            style="min-height: 80px; background: linear-gradient(135deg, #2d1f3d, #1a1025); border-color: rgba(255,255,255,0.1);">
            <div class="game-icon-mobile" style="font-size: 40px; width: 60px; height: 60px;">📱</div>
            <div class="game-info-mobile">
                <div class="game-title-mobile" style="font-size: 16px;">TẢI APP ANDROID</div>
                <div class="game-desc-mobile">Trải nghiệm mượt mà hơn</div>
            </div>
            <span class="game-badge-mobile" style="background: #28a745;">MỚI</span>
        </a>

        <div style="text-align: center; padding: 20px;">
            <button class="logout-btn-mobile" onclick="logout()">Đăng Xuất</button>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer-mobile">
        © 2026 Royal Casino. All Rights Reserved.
    </div>

    <script>
        // Fetch user info
        fetch('/api/me')
            .then(r => r.json())
            .then(user => {
                const userInfoDiv = document.getElementById('user-info-mobile');
                const gamesContainer = document.querySelector('.games-container');

                if (user.error) {
                    // Not logged in: Show Login Button
                    userInfoDiv.innerHTML = `
                        <div style="width:100%; text-align:center;">
                            <a href="/auth/discord" style="
                                display: inline-block;
                                background: #5865F2;
                                color: white;
                                padding: 10px 20px;
                                border-radius: 20px;
                                text-decoration: none;
                                font-weight: bold;
                                font-family: 'Be Vietnam Pro', sans-serif;
                                box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4);
                            ">
                                🎮 Đăng nhập bằng Discord
                            </a>
                        </div>
                    `;
                    // Hide logout button if exists
                    const logoutBtn = document.querySelector('.logout-btn-mobile');
                    if (logoutBtn) logoutBtn.parentElement.style.display = 'none';
                    return;
                }

                // Logged in
                document.getElementById('username-mobile').innerText = user.username || 'Player';
                document.getElementById('balance-index-mobile').innerText = formatMoney(user.balance || 0);
            })
            .catch(err => {
                console.error('Failed to fetch user info:', err);
            });

        // Hide StatusBar in Capacitor
        if (window.Capacitor) {
            import('https://unpkg.com/@capacitor/status-bar@latest/dist/plugin.js').then(module => {
                // StatusBar is usually auto-loaded in Capacitor
            });

            // Try hiding status bar
            const hideStatusBar = async () => {
                try {
                    const { StatusBar } = await import('@capacitor/status-bar'); // This won't work in vanilla without bundler easily.
                    // Fallback to global Capacitor object if available
                } catch (e) { console.log(e); }
            };
        }

        function formatMoney(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        function logout() {
            if (confirm('Bạn có chắc muốn đăng xuất?')) {
                fetch('/logout', { method: 'POST' })
                    .then(() => window.location.href = '/')
                    .catch(() => window.location.href = '/');
            }
        }
    </script>
</body>

</html>
