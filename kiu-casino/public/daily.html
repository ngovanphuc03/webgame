<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Daily Reward - Vòng quay may mắn hàng ngày tại Pixel PlayZone">
    <meta property="og:title" content="🎁 Daily Reward - Pixel PlayZone">
    <meta property="og:description" content="Đăng nhập hàng ngày, quay vòng quay may mắn nhận xu thưởng miễn phí!">
    <meta property="og:image" content="/images/icons/icon-512.svg">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#030014">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎁</text></svg>">
    <title>🎁 Daily Reward - Pixel PlayZone</title>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DearPix', 'Rajdhani', sans-serif;
            background: #030014;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ═══ AMBIENT ═══ */
        .ambient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: -1;
            animation: orb-drift 9s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: rgba(255, 107, 107, 0.1);
            top: 3%;
            right: -6%;
        }

        .orb-2 {
            width: 250px;
            height: 250px;
            background: rgba(255, 230, 0, 0.08);
            bottom: 12%;
            left: -6%;
            animation-delay: 4s;
        }

        .orb-3 {
            width: 180px;
            height: 180px;
            background: rgba(138, 43, 226, 0.06);
            top: 40%;
            left: 30%;
            animation-delay: 2s;
        }

        @keyframes orb-drift {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(20px, -12px) scale(1.12);
            }
        }

        .sparkle-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .sparkle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #ffd700;
            border-radius: 50%;
            animation: sfloat linear infinite;
            box-shadow: 0 0 6px currentColor;
        }

        @keyframes sfloat {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0);
                opacity: 0;
            }

            12% {
                opacity: 0.9;
                transform: scale(1);
            }

            85% {
                opacity: 0.6;
            }

            100% {
                transform: translateY(-10vh) rotate(360deg) scale(0);
                opacity: 0;
            }
        }

        /* ═══ TOP BAR ═══ */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            height: 56px;
            background: rgba(3, 0, 20, .85);
            backdrop-filter: blur(20px) saturate(1.5);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            text-decoration: none;
            font-size: 15px;
            transition: 0.3s;
            font-family: 'DearPix', 'Orbitron', sans-serif;
        }

        .back-btn:hover {
            background: rgba(139, 92, 246, 0.15);
            border-color: rgba(139, 92, 246, .3);
        }

        .balance-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, rgba(255, 215, 0, .1), rgba(255, 215, 0, .03));
            border: 1px solid rgba(255, 215, 0, .25);
            border-radius: 50px;
            padding: 7px 18px;
            font-weight: 700;
            color: #ffd700;
            font-size: 15px;
            font-family: 'DearPix', 'Orbitron', sans-serif;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }

        .balance-pill::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 230, 0, 0.1), transparent);
            animation: bshine 3s ease infinite;
        }

        @keyframes bshine {
            0% {
                left: -100%;
            }

            100% {
                left: 200%;
            }
        }

        /* ═══ PAGE HEADER ═══ */
        .page-title {
            margin-top: 28px;
            font-size: 26px;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(90deg, #ffd700, #ff9e00, #ffd700);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            animation: tshimmer 3s ease infinite;
        }

        @keyframes tshimmer {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        .page-subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            margin-top: 5px;
            text-align: center;
        }

        /* ═══ STREAK ═══ */
        .streak-bar {
            margin-top: 22px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 500px;
        }

        .streak-day {
            width: 58px;
            height: 68px;
            background: rgba(0, 0, 0, 0.35);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            gap: 2px;
            position: relative;
            transition: 0.4s;
            backdrop-filter: blur(5px);
        }

        .streak-day:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .streak-day.claimed {
            border-color: #00ff9d;
            background: rgba(0, 255, 157, 0.1);
            box-shadow: 0 0 12px rgba(0, 255, 157, 0.15);
        }

        .streak-day.claimed::after {
            content: '✓';
            position: absolute;
            top: -5px;
            right: -5px;
            background: #00ff9d;
            color: #000;
            width: 17px;
            height: 17px;
            border-radius: 50%;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
        }

        .streak-day.today {
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 230, 0, 0.25);
            animation: ptoday 2s infinite;
        }

        @keyframes ptoday {

            0%,
            100% {
                box-shadow: 0 0 12px rgba(255, 230, 0, 0.2);
            }

            50% {
                box-shadow: 0 0 25px rgba(255, 230, 0, 0.4);
            }
        }

        .streak-reward {
            font-size: 18px;
        }

        .streak-label {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
        }

        .streak-gold {
            color: #ffd700;
            font-size: 14px;
            font-weight: 800;
        }

        /* ═══ WHEEL ═══ */
        .wheel-section {
            margin-top: 25px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wheel-container {
            position: relative;
            width: 310px;
            height: 310px;
        }

        .wheel-canvas {
            width: 310px;
            height: 310px;
            border-radius: 50%;
            border: 4px solid #ffd700;
            box-shadow: 0 0 35px rgba(255, 230, 0, 0.2), 0 0 70px rgba(255, 230, 0, 0.08), inset 0 0 18px rgba(0, 0, 0, 0.5);
            transition: transform 4s cubic-bezier(0.2, 0.8, 0.3, 1);
        }

        .wheel-container::before {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 2px dashed rgba(255, 230, 0, 0.15);
            animation: wring 25s linear infinite;
            pointer-events: none;
        }

        .wheel-container::after {
            content: '';
            position: absolute;
            inset: -18px;
            border-radius: 50%;
            border: 1px dashed rgba(138, 43, 226, 0.1);
            animation: wring 35s linear infinite reverse;
            pointer-events: none;
        }

        @keyframes wring {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .wheel-pointer {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            z-index: 10;
            filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.5));
        }

        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #ffd700, #ff9e00);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 900;
            color: #000;
            box-shadow: 0 0 18px rgba(255, 230, 0, 0.4);
            z-index: 5;
        }

        .spin-wheel-btn {
            margin-top: 22px;
            padding: 15px 45px;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffd700, #ff9e00);
            color: #000;
            box-shadow: 0 5px 25px rgba(255, 215, 0, 0.3);
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .spin-wheel-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: btnshine 2.5s ease infinite;
        }

        @keyframes btnshine {
            0% {
                left: -100%;
            }

            100% {
                left: 200%;
            }
        }

        .spin-wheel-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 35px rgba(255, 215, 0, 0.45);
        }

        .spin-wheel-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .cooldown-msg {
            margin-top: 12px;
            font-size: 13px;
            color: #ff6b6b;
            text-align: center;
            font-weight: 700;
        }

        /* ═══ RESULT POPUP ═══ */
        .result-popup {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        .result-popup.active {
            display: flex;
        }

        .result-box {
            background: linear-gradient(135deg, rgba(12, 6, 30, .98), rgba(20, 10, 45, .95));
            border: 1px solid rgba(139, 92, 246, .3);
            border-radius: 20px;
            padding: 35px;
            text-align: center;
            box-shadow: 0 0 70px rgba(139, 92, 246, 0.15);
            animation: rpop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes rpop {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .result-box h2 {
            font-size: 26px;
            color: #ffd700;
            margin-bottom: 8px;
        }

        .result-box .reward-amount {
            font-size: 38px;
            color: #00ff9d;
            font-weight: 900;
            margin: 12px 0;
        }

        .result-box .reward-emoji {
            font-size: 55px;
        }

        .result-box button {
            margin-top: 18px;
            padding: 12px 35px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ffd700, #ff9e00);
            color: #000;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .result-box button:hover {
            transform: translateY(-2px);
        }

        /* ═══ CONFETTI ═══ */
        .confetti-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 200;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: cfall 3s linear forwards;
        }

        @keyframes cfall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* ═══ RESPONSIVE ═══ */
        @media (max-width: 400px) {

            .wheel-container,
            .wheel-canvas {
                width: 270px;
                height: 270px;
            }

            .streak-day {
                width: 48px;
                height: 58px;
            }

            .page-title {
                font-size: 20px;
            }

            .spin-wheel-btn {
                padding: 12px 35px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="ppz-bg-mesh"></div>
    <noscript>
        <div
            style="background:#030014;color:#fff;padding:40px;text-align:center;font-family:sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;">
            <h2>⚠️ Bạn cần bật JavaScript để chơi Pixel PlayZone!</h2>
        </div>
    </noscript>
    <div id="ppz-loading"
        style="position:fixed;inset:0;background:#030014;z-index:99999;display:flex;justify-content:center;align-items:center;flex-direction:column;transition:opacity .5s">
        <div
            style="width:60px;height:60px;border:3px solid transparent;border-top-color:#8b5cf6;border-bottom-color:#06b6d4;border-radius:50%;animation:ppzSpin 1s linear infinite">
        </div>
        <p style="color:#8b5cf6;margin-top:16px;font-size:14px;letter-spacing:4px">LOADING</p>
    </div>
    <style>
        @keyframes ppzSpin {
            to {
                transform: rotate(360deg)
            }
        }
    </style>
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
    <div class="sparkle-container" id="sparkleContainer"></div>

    <div class="top-bar">
        <a href="/" class="back-btn">← LOBBY</a>
        <div id="ppz-toolbar" style="display:flex;align-items:center;gap:6px"></div>
        <div class="balance-pill">💰 <span id="balance">0</span> $</div>
    </div>

    <h1 class="page-title">🎁 PHẦN THƯỞNG HÀNG NGÀY</h1>
    <p class="page-subtitle">Đăng nhập mỗi ngày để nhận thưởng liên tục!</p>

    <div class="streak-bar" id="streakBar"></div>

    <div class="wheel-section">
        <div class="wheel-container">
            <div class="wheel-pointer">🔽</div>
            <canvas class="wheel-canvas" id="wheelCanvas" width="310" height="310"></canvas>
            <div class="wheel-center">🎯</div>
        </div>
        <button class="spin-wheel-btn" id="spinWheelBtn" onclick="spinWheel()">🎁 NHẬN THƯỞNG</button>
        <div class="cooldown-msg" id="cooldownMsg"></div>
    </div>

    <div class="result-popup" id="resultPopup">
        <div class="result-box">
            <h2>🎉 CHÚC MỪNG!</h2>
            <div class="reward-emoji" id="rewardEmoji">💰</div>
            <div class="reward-amount" id="rewardAmount">+5,000 $</div>
            <button onclick="closeResult()">TUYỆT VỜI!</button>
        </div>
    </div>

    <div class="confetti-container" id="confettiContainer"></div>

    <script>
        const WHEEL_SEGMENTS = [
            { label: '500', value: 500, color: '#e74c3c', emoji: '🪙' },
            { label: '1,000', value: 1000, color: '#e67e22', emoji: '💰' },
            { label: '2,000', value: 2000, color: '#f1c40f', emoji: '💎' },
            { label: '500', value: 500, color: '#2ecc71', emoji: '🪙' },
            { label: '3,000', value: 3000, color: '#1abc9c', emoji: '🌟' },
            { label: '1,000', value: 1000, color: '#3498db', emoji: '💰' },
            { label: '5,000', value: 5000, color: '#9b59b6', emoji: '👑' },
            { label: '1,500', value: 1500, color: '#e91e63', emoji: '🔥' },
        ];

        const STREAK_REWARDS = [
            { day: 1, reward: 500, emoji: '🪙' },
            { day: 2, reward: 1000, emoji: '💰' },
            { day: 3, reward: 1500, emoji: '💎' },
            { day: 4, reward: 2000, emoji: '⭐' },
            { day: 5, reward: 3000, emoji: '🔥' },
            { day: 6, reward: 4000, emoji: '🌟' },
            { day: 7, reward: 10000, emoji: '👑' },
        ];

        let balance = 0, currentAngle = 0, isSpinning = false;

        const SFX = {
            spin: new Audio('/sounds/daily/spin.mp3'),
            spinTick: new Audio('/sounds/daily/spin_tick.mp3'),
            reveal: new Audio('/sounds/daily/reveal.mp3'),
            win: new Audio('/sounds/win.mp3'),
            tick: new Audio('/sounds/tick.mp3'),
            click: new Audio('/sounds/click.mp3'),
        };
        Object.values(SFX).forEach(a => { a.volume = 0.5; a.preload = 'auto'; });
        SFX.win.volume = 0.7; SFX.spinTick.volume = 0.3;
        function playSound(n) {
            // Try SFX engine first
            if (window.SFX && window.SFX.play) {
                const nameMap = { spin: 'daily_spin', spinTick: 'daily_spin_tick', reveal: 'daily_reveal', win: 'daily_win', click: 'click', tick: 'tick' };
                try { window.SFX.play(nameMap[name] || name); return; } catch (e) { }
            }
            // Fallback to mp3
            // Respect global sound settings
            if (window.PPZSound) { const gs = window.PPZSound.getSettings(); if (!gs.sfxOn) return; }
            try {
                const a = SFX[n]; if (!a) return;
                const globalVol = window.PPZSound ? window.PPZSound.getSettings().sfxVol : 1;
                a.volume = (n === 'win' ? 0.7 : n === 'spinTick' ? 0.3 : 0.5) * globalVol;
                a.currentTime = 0; a.play().catch(() => { });
            } catch (e) { }
        }

        function drawWheel() {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const size = 310;
            const cx = size / 2, cy = size / 2, r = cx - 5;
            const segAngle = (2 * Math.PI) / WHEEL_SEGMENTS.length;

            ctx.clearRect(0, 0, size, size);

            WHEEL_SEGMENTS.forEach((seg, i) => {
                const startAngle = i * segAngle - Math.PI / 2;
                const endAngle = startAngle + segAngle;

                // Gradient fill for each segment
                const midAngle = startAngle + segAngle / 2;
                const grad = ctx.createLinearGradient(
                    cx + Math.cos(startAngle) * r * 0.3, cy + Math.sin(startAngle) * r * 0.3,
                    cx + Math.cos(endAngle) * r, cy + Math.sin(endAngle) * r
                );
                grad.addColorStop(0, seg.color);
                grad.addColorStop(1, adjustBrightness(seg.color, -25));

                ctx.beginPath(); ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, startAngle, endAngle);
                ctx.closePath(); ctx.fillStyle = grad; ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1.5; ctx.stroke();

                // Text
                ctx.save(); ctx.translate(cx, cy);
                ctx.rotate(midAngle);
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 17px Nunito';
                ctx.fillText(seg.emoji, r * 0.72, 0);
                ctx.font = 'bold 12px Nunito';
                ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 3;
                ctx.fillText(seg.label, r * 0.48, 0);
                ctx.shadowBlur = 0;
                ctx.restore();
            });

            ctx.beginPath(); ctx.arc(cx, cy, 22, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fill();
        }

        function adjustBrightness(hex, amount) {
            const num = parseInt(hex.slice(1), 16);
            const r = Math.max(0, Math.min(255, (num >> 16) + amount));
            const g = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amount));
            const b = Math.max(0, Math.min(255, (num & 0x0000FF) + amount));
            return '#' + (0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1);
        }

        async function fetchBalance() {
            try {
                const res = await fetch('/api/me');
                if (res.ok) { const d = await res.json(); balance = Number(d.balance) || 0; document.getElementById('balance').textContent = balance.toLocaleString(); }
                else window.location.href = '/';
            } catch (e) { console.error(e); }
        }

        async function loadDailyStatus() {
            try {
                const res = await fetch('/api/daily/status');
                if (!res.ok) return;
                const data = await res.json();
                renderStreak(data.streak, data.claimed_today);
                const btn = document.getElementById('spinWheelBtn');
                const msg = document.getElementById('cooldownMsg');
                if (data.claimed_today) {
                    btn.disabled = true; btn.textContent = '✅ ĐÃ NHẬN HÔM NAY';
                    if (data.next_claim_in) msg.textContent = `⏰ Quay lại sau ${data.next_claim_in}`;
                }
            } catch (e) { console.error(e); }
        }

        function renderStreak(streak, claimedToday) {
            const bar = document.getElementById('streakBar');
            bar.innerHTML = '';
            STREAK_REWARDS.forEach((sr, i) => {
                const div = document.createElement('div');
                div.className = 'streak-day';
                if (i < streak || (i === streak && claimedToday)) div.classList.add('claimed');
                if (i === streak && !claimedToday) div.classList.add('today');
                div.innerHTML = `<span class="streak-reward">${sr.emoji}</span><span class="streak-gold">${sr.reward >= 1000 ? (sr.reward / 1000) + 'K' : sr.reward}</span><span class="streak-label">Ngày ${sr.day}</span>`;
                bar.appendChild(div);
            });
        }

        async function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            const btn = document.getElementById('spinWheelBtn');
            btn.disabled = true; btn.textContent = '🔄 ĐANG QUAY...';
            playSound('spin');

            // Spin tick sound effect — fast ticks that slow down
            let tickCount = 0, tickMax = 30;
            const tickInterval = setInterval(() => {
                tickCount++;
                playSound('spinTick');
                if (tickCount >= tickMax) clearInterval(tickInterval);
            }, 80 + tickCount * 8); // accelerating delay

            try {
                const res = await fetch('/api/daily/claim', { method: 'POST' });
                const data = await res.json();
                if (data.error) {
                    clearInterval(tickInterval);
                    document.getElementById('cooldownMsg').textContent = '❌ ' + data.error;
                    btn.disabled = false; btn.textContent = '🎁 NHẬN THƯỞNG';
                    isSpinning = false; return;
                }

                const segAngle = 360 / WHEEL_SEGMENTS.length;
                const winIndex = data.segment_index || 0;
                const targetAngle = 360 - (winIndex * segAngle + segAngle / 2);
                const spins = 5 + Math.floor(Math.random() * 3);
                const totalAngle = spins * 360 + targetAngle;

                const canvas = document.getElementById('wheelCanvas');
                currentAngle += totalAngle;
                canvas.style.transform = `rotate(${currentAngle}deg)`;

                await new Promise(r => setTimeout(r, 4500));
                clearInterval(tickInterval);

                balance = Number(data.newBalance) || 0;
                document.getElementById('balance').textContent = balance.toLocaleString();

                playSound('reveal');
                setTimeout(() => playSound('win'), 400);
                document.getElementById('rewardEmoji').textContent = data.emoji || '💰';
                document.getElementById('rewardAmount').textContent = '+' + Number(data.reward || 0).toLocaleString() + ' $';
                document.getElementById('resultPopup').classList.add('active');
                spawnConfetti();
                btn.textContent = '✅ ĐÃ NHẬN HÔM NAY';
                loadDailyStatus();
            } catch (e) {
                clearInterval(tickInterval);
                document.getElementById('cooldownMsg').textContent = '❌ Lỗi kết nối!';
                btn.disabled = false; btn.textContent = '🎁 NHẬN THƯỞNG';
            }
            isSpinning = false;
        }

        function closeResult() { document.getElementById('resultPopup').classList.remove('active'); }

        function spawnConfetti() {
            const c = document.getElementById('confettiContainer');
            const cols = ['#ffe600', '#ff6b6b', '#00ff9d', '#bc13fe', '#00f3ff', '#ff9e00'];
            for (let i = 0; i < 50; i++) {
                const el = document.createElement('div');
                el.className = 'confetti';
                el.style.left = Math.random() * 100 + '%';
                el.style.background = cols[Math.floor(Math.random() * cols.length)];
                el.style.animationDelay = Math.random() * 2 + 's';
                el.style.animationDuration = (2 + Math.random() * 2) + 's';
                el.style.width = (5 + Math.random() * 10) + 'px';
                el.style.height = (5 + Math.random() * 10) + 'px';
                el.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                c.appendChild(el);
            }
            setTimeout(() => c.innerHTML = '', 4000);
        }

        // INIT
        (function setupCanvas() {
            const canvas = document.getElementById('wheelCanvas');
            const dpr = window.devicePixelRatio || 1;
            const size = 310;
            canvas.width = size * dpr; canvas.height = size * dpr;
            canvas.style.width = size + 'px'; canvas.style.height = size + 'px';
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
        })();
        drawWheel();
        fetchBalance();
        loadDailyStatus();

        // Sparkles
        (function () {
            const c = document.getElementById('sparkleContainer');
            const cols = ['#ffe600', '#ff6b6b', '#00ff9d', '#bc13fe', '#00f3ff'];
            for (let i = 0; i < 18; i++) {
                const s = document.createElement('div');
                s.className = 'sparkle';
                s.style.left = Math.random() * 100 + '%';
                const col = cols[Math.floor(Math.random() * cols.length)];
                s.style.background = col; s.style.color = col;
                s.style.animationDuration = (7 + Math.random() * 10) + 's';
                s.style.animationDelay = Math.random() * 8 + 's';
                s.style.width = s.style.height = (2 + Math.random() * 3) + 'px';
                c.appendChild(s);
            }
        })();
    </script>
