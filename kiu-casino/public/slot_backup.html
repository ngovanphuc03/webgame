<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Slot Machine - Quay số may mắn tại Pixel PlayZone">
    <meta name="theme-color" content="#1a0a2e">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎰</text></svg>">
    <title>🎰 SLOT MACHINE - Pixel PlayZone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #1a0a2e 0%, #0d1b2a 50%, #1a0a2e 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* AMBIENT GLOW ORBS */
        .ambient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: -1;
            animation: orb-drift 8s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: rgba(188, 19, 254, 0.15);
            top: 10%;
            left: -5%;
        }

        .orb-2 {
            width: 250px;
            height: 250px;
            background: rgba(0, 243, 255, 0.1);
            bottom: 10%;
            right: -5%;
            animation-delay: 3s;
        }

        .orb-3 {
            width: 200px;
            height: 200px;
            background: rgba(255, 230, 0, 0.08);
            top: 50%;
            left: 50%;
            animation-delay: 5s;
        }

        @keyframes orb-drift {
            0% {
                transform: translate(0, 0) scale(1)
            }

            100% {
                transform: translate(30px, -20px) scale(1.1)
            }
        }

        /* PARTICLES */
        .particle-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(188, 19, 254, 0.6);
            border-radius: 50%;
            animation: particle-rise linear infinite;
        }

        @keyframes particle-rise {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0
            }

            10% {
                opacity: 1
            }

            90% {
                opacity: 1
            }

            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0
            }
        }

        /* NAV */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .top-bar .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.3s;
            text-decoration: none;
        }

        .top-bar .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .balance-pill {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #ffe600;
            border-radius: 50px;
            padding: 8px 20px;
            font-weight: 800;
            color: #ffe600;
            font-size: 16px;
            box-shadow: 0 0 15px rgba(255, 230, 0, 0.3);
        }

        /* MACHINE */
        .machine-wrapper {
            margin-top: 30px;
            perspective: 800px;
        }

        .machine {
            background: linear-gradient(180deg, #2a1a4e 0%, #1a0a2e 100%);
            border: 3px solid #bc13fe;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 0 60px rgba(188, 19, 254, 0.3), inset 0 0 30px rgba(188, 19, 254, 0.1);
            position: relative;
            max-width: 500px;
            width: 90vw;
            animation: machine-glow 3s ease-in-out infinite alternate;
        }

        @keyframes machine-glow {
            0% {
                box-shadow: 0 0 40px rgba(188, 19, 254, 0.2), inset 0 0 20px rgba(188, 19, 254, 0.05)
            }

            100% {
                box-shadow: 0 0 80px rgba(188, 19, 254, 0.4), inset 0 0 40px rgba(188, 19, 254, 0.1)
            }
        }

        .machine::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 30px;
            right: 30px;
            height: 4px;
            background: linear-gradient(90deg, transparent, #ffe600, #bc13fe, #ffe600, transparent);
            border-radius: 2px;
            animation: neon-scan 2s linear infinite;
        }

        @keyframes neon-scan {
            0% {
                opacity: 0.5;
                filter: blur(1px)
            }

            50% {
                opacity: 1;
                filter: blur(0)
            }

            100% {
                opacity: 0.5;
                filter: blur(1px)
            }
        }

        .machine-title {
            text-align: center;
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #ffe600, #ff9e00, #ffe600);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
        }

        /* === REELS — CANVAS BASED === */
        .reels-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            padding: 20px 15px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .reel-canvas {
            width: 110px;
            height: 110px;
            border-radius: 14px;
            background: linear-gradient(180deg, #0d0d20, #151530, #0d0d20);
            outline: 2px solid rgba(188, 19, 254, 0.35);
            outline-offset: -1px;
            box-shadow: inset 0 0 20px rgba(188, 19, 254, 0.1), 0 0 10px rgba(0, 0, 0, 0.5);
        }

        /* Win line */
        .win-line {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            height: 3px;
            background: linear-gradient(90deg, transparent, #ffe600, transparent);
            z-index: 5;
            pointer-events: none;
            opacity: 0.5;
        }

        /* PAYOUT TABLE */
        .payout-table {
            margin-top: 15px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .payout-title {
            text-align: center;
            font-size: 14px;
            font-weight: 800;
            color: #ffe600;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .payout-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 10px;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .payout-row:last-child {
            border: none;
        }

        .payout-symbols {
            font-size: 20px;
        }

        .payout-mult {
            color: #00ff9d;
            font-weight: 800;
        }

        /* BET CONTROLS */
        .controls {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .bet-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bet-label {
            font-weight: 700;
            color: #ccc;
            font-size: 14px;
        }

        .bet-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #bc13fe;
            background: rgba(188, 19, 254, 0.2);
            color: #fff;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.2s;
        }

        .bet-btn:hover {
            background: rgba(188, 19, 254, 0.5);
        }

        .bet-amount {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #ffe600;
            border-radius: 10px;
            padding: 8px 20px;
            color: #ffe600;
            font-weight: 900;
            font-size: 18px;
            min-width: 100px;
            text-align: center;
        }

        .preset-btn {
            width: auto;
            border-radius: 8px;
            padding: 5px 12px;
            font-size: 12px;
            border: 2px solid #bc13fe;
            background: rgba(188, 19, 254, 0.2);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .preset-btn:hover {
            background: rgba(188, 19, 254, 0.5);
        }

        /* SPIN BUTTON */
        .spin-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 15px;
            font-size: 22px;
            font-weight: 900;
            cursor: pointer;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #bc13fe, #8a2be2);
            color: #fff;
            box-shadow: 0 5px 25px rgba(188, 19, 254, 0.5);
            transition: 0.3s;
            text-transform: uppercase;
        }

        .spin-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 35px rgba(188, 19, 254, 0.7);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .spin-btn.spinning {
            animation: pulse-spin 0.5s infinite;
        }

        @keyframes pulse-spin {

            0%,
            100% {
                box-shadow: 0 5px 25px rgba(188, 19, 254, 0.5)
            }

            50% {
                box-shadow: 0 5px 35px rgba(188, 19, 254, 0.8)
            }
        }

        /* RESULT */
        .result-msg {
            text-align: center;
            font-size: 20px;
            font-weight: 900;
            margin-top: 10px;
            min-height: 30px;
            transition: 0.3s;
        }

        .result-win {
            color: #00ff9d;
            text-shadow: 0 0 20px rgba(0, 255, 157, 0.5);
            animation: bounce-in 0.5s;
        }

        .result-lose {
            color: #ff6b6b;
        }

        @keyframes bounce-in {
            0% {
                transform: scale(0)
            }

            50% {
                transform: scale(1.3)
            }

            100% {
                transform: scale(1)
            }
        }

        /* HISTORY */
        .history {
            margin-top: 20px;
            width: 90vw;
            max-width: 500px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 40px;
        }

        .history-title {
            font-size: 14px;
            font-weight: 800;
            color: #bc13fe;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 2px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 13px;
        }

        .history-item:last-child {
            border: none;
        }

        .history-symbols {
            font-size: 18px;
        }

        .history-win {
            color: #00ff9d;
            font-weight: 700;
        }

        .history-lose {
            color: #ff6b6b;
            font-weight: 700;
        }

        /* WIN OVERLAY */
        .win-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .win-overlay.active {
            display: flex;
        }

        .win-box {
            background: linear-gradient(135deg, #1a0a2e, #2a1a4e);
            border: 3px solid #ffe600;
            border-radius: 25px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 80px rgba(255, 230, 0, 0.3);
            animation: pop-in 0.5s;
        }

        @keyframes pop-in {
            0% {
                transform: scale(0) rotate(-10deg);
                opacity: 0
            }

            100% {
                transform: scale(1) rotate(0);
                opacity: 1
            }
        }

        .win-box h2 {
            font-size: 36px;
            color: #ffe600;
            margin-bottom: 10px;
        }

        .win-box .win-amount {
            font-size: 48px;
            color: #00ff9d;
            font-weight: 900;
        }

        .win-box .win-symbols {
            font-size: 50px;
            margin: 15px 0;
        }

        .win-box button {
            margin-top: 20px;
            padding: 12px 40px;
            border: none;
            border-radius: 12px;
            background: #ffe600;
            color: #000;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
        }

        /* CONFETTI */
        .confetti-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 200;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: confetti-fall 3s linear forwards;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1
            }

            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0
            }
        }

        /* RESPONSIVE */
        @media (max-width: 500px) {
            .machine {
                padding: 20px 15px;
            }

            .reel-canvas {
                width: 90px;
                height: 90px;
            }

            .machine-title {
                font-size: 24px;
            }

            .spin-btn {
                font-size: 18px;
            }

            .reels-container {
                gap: 8px;
                padding: 15px 10px;
            }
        }
    </style>
</head>

<body>
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
    <div class="particle-container" id="slotParticles"></div>

    <div class="top-bar">
        <a href="/" class="back-btn">← LOBBY</a>
        <div class="balance-pill">💰 <span id="balance">0</span> $</div>
    </div>

    <div class="machine-wrapper">
        <div class="machine">
            <div class="machine-title">🎰 MEGA SLOT 🎰</div>

            <div class="reels-container">
                <div class="win-line"></div>
                <canvas class="reel-canvas" id="reel0"></canvas>
                <canvas class="reel-canvas" id="reel1"></canvas>
                <canvas class="reel-canvas" id="reel2"></canvas>
            </div>

            <div class="payout-table">
                <div class="payout-title">BẢNG THƯỞNG</div>
                <div class="payout-row"><span class="payout-symbols">💎💎💎</span><span class="payout-mult">x50</span>
                </div>
                <div class="payout-row"><span class="payout-symbols">7️⃣7️⃣7️⃣</span><span
                        class="payout-mult">x30</span></div>
                <div class="payout-row"><span class="payout-symbols">⭐⭐⭐</span><span class="payout-mult">x20</span>
                </div>
                <div class="payout-row"><span class="payout-symbols">🍒🍒🍒</span><span class="payout-mult">x10</span>
                </div>
                <div class="payout-row"><span class="payout-symbols">🍋🍋🍋</span><span class="payout-mult">x5</span>
                </div>
                <div class="payout-row"><span class="payout-symbols">🍊🍊🍊</span><span class="payout-mult">x3</span>
                </div>
                <div class="payout-row"><span class="payout-symbols">2 giống</span><span class="payout-mult">x1.5</span>
                </div>
            </div>

            <div class="controls">
                <div class="bet-row">
                    <span class="bet-label">CƯỢC:</span>
                    <button class="bet-btn" onclick="changeBet(-500)">−</button>
                    <div class="bet-amount" id="betDisplay">1000</div>
                    <button class="bet-btn" onclick="changeBet(500)">+</button>
                </div>
                <div class="bet-row" style="gap:5px;">
                    <button class="preset-btn" onclick="setBet(500)">500</button>
                    <button class="preset-btn" onclick="setBet(1000)">1K</button>
                    <button class="preset-btn" onclick="setBet(5000)">5K</button>
                    <button class="preset-btn" onclick="setBet(10000)">10K</button>
                    <button class="preset-btn" onclick="setBet(50000)">50K</button>
                </div>
                <button class="spin-btn" id="spinBtn" onclick="spin()">🎰 QUAY</button>

        </div>
    </div>

    <div class="history">
        <div class="history-title">📜 LỊCH SỬ</div>
        <div id="historyList"></div>
    </div>

    <div class="win-overlay" id="winOverlay">
        <div class="win-box">
            <h2>🎉 JACKPOT!</h2>
            <div class="win-symbols" id="winSymbols"></div>
            <div class="win-amount" id="winAmount"></div>
            <button onclick="closeWin()">TIẾP TỤC</button>
        </div>
    </div>

    <div class="confetti-container" id="confettiContainer"></div>

    <script>
        // ============================================================
        // CONFIG
        // ============================================================
        const SYMBOLS = ['🍒', '🍋', '🍊', '⭐', '7️⃣', '💎'];
        const WEIGHTS = [25, 22, 20, 18, 10, 5];
        const PAYOUTS = { '💎': 50, '7️⃣': 30, '⭐': 20, '🍒': 10, '🍋': 5, '🍊': 3 };

        let balance = 0;
        let betAmount = 1000;
        let spinning = false;

        // ============================================================
        // SOUND EFFECTS
        // ============================================================
        const SFX = {
            spin: new Audio('/sounds/spin.mp3'),
            win: new Audio('/sounds/win.mp3'),
            lose: new Audio('/sounds/lose.mp3'),
            bigWin: new Audio('/sounds/slot_win.mp3'),
            click: new Audio('/sounds/click.mp3'),
        };
        Object.values(SFX).forEach(a => { a.volume = 0.5; a.preload = 'auto'; });
        SFX.bigWin.volume = 0.7;
        function playSound(name) {
            try { SFX[name].currentTime = 0; SFX[name].play().catch(() => { }); } catch (e) { }
        }

        // ============================================================
        // CANVAS REEL ENGINE
        // Renders emoji on <canvas> — 100% pixel-perfect centering.
        // No DOM overflow issues possible.
        // ============================================================
        const DPR = window.devicePixelRatio || 1;
        const reels = []; // {canvas, ctx, w, h}

        function setupCanvases() {
            for (let i = 0; i < 3; i++) {
                const canvas = document.getElementById('reel' + i);
                const rect = canvas.getBoundingClientRect();
                const w = Math.round(rect.width);
                const h = Math.round(rect.height);
                canvas.width = w * DPR;
                canvas.height = h * DPR;
                const ctx = canvas.getContext('2d');
                ctx.scale(DPR, DPR);
                reels.push({ canvas, ctx, w, h });
            }
        }

        /** Draw a single emoji perfectly centered on a reel canvas */
        function drawSymbol(reelIdx, symbol) {
            const { ctx, w, h } = reels[reelIdx];
            ctx.clearRect(0, 0, w, h);

            // Emoji
            const fontSize = Math.floor(Math.min(w, h) * 0.52);
            ctx.font = fontSize + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(symbol, w / 2, h / 2);

            // Fade edges (top & bottom)
            drawFade(ctx, w, h);
        }

        /** Draw gradient fade at top/bottom edges */
        function drawFade(ctx, w, h) {
            const grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, 'rgba(13,13,32,1)');
            grad.addColorStop(0.15, 'rgba(13,13,32,0)');
            grad.addColorStop(0.85, 'rgba(13,13,32,0)');
            grad.addColorStop(1, 'rgba(13,13,32,1)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);
        }

        // ============================================================
        // REEL SPIN ANIMATION (requestAnimationFrame)
        // Scrolls through random symbols then lands on the result.
        // ============================================================
        function animateReel(reelIdx, finalSymbol, duration) {
            return new Promise(resolve => {
                const { ctx, w, h } = reels[reelIdx];
                const fontSize = Math.floor(Math.min(w, h) * 0.52);
                const fontStr = fontSize + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';

                // Build random symbol sequence ending with the result
                const seqLen = 18 + reelIdx * 6;
                const seq = [];
                for (let i = 0; i < seqLen; i++) {
                    seq.push(SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
                }
                seq.push(finalSymbol);

                const total = seq.length;
                const startTime = performance.now();

                function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }

                function frame(now) {
                    const elapsed = now - startTime;
                    const t = Math.min(elapsed / duration, 1);
                    const eased = easeOutQuart(t);

                    // Position in the strip
                    const pos = eased * (total - 1);
                    const idx = Math.floor(pos);
                    const frac = pos - idx;

                    ctx.clearRect(0, 0, w, h);
                    ctx.font = fontStr;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    // Current symbol slides up
                    const yShift = -frac * h;
                    const s1 = seq[Math.min(idx, total - 1)];
                    ctx.fillText(s1, w / 2, h / 2 + yShift);

                    // Next symbol slides in from below
                    if (idx + 1 < total) {
                        ctx.fillText(seq[idx + 1], w / 2, h / 2 + yShift + h);
                    }

                    // Fade overlay
                    drawFade(ctx, w, h);

                    if (t < 1) {
                        requestAnimationFrame(frame);
                    } else {
                        // Final draw — perfectly centered
                        drawSymbol(reelIdx, finalSymbol);
                        resolve();
                    }
                }

                requestAnimationFrame(frame);
            });
        }

        // ============================================================
        // INIT
        // ============================================================
        function initReels() {
            for (let i = 0; i < 3; i++) {
                drawSymbol(i, SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
            }
        }

        async function fetchBalance() {
            try {
                const res = await fetch('/api/me');
                if (res.ok) {
                    const data = await res.json();
                    balance = Number(data.balance);
                    document.getElementById('balance').textContent = balance.toLocaleString();
                } else { window.location.href = '/'; }
            } catch (e) { console.error(e); }
        }

        // ============================================================
        // BET CONTROLS
        // ============================================================
        function changeBet(delta) {
            playSound('click');
            betAmount = Math.max(500, Math.min(100000, betAmount + delta));
            document.getElementById('betDisplay').textContent = betAmount.toLocaleString();
        }
        function setBet(val) {
            playSound('click');
            betAmount = val;
            document.getElementById('betDisplay').textContent = betAmount.toLocaleString();
        }

        // ============================================================
        // SPIN
        // ============================================================
        async function spin() {
            if (spinning) return;
            if (balance < betAmount) {
                document.getElementById('resultMsg').textContent = '❌ Không đủ tiền!';
                document.getElementById('resultMsg').className = 'result-msg result-lose';
                return;
            }

            spinning = true;
            const btn = document.getElementById('spinBtn');
            btn.disabled = true;
            btn.classList.add('spinning');
            btn.textContent = '🔄 ĐANG QUAY...';
            document.getElementById('resultMsg').textContent = '';
            playSound('spin');

            try {
                const res = await fetch('/api/slot/spin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bet: betAmount })
                });
                const data = await res.json();

                if (data.error) {
                    document.getElementById('resultMsg').textContent = '❌ ' + data.error;
                    document.getElementById('resultMsg').className = 'result-msg result-lose';
                    resetBtn(btn);
                    return;
                }

                // Animate reels with staggered timing
                await Promise.all([
                    animateReel(0, data.symbols[0], 1200),
                    animateReel(1, data.symbols[1], 1700),
                    animateReel(2, data.symbols[2], 2200),
                ]);

                // Update balance
                balance = Number(data.newBalance);
                document.getElementById('balance').textContent = balance.toLocaleString();

                // Show result
                if (data.win > 0) {
                    if (data.multiplier >= 10) {
                        playSound('bigWin');
                        showBigWin(data.symbols, data.win);
                    } else {
                        playSound('win');
                        document.getElementById('resultMsg').innerHTML =
                            `🎉 THẮNG <strong>+${data.win.toLocaleString()} $</strong> (x${data.multiplier})`;
                        document.getElementById('resultMsg').className = 'result-msg result-win';
                    }
                } else {
                    playSound('lose');
                    document.getElementById('resultMsg').textContent = '😢 Chưa trúng, thử lại!';
                    document.getElementById('resultMsg').className = 'result-msg result-lose';
                }

                addHistory(data.symbols, data.win, betAmount);

            } catch (e) {
                document.getElementById('resultMsg').textContent = '❌ Lỗi kết nối!';
                document.getElementById('resultMsg').className = 'result-msg result-lose';
            }

            resetBtn(btn);
        }

        function resetBtn(btn) {
            spinning = false;
            btn.disabled = false;
            btn.classList.remove('spinning');
            btn.textContent = '🎰 QUAY';
        }

        // ============================================================
        // HISTORY
        // ============================================================
        function addHistory(symbols, win, bet) {
            const list = document.getElementById('historyList');
            const item = document.createElement('div');
            item.className = 'history-item';
            const isWin = win > 0;
            item.innerHTML = `
                <span class="history-symbols">${symbols.join(' ')}</span>
                <span class="${isWin ? 'history-win' : 'history-lose'}">${isWin ? '+' + win.toLocaleString() : '-' + bet.toLocaleString()} $</span>
            `;
            list.insertBefore(item, list.firstChild);
            if (list.children.length > 20) list.removeChild(list.lastChild);
        }

        // ============================================================
        // BIG WIN OVERLAY
        // ============================================================
        function showBigWin(symbols, amount) {
            document.getElementById('winSymbols').textContent = symbols.join(' ');
            document.getElementById('winAmount').textContent = '+' + amount.toLocaleString() + ' $';
            document.getElementById('winOverlay').classList.add('active');
            spawnConfetti();
        }
        function closeWin() {
            document.getElementById('winOverlay').classList.remove('active');
        }

        // ============================================================
        // CONFETTI
        // ============================================================
        function spawnConfetti() {
            const container = document.getElementById('confettiContainer');
            const colors = ['#ffe600', '#ff6b6b', '#00ff9d', '#bc13fe', '#00f3ff', '#ff9e00'];
            for (let i = 0; i < 60; i++) {
                const el = document.createElement('div');
                el.className = 'confetti';
                el.style.left = Math.random() * 100 + '%';
                el.style.background = colors[Math.floor(Math.random() * colors.length)];
                el.style.animationDelay = Math.random() * 2 + 's';
                el.style.animationDuration = (2 + Math.random() * 2) + 's';
                el.style.width = (5 + Math.random() * 10) + 'px';
                el.style.height = (5 + Math.random() * 10) + 'px';
                el.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                container.appendChild(el);
            }
            setTimeout(() => { container.innerHTML = ''; }, 4000);
        }

        // ============================================================
        // KEYBOARD (Space to spin)
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !spinning) { e.preventDefault(); spin(); }
        });

        // ============================================================
        // BOOT
        // ============================================================
        setupCanvases();
        initReels();
        fetchBalance();

        // Floating particles
        (function () {
            const container = document.getElementById('slotParticles');
            const colors = ['rgba(188,19,254,0.5)', 'rgba(0,243,255,0.4)', 'rgba(255,230,0,0.3)'];
            for (let i = 0; i < 25; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.animationDuration = (5 + Math.random() * 10) + 's';
                p.style.animationDelay = Math.random() * 8 + 's';
                p.style.width = p.style.height = (2 + Math.random() * 3) + 'px';
                container.appendChild(p);
            }
        })();
    </script>
</body>

</html>
