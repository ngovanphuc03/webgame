<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>TÀI XỈU VIP - Mobile</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="desktop-redirect.js"></script>

    <!-- Premium Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>
        /* ============================================= */
        /* MOBILE PREMIUM DESIGN - TÀI XỈU */
        /* ============================================= */

        :root {
            --gold: #ffd700;
            --gold-dark: #b8860b;
            --gold-light: #fff8dc;
            --tai-red: #dc3545;
            --tai-red-glow: rgba(220, 53, 69, 0.5);
            --xiu-blue: #0d6efd;
            --xiu-blue-glow: rgba(13, 110, 253, 0.5);
            --glass-bg: rgba(0, 0, 0, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background: linear-gradient(135deg, #1a0a2e 0%, #0f0618 50%, #16213e 100%);
            min-height: 100vh;
            min-height: 100dvh;
            color: white;
            overflow: hidden;
        }

        /* Background Image Overlay */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: url('/images/ui/bg-bamboo.jpg') center/cover no-repeat;
            opacity: 0.3;
            z-index: -1;
        }

        /* ============================================= */
        /* ROTATION WARNING */
        /* ============================================= */
        #rotate-warning {
            display: none;
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1a0a2e 0%, #0f0618 100%);
            z-index: 999999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        @media (orientation: portrait) {
            #rotate-warning {
                display: flex !important;
            }

            body>*:not(#rotate-warning) {
                display: none !important;
            }
        }

        .rotate-icon {
            font-size: 80px;
            animation: rotate-bounce 2s ease-in-out infinite;
        }

        @keyframes rotate-bounce {

            0%,
            100% {
                transform: rotate(-10deg);
            }

            50% {
                transform: rotate(10deg);
            }
        }

        .rotate-text {
            margin-top: 20px;
            font-size: 18px;
            font-weight: 700;
            color: var(--gold);
        }

        .rotate-sub {
            margin-top: 8px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        /* ============================================= */
        /* MAIN CONTAINER - LANDSCAPE */
        /* ============================================= */
        .game-wrapper {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: var(--safe-top) 0 var(--safe-bottom) 0;
        }

        /* ============================================= */
        /* HEADER - Compact & Premium */
        /* ============================================= */
        /* ============================================= */
        /* LAYOUT & STRUCTURE */
        /* ============================================= */
        .game-wrapper {
            background: radial-gradient(circle at 50% 120%, #2a1b3d 0%, #000 70%);
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }

        .header {
            height: 60px;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .balance-pill {
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 14px;
        }

        .game-board {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1.4fr 1fr;
            /* Wider center */
            gap: 10px;
            padding: 10px 20px;
            align-items: center;
            overflow: hidden;
        }

        /* ============================================= */
        /* 3D BET BUTTONS (CSS PURE) */
        /* ============================================= */
        .bet-column {
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
        }

        .bet-btn {
            position: relative;
            flex: 1;
            max-height: 160px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tai-btn {
            background: linear-gradient(145deg, #ff4d4d, #990000);
            box-shadow: 0 0 0 1px #ff3333 inset, 0 10px 0 #660000;
            margin-bottom: 10px;
            /* Space for 3d effect */
        }

        .xiu-btn {
            background: linear-gradient(145deg, #4d94ff, #003399);
            box-shadow: 0 0 0 1px #3385ff inset, 0 10px 0 #002266;
            margin-bottom: 10px;
        }

        .bet-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 1px inset, 0 4px 0 rgba(0, 0, 0, 0.5);
        }

        .bet-btn.winner-glow {
            animation: pulse-winner 0.8s ease-in-out infinite;
            filter: brightness(1.3) drop-shadow(0 0 15px rgba(255, 215, 0, 0.6));
            border-color: var(--gold);
        }

        @keyframes pulse-winner {

            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            }

            50% {
                transform: scale(1.02);
                box-shadow: 0 0 40px rgba(255, 215, 0, 0.8);
            }
        }

        .bet-name {
            font-size: 32px;
            font-weight: 900;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .bet-users {
            font-size: 11px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .bet-info-panel {
            padding: 10px;
            border-radius: 12px;
            text-align: center;
        }

        /* ============================================= */
        /* CENTER STAGE & BOWL */
        /* ============================================= */
        .center-stage {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .plate-area {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .plate-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.6));
            position: absolute;
            top: 0;
            left: 0;
        }

        .bowl-3d {
            position: absolute;
            width: 150px;
            height: 150px;
            background: url('/images/dice/bowl.png') center/contain no-repeat;
            z-index: 10;
            transition: transform 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        .bowl-3d.open {
            transform: translateY(-80px) scale(0.8);
            opacity: 0.8;
        }

        .bowl-3d.shaking {
            animation: shake-bowl 0.2s infinite;
        }

        @keyframes shake-bowl {
            0% {
                transform: rotate(0deg) translate(0, 0);
            }

            25% {
                transform: rotate(-3deg) translate(-2px, 2px);
            }

            75% {
                transform: rotate(3deg) translate(2px, -2px);
            }

            100% {
                transform: rotate(0deg) translate(0, 0);
            }
        }

        .dice-3d {
            width: 36px;
            height: 36px;
            filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.5));
            position: relative;
            z-index: 5;
        }

        .dice-group {
            display: flex;
            gap: 4px;
            z-index: 5;
            padding-bottom: 10px;
            /* Offset for plate perspective */
        }

        /* Result Pop */
        .result-pop {
            position: absolute;
            top: -30px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--gold);
            padding: 5px 15px;
            border-radius: 20px;
            color: var(--gold);
            font-weight: 800;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        /* History Beads */
        .mini-history {
            display: flex;
            gap: 6px;
            padding: 8px 15px;
            border-radius: 20px;
        }

        .mini-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .mini-dot.tai {
            background: #ff4d4d;
            box-shadow: 0 0 8px #ff4d4d;
        }

        .mini-dot.xiu {
            background: #4d94ff;
            box-shadow: 0 0 8px #4d94ff;
        }

        .mini-dot.bao {
            background: #ffd700;
        }

        /* ============================================= */
        /* CONTROLS (Slider & Chips) */
        /* ============================================= */
        .controls-panel {
            padding: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .bet-amount-control {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .current-bet-display {
            min-width: 80px;
            text-align: center;
        }

        .current-bet-display .value {
            font-size: 18px;
            font-weight: 800;
            display: block;
        }

        .current-bet-display .label {
            font-size: 10px;
            opacity: 0.6;
        }

        .slider-wrapper {
            flex: 1;
        }

        .gold-slider {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .gold-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: var(--gold);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--gold);
        }

        .quick-chips {
            display: flex;
            gap: 8px;
        }

        .chip-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 700;
        }

        /* Animation Classes */
        .flying-coin {
            position: fixed;
            width: 24px;
            height: 24px;
            background: url('/images/ui/coin-gold.png') center/contain;
            /* Or CSS circle */
            background: radial-gradient(circle at 30% 30%, #ffd700, #b8860b);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        }
    </style>
</head>

<body>
    <!-- Main Game Container -->
    <div class="game-wrapper">
        <!-- Header: Minimalist Glass -->
        <header class="header">
            <a href="/index-mobile.html" class="back-btn glass-panel">
                <span style="font-size:16px">🏰</span>
            </a>

            <div class="header-center">
                <div class="timer-badge" id="timer-container">
                    <span id="timer">00</span>
                    <svg class="timer-ring" width="44" height="44">
                        <circle class="timer-ring-circle" stroke="var(--gold)" stroke-width="3" fill="transparent"
                            r="18" cx="22" cy="22" />
                    </svg>
                </div>
            </div>

            <div class="balance-pill glass-panel">
                <span class="text-gold">💰</span>
                <span id="balance" class="font-bold text-gold">...</span>
            </div>
        </header>

        <!-- Game Area: Dynamic 3-Column Layout -->
        <main class="game-board">

            <!-- LEFT: TAI -->
            <div class="bet-column">
                <div class="bet-btn tai-btn touch-effect" id="box-tai" onclick="quickBet('tai')">
                    <div class="btn-shine"></div>
                    <div class="btn-content">
                        <div class="bet-name">TÀI</div>
                        <div class="bet-ratio">1 : 1.98</div>
                        <div class="bet-users" id="tai-players">👥 0</div>
                    </div>
                </div>
                <div class="bet-info-panel glass-panel">
                    <div class="total-money text-gold" id="total-tai">0</div>
                    <div class="my-money text-gold" id="my-tai"></div>
                </div>
            </div>

            <!-- CENTER: PLATE & HISTORY -->
            <div class="center-stage">
                <!-- Plate & Bowl Area -->
                <div class="plate-area">
                    <div class="bowl-shadow"></div>
                    <!-- Plate Image -->
                    <img src="/images/dice/plate.png" class="plate-img" alt="Plate">

                    <!-- Dices -->
                    <div class="dice-group">
                        <img src="/images/dice/1.png" class="dice-3d" id="d1">
                        <img src="/images/dice/1.png" class="dice-3d" id="d2">
                        <img src="/images/dice/1.png" class="dice-3d" id="d3">
                    </div>

                    <!-- Bowl (Draggable) -->
                    <div class="bowl-3d" id="bowl"></div>

                    <!-- Result Toast -->
                    <div class="result-pop" id="result-toast">
                        <span id="toast-text">TÀI 11</span>
                    </div>
                </div>

                <!-- Soi Cau (Mini History) -->
                <div class="mini-history glass-panel" id="mini-history-bar">
                    <!-- Dots injected by JS -->
                </div>
            </div>

            <!-- RIGHT: XIU -->
            <div class="bet-column">
                <div class="bet-btn xiu-btn touch-effect" id="box-xiu" onclick="quickBet('xiu')">
                    <div class="btn-shine"></div>
                    <div class="btn-content">
                        <div class="bet-name">XỈU</div>
                        <div class="bet-ratio">1 : 1.98</div>
                        <div class="bet-users" id="xiu-players">👥 0</div>
                    </div>
                </div>
                <div class="bet-info-panel glass-panel">
                    <div class="total-money text-gold" id="total-xiu">0</div>
                    <div class="my-money text-gold" id="my-xiu"></div>
                </div>
            </div>
        </main>

        <!-- Footer: Smart Controls -->
        <footer class="controls-panel glass-panel">
            <div class="bet-amount-control">
                <div class="current-bet-display">
                    <span class="label">Cược:</span>
                    <span class="value text-gold" id="selected-amount-display">1</span>
                </div>

                <div class="slider-wrapper">
                    <input type="range" class="gold-slider" id="bet-slider" min="1" max="1000" step="1" value="1"
                        oninput="handleSliderInput(this)">
                </div>

                <div class="quick-chips">
                    <button class="chip-btn" onclick="jumpTo(0.1)">10%</button>
                    <button class="chip-btn" onclick="jumpTo(0.5)">50%</button>
                    <button class="chip-btn" onclick="jumpTo(1.0)">ALL</button>
                </div>
            </div>
        </footer>
    </div>

    <!-- Flying Coin Template -->
    <div id="coin-template" style="display:none;">
        <div class="coin-anim"></div>
    </div>
    <button class="quick-btn" onclick="jumpTo(0.5)">50%</button>
    <button class="quick-btn" onclick="jumpTo(0.75)">75%</button>
    <button class="quick-btn" onclick="jumpTo(1)">ALL</button>
    </div>
    </div>

    <div class="amount-display">
        <span class="amount-label">Tối đa</span>
        <span class="amount-value" id="max-display">...</span>
    </div>

    <button class="history-btn" onclick="toggleHistoryBoard()">
        📊 Cầu
    </button>
    </div>
    </footer>
    </div>

    <!-- History Overlay -->
    <div class="history-overlay" id="history-board">
        <div class="history-header">
            <span class="history-title">📈 Lịch Sử 120 Ván</span>
            <button class="close-btn" onclick="toggleHistoryBoard()">✕</button>
        </div>
        <div class="history-grid" id="history-grid"></div>
    </div>

    <!-- Notification -->
    <div class="notification" id="notif">Thông báo</div>

    <!-- Game Logic -->
    <script src="taixiu-mobile.js"></script>
</body>

</html>
