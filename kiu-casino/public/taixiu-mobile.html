<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="screen-orientation" content="landscape">

    <title>ROYAL CASINO - Tài Xỉu VIP</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="desktop-redirect.js"></script>

    <!-- Vietnamese-Optimized Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Use Desktop CSS + Mobile Overrides -->
    <link rel="stylesheet" href="taixiu.css">
    <link rel="stylesheet" href="taixiu-mobile-override.css">
</head>

<body>
    <!-- Rotation Warning -->
    <div id="rotate-warning">
        <div style="font-size: 80px; margin-bottom: 20px;">📱➡️</div>
        <p style="font-size: 20px; font-weight: 700; color: #ffd700;">Vui lòng xoay ngang thiết bị</p>
        <p style="font-size: 14px; color: rgba(255,255,255,0.7);">Để có trải nghiệm chơi game tốt nhất</p>
    </div>

    <!-- Ambient Effects (same as desktop) -->
    <div class="ambient-container">
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>
        <div class="particles" id="particles"></div>
    </div>

    <div class="notification" id="notif">Thông báo</div>

    <div class="header">
        <a href="/index-mobile.html" class="back-btn-img">
            <img src="/images/ui/btn-wood.png" alt="Rời Bàn" class="btn-wood-img">
        </a>
        <div class="header-right">
            <button id="music-btn" onclick="toggleMusic()" class="icon-btn">🎵</button>
            <div class="user-money">
                <span class="money-icon">💰</span>
                <span id="balance">...</span>
            </div>
        </div>
    </div>

    <div class="game-board">
        <div class="side-panel">
            <div class="bet-circle-img" id="box-tai" onclick="quickBet('tai')">
                <img src="/images/ui/wood-board-red.png" alt="TÀI" class="board-img">
                <div class="bet-overlay">
                    <div class="rate">1 : 1.98</div>
                    <div class="player-count" id="tai-players">0 người</div>
                </div>
            </div>
            <div class="total-bet" id="total-tai">
                <span class="total-icon">💵</span>
                <span>0</span>
            </div>
            <div class="my-bet" id="my-tai"></div>
        </div>

        <div class="center-stage">
            <div class="timer-container" id="timer-container">
                <div class="timer-ring"></div>
                <div class="timer" id="timer">00</div>
            </div>
            <img src="/images/dice/plate.png" class="plate">
            <div class="dice-container">
                <img src="/images/dice/1.png" class="dice" id="d1">
                <img src="/images/dice/1.png" class="dice" id="d2">
                <img src="/images/dice/1.png" class="dice" id="d3">
            </div>
            <div class="bowl-container" id="bowl">
                <div class="bowl-img"></div>
            </div>
            <div id="result-toast">
                <div class="toast-content">
                    <div class="toast-text" id="toast-text">...</div>
                </div>
            </div>
        </div>

        <div class="side-panel">
            <div class="bet-circle-img" id="box-xiu" onclick="quickBet('xiu')">
                <img src="/images/ui/wood-board-blue.png" alt="XỈU" class="board-img">
                <div class="bet-overlay">
                    <div class="rate">1 : 1.98</div>
                    <div class="player-count" id="xiu-players">0 người</div>
                </div>
            </div>
            <div class="total-bet" id="total-xiu">
                <span class="total-icon">💵</span>
                <span>0</span>
            </div>
            <div class="my-bet" id="my-xiu"></div>
        </div>
    </div>

    <div class="footer">
        <!-- History Toggle -->
        <button id="toggle-history-btn" onclick="toggleHistoryBoard()" class="history-toggle-btn">
            <span class="toggle-icon">📊</span> Xem Cầu
        </button>

        <!-- History Board -->
        <div id="history-board" class="history-board hidden">
            <div class="history-board-header">
                <span>📈 BẢNG CẦU - 120 VÁN GẦN NHẤT</span>
                <button onclick="toggleHistoryBoard()" class="close-btn">✕</button>
            </div>
            <div id="history-grid" class="history-grid"></div>
            <div class="history-legend">
                <span class="legend-item"><span class="dot tai"></span> Tài (11-17)</span>
                <span class="legend-item"><span class="dot xiu"></span> Xỉu (4-10)</span>
                <span class="legend-item"><span class="dot bao"></span> Bão (3 giống)</span>
            </div>
        </div>

        <div class="bet-info-row">
            <div class="info-block">
                <div class="info-label">ĐANG CHỌN</div>
                <div class="info-value" id="selected-amount-display">1</div>
            </div>
            <div class="info-block right">
                <div class="info-label">SỐ DƯ TỐI ĐA</div>
                <div class="info-value" id="max-display">...</div>
            </div>
        </div>

        <div class="slider-wrapper">
            <div class="slider-track-bg"></div>
            <div class="slider-fill" id="slider-fill"></div>
            <input type="range" id="bet-slider" min="1" max="1000" step="1" value="1" oninput="handleSliderInput(this)">
            <div class="ticks">
                <div class="tick" onclick="jumpTo(0)">MIN</div>
                <div class="tick" onclick="jumpTo(0.25)">25%</div>
                <div class="tick" onclick="jumpTo(0.5)">50%</div>
                <div class="tick" onclick="jumpTo(0.75)">75%</div>
                <div class="tick" onclick="jumpTo(1)">ALL</div>
            </div>
        </div>
    </div>

    <script>
        // Generate floating particles (same as desktop)
        function createParticles() {
            const container = document.getElementById('particles');
            if (!container) return;
            for (let i = 0; i < 20; i++) { // Fewer on mobile for performance
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.width = (2 + Math.random() * 3) + 'px';
                particle.style.height = particle.style.width;
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (12 + Math.random() * 10) + 's';
                container.appendChild(particle);
            }
        }
        createParticles();
    </script>

    <!-- Game Logic (same as desktop) -->
    <script src="taixiu.js"></script>
</body>

</html>
