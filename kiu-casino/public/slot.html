<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Mega Slot - Quay số may mắn tại Pixel PlayZone">
    <meta name="theme-color" content="#0d0d20">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎰</text></svg>">
    <title>🎰 Mega Slot - Pixel PlayZone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(160deg, #0d0d20 0%, #1a0a30 40%, #0d0d20 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ═══ AMBIENT ═══ */
        .ambient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: -1;
            animation: orb-drift 10s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 350px;
            height: 350px;
            background: rgba(138, 43, 226, 0.1);
            top: -5%;
            left: -8%;
        }

        .orb-2 {
            width: 280px;
            height: 280px;
            background: rgba(255, 230, 0, 0.07);
            bottom: 5%;
            right: -5%;
            animation-delay: 5s;
        }

        .orb-3 {
            width: 200px;
            height: 200px;
            background: rgba(0, 243, 255, 0.05);
            top: 50%;
            left: 50%;
            animation-delay: 3s;
        }

        @keyframes orb-drift {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(20px, -15px) scale(1.12);
            }
        }

        .particle-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            bottom: -10px;
            animation: pfloat linear infinite;
        }

        @keyframes pfloat {
            0% {
                transform: translateY(0) rotate(0deg) scale(0);
                opacity: 0;
            }

            10% {
                opacity: 0.8;
                transform: scale(1);
            }

            90% {
                opacity: 0.3;
            }

            100% {
                transform: translateY(-100vh) rotate(360deg) scale(0);
                opacity: 0;
            }
        }

        /* ═══ TOP BAR ═══ */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 25px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 20px;
            border-radius: 22px;
            cursor: pointer;
            font-weight: 700;
            text-decoration: none;
            font-size: 13px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .balance-pill {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #ffe600;
            border-radius: 50px;
            padding: 8px 20px;
            font-weight: 800;
            color: #ffe600;
            font-size: 15px;
            box-shadow: 0 0 18px rgba(255, 230, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .balance-pill::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 230, 0, 0.1), transparent);
            animation: bshine 3s ease infinite;
        }

        @keyframes bshine {
            0% {
                left: -100%;
            }

            100% {
                left: 200%;
            }
        }

        /* ═══ MACHINE ═══ */
        .machine-wrapper {
            margin-top: 25px;
            width: 95vw;
            max-width: 450px;
            position: relative;
        }

        .machine-wrapper::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 28px;
            background: conic-gradient(from 0deg, #bc13fe, #ffe600, #00f3ff, #bc13fe);
            z-index: -1;
            filter: blur(15px);
            opacity: 0.2;
            animation: mg 4s linear infinite;
        }

        @keyframes mg {
            to {
                filter: blur(15px) hue-rotate(360deg);
            }
        }

        .machine {
            background: linear-gradient(180deg, rgba(18, 12, 40, 0.95) 0%, rgba(10, 8, 25, 0.98) 100%);
            border-radius: 25px;
            padding: 25px 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .machine-title {
            text-align: center;
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(90deg, #ffe600, #ff9e00, #ffe600);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: tshimmer 3s ease infinite;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        @keyframes tshimmer {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        /* ═══ REELS ═══ */
        .reels-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 18px 12px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            position: relative;
            box-shadow: inset 0 2px 15px rgba(0, 0, 0, 0.4);
        }

        .win-line {
            position: absolute;
            left: 8px;
            right: 8px;
            height: 3px;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(90deg, transparent, rgba(255, 230, 0, 0.5), transparent);
            z-index: 2;
            pointer-events: none;
            border-radius: 3px;
        }

        .reel-canvas {
            width: 105px;
            height: 105px;
            border-radius: 14px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(13, 13, 32, 0.9);
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5), 0 0 8px rgba(138, 43, 226, 0.15);
            transition: border-color 0.3s;
        }

        /* ═══ PAYOUT TABLE ═══ */
        .payout-table {
            margin-top: 18px;
            padding: 14px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .payout-title {
            text-align: center;
            font-size: 13px;
            font-weight: 800;
            color: #ffe600;
            letter-spacing: 3px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .payout-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 10px;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .payout-row:last-child {
            border: none;
        }

        .payout-symbols {
            font-size: 16px;
        }

        .payout-mult {
            color: #00ff9d;
            font-weight: 800;
            font-size: 14px;
        }

        /* ═══ CONTROLS ═══ */
        .controls {
            margin-top: 18px;
        }

        .bet-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .bet-label {
            font-weight: 800;
            color: #aaa;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .bet-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bet-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .bet-btn:active {
            transform: scale(0.93);
        }

        .bet-amount {
            min-width: 80px;
            text-align: center;
            font-size: 22px;
            font-weight: 900;
            color: #ffe600;
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            border: 1px solid rgba(255, 230, 0, 0.2);
        }

        .preset-btn {
            padding: 7px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #ccc;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .preset-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .spin-btn {
            width: 100%;
            padding: 16px;
            margin-top: 12px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #bc13fe, #6c5ce7);
            color: #fff;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
            letter-spacing: 3px;
            box-shadow: 0 5px 25px rgba(138, 43, 226, 0.35);
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .spin-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: spinshine 2.5s ease infinite;
        }

        @keyframes spinshine {
            0% {
                left: -100%;
            }

            100% {
                left: 200%;
            }
        }

        .spin-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 35px rgba(138, 43, 226, 0.5);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .spin-btn.spinning {
            animation: spinpulse 0.6s ease-in-out infinite;
        }

        @keyframes spinpulse {

            0%,
            100% {
                box-shadow: 0 5px 20px rgba(138, 43, 226, 0.3);
            }

            50% {
                box-shadow: 0 5px 35px rgba(138, 43, 226, 0.6);
            }
        }

        .result-msg {
            text-align: center;
            margin-top: 12px;
            font-weight: 800;
            font-size: 15px;
            min-height: 24px;
            animation: fadeUp 0.3s ease;
        }

        @keyframes fadeUp {
            0% {
                transform: translateY(5px);
                opacity: 0;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .result-win {
            color: #00ff9d;
            text-shadow: 0 0 10px rgba(0, 255, 157, 0.3);
        }

        .result-lose {
            color: #ff6b6b;
        }

        /* ═══ HISTORY ═══ */
        .history {
            margin-top: 20px;
            width: 95vw;
            max-width: 450px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 18px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 30px;
        }

        .history-title {
            font-size: 15px;
            font-weight: 800;
            color: #aaa;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 2px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            font-size: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            animation: fadeUp 0.3s ease;
        }

        .history-item:last-child {
            border: none;
        }

        .history-symbols {
            font-size: 18px;
            letter-spacing: 3px;
        }

        .history-win {
            color: #00ff9d;
            font-weight: 800;
        }

        .history-lose {
            color: #ff6b6b;
            font-weight: 700;
        }

        /* ═══ WIN OVERLAY ═══ */
        .win-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 100;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        .win-overlay.active {
            display: flex;
        }

        .win-box {
            background: linear-gradient(135deg, #1a0a2e, #2a1a4e);
            border: 2px solid #ffe600;
            border-radius: 22px;
            padding: 35px;
            text-align: center;
            box-shadow: 0 0 70px rgba(255, 230, 0, 0.25);
            animation: wpop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes wpop {
            0% {
                transform: scale(0) rotate(-8deg);
                opacity: 0;
            }

            100% {
                transform: scale(1) rotate(0);
                opacity: 1;
            }
        }

        .win-box h2 {
            font-size: 32px;
            color: #ffe600;
            margin-bottom: 8px;
        }

        .win-box .win-amount {
            font-size: 44px;
            color: #00ff9d;
            font-weight: 900;
        }

        .win-box .win-symbols {
            font-size: 46px;
            margin: 12px 0;
        }

        .win-box button {
            margin-top: 18px;
            padding: 12px 35px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ffe600, #ff9e00);
            color: #000;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .win-box button:hover {
            transform: translateY(-2px);
        }

        /* ═══ CONFETTI ═══ */
        .confetti-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 200;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: cfall 3s linear forwards;
        }

        @keyframes cfall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* ═══ RESPONSIVE ═══ */
        @media (max-width: 500px) {
            .machine {
                padding: 18px 14px;
            }

            .reel-canvas {
                width: 85px;
                height: 85px;
            }

            .machine-title {
                font-size: 22px;
            }

            .spin-btn {
                font-size: 17px;
            }

            .reels-container {
                gap: 6px;
                padding: 12px 8px;
            }
        }
    </style>
</head>

<body>
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
    <div class="particle-container" id="slotParticles"></div>

    <div class="top-bar">
        <a href="/" class="back-btn">← LOBBY</a>
        <div class="balance-pill">💰 <span id="balance">0</span> $</div>
    </div>

    <div class="machine-wrapper">
        <div class="machine">
            <div class="machine-title">🎰 MEGA SLOT 🎰</div>
            <div class="reels-container">
                <div class="win-line"></div>
                <canvas class="reel-canvas" id="reel0"></canvas>
                <canvas class="reel-canvas" id="reel1"></canvas>
                <canvas class="reel-canvas" id="reel2"></canvas>
            </div>

            <div class="payout-table">
                <div class="payout-title">BẢNG THƯỞNG</div>
                <div class="payout-row"><span class="payout-symbols">💎💎💎</span><span class="payout-mult">x50</span>
                </div>
                <div class="payout-row"><span class="payout-symbols">7️⃣7️⃣7️⃣</span><span
                        class="payout-mult">x30</span></div>
                <div class="payout-row"><span class="payout-symbols">⭐⭐⭐</span><span class="payout-mult">x20</span>
                </div>
                <div class="payout-row"><span class="payout-symbols">🍒🍒🍒</span><span class="payout-mult">x10</span>
                </div>
                <div class="payout-row"><span class="payout-symbols">🍋🍋🍋</span><span class="payout-mult">x5</span>
                </div>
                <div class="payout-row"><span class="payout-symbols">🍊🍊🍊</span><span class="payout-mult">x3</span>
                </div>
                <div class="payout-row"><span class="payout-symbols">2 giống</span><span class="payout-mult">x1.5</span>
                </div>
            </div>

            <div class="controls">
                <div class="bet-row">
                    <span class="bet-label">CƯỢC:</span>
                    <button class="bet-btn" onclick="changeBet(-500)">−</button>
                    <div class="bet-amount" id="betDisplay">1,000</div>
                    <button class="bet-btn" onclick="changeBet(500)">+</button>
                </div>
                <div class="bet-row" style="gap:5px;">
                    <button class="preset-btn" onclick="setBet(500)">500</button>
                    <button class="preset-btn" onclick="setBet(1000)">1K</button>
                    <button class="preset-btn" onclick="setBet(5000)">5K</button>
                    <button class="preset-btn" onclick="setBet(10000)">10K</button>
                    <button class="preset-btn" onclick="setBet(50000)">50K</button>

                <div class="result-msg" id="resultMsg"></div>

        </div>
    </div>

    <div class="history">
        <div class="history-title">📜 LỊCH SỬ</div>
        <div id="historyList"></div>
    </div>

    <div class="win-overlay" id="winOverlay">
        <div class="win-box">
            <h2>🎉 JACKPOT!</h2>
            <div class="win-symbols" id="winSymbols"></div>
            <div class="win-amount" id="winAmount"></div>
            <button onclick="closeWin()">TIẾP TỤC</button>
        </div>
    </div>

    <div class="confetti-container" id="confettiContainer"></div>

    <script>
        const SYMBOLS = ['🍒', '🍋', '🍊', '⭐', '7️⃣', '💎'];
        const WEIGHTS = [25, 22, 20, 18, 10, 5];
        const PAYOUTS = { '💎': 50, '7️⃣': 30, '⭐': 20, '🍒': 10, '🍋': 5, '🍊': 3 };

        let balance = 0, betAmount = 1000, spinning = false;

        const SFX = {
            spin: new Audio('/sounds/spin.mp3'),
            win: new Audio('/sounds/win.mp3'),
            lose: new Audio('/sounds/lose.mp3'),
            bigWin: new Audio('/sounds/slot_win.mp3'),
            click: new Audio('/sounds/click.mp3'),
        };
        Object.values(SFX).forEach(a => { a.volume = 0.5; a.preload = 'auto'; });
        SFX.bigWin.volume = 0.7;
        function playSound(n) { try { SFX[n].currentTime = 0; SFX[n].play().catch(() => { }); } catch (e) { } }

        // ═══ CANVAS REEL ENGINE ═══
        const DPR = window.devicePixelRatio || 1;
        const reels = [];

        function setupCanvases() {
            for (let i = 0; i < 3; i++) {
                const canvas = document.getElementById('reel' + i);
                const rect = canvas.getBoundingClientRect();
                const w = Math.round(rect.width), h = Math.round(rect.height);
                canvas.width = w * DPR; canvas.height = h * DPR;
                const ctx = canvas.getContext('2d');
                ctx.scale(DPR, DPR);
                reels.push({ canvas, ctx, w, h });
            }
            // Pre-measure all emoji bounding boxes using pixel scanning
            const { w, h } = reels[0];
            const fs = Math.floor(Math.min(w, h) * 0.5);
            const fontStr = fs + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
            const offCanvas = document.createElement('canvas');
            offCanvas.width = w * 2; offCanvas.height = h * 2;
            const offCtx = offCanvas.getContext('2d');
            SYMBOLS.forEach(sym => {
                offCtx.clearRect(0, 0, offCanvas.width, offCanvas.height);
                offCtx.font = fontStr;
                offCtx.textAlign = 'center';
                offCtx.textBaseline = 'middle';
                offCtx.fillText(sym, offCanvas.width / 2, offCanvas.height / 2);
                const imgData = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);
                const px = imgData.data;
                let minY = offCanvas.height, maxY = 0, minX = offCanvas.width, maxX = 0;
                for (let y = 0; y < offCanvas.height; y++) {
                    for (let x = 0; x < offCanvas.width; x++) {
                        if (px[(y * offCanvas.width + x) * 4 + 3] > 10) {
                            if (y < minY) minY = y;
                            if (y > maxY) maxY = y;
                            if (x < minX) minX = x;
                            if (x > maxX) maxX = x;
                        }
                    }
                }
                const glyphCenterY = (minY + maxY) / 2;
                const glyphCenterX = (minX + maxX) / 2;
                // Offset = how much the glyph center differs from canvas center
                emojiOffsets[sym] = {
                    dy: glyphCenterY - offCanvas.height / 2,
                    dx: glyphCenterX - offCanvas.width / 2
                };
            });
        }

        const emojiOffsets = {};

        function drawSymbol(ri, symbol) {
            const { ctx, w, h } = reels[ri];
            ctx.clearRect(0, 0, w, h);
            const fs = Math.floor(Math.min(w, h) * 0.5);
            ctx.font = fs + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            const off = emojiOffsets[symbol] || { dy: 0, dx: 0 };
            ctx.fillText(symbol, w / 2 - off.dx, h / 2 - off.dy);
            drawFade(ctx, w, h);
        }

        function drawFade(ctx, w, h) {
            const g = ctx.createLinearGradient(0, 0, 0, h);
            g.addColorStop(0, 'rgba(13,13,32,1)');
            g.addColorStop(0.18, 'rgba(13,13,32,0)');
            g.addColorStop(0.82, 'rgba(13,13,32,0)');
            g.addColorStop(1, 'rgba(13,13,32,1)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, w, h);
        }

        function animateReel(ri, finalSymbol, duration) {
            return new Promise(resolve => {
                const { ctx, w, h } = reels[ri];
                const fs = Math.floor(Math.min(w, h) * 0.5);
                const fontStr = fs + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
                const seqLen = 18 + ri * 6;
                const seq = [];
                for (let i = 0; i < seqLen; i++) seq.push(SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
                seq.push(finalSymbol);
                const total = seq.length;
                const startTime = performance.now();
                function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }
                function frame(now) {
                    const elapsed = now - startTime;
                    const t = Math.min(elapsed / duration, 1);
                    const eased = easeOutQuart(t);
                    const pos = eased * (total - 1);
                    const idx = Math.floor(pos);
                    const frac = pos - idx;
                    ctx.clearRect(0, 0, w, h);
                    ctx.font = fontStr; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    const yShift = -frac * h;
                    const curSym = seq[Math.min(idx, total - 1)];
                    const curOff = emojiOffsets[curSym] || { dy: 0, dx: 0 };
                    ctx.fillText(curSym, w / 2 - curOff.dx, h / 2 - curOff.dy + yShift);
                    if (idx + 1 < total) {
                        const nextSym = seq[idx + 1];
                        const nextOff = emojiOffsets[nextSym] || { dy: 0, dx: 0 };
                        ctx.fillText(nextSym, w / 2 - nextOff.dx, h / 2 - nextOff.dy + yShift + h);
                    }
                    drawFade(ctx, w, h);
                    if (t < 1) requestAnimationFrame(frame);
                    else { drawSymbol(ri, finalSymbol); resolve(); }
                }
                requestAnimationFrame(frame);
            });
        }

        function initReels() {
            for (let i = 0; i < 3; i++) drawSymbol(i, SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
        }

        async function fetchBalance() {
            try {
                const res = await fetch('/api/me');
                if (res.ok) { const d = await res.json(); balance = Number(d.balance); document.getElementById('balance').textContent = balance.toLocaleString(); }
                else window.location.href = '/';
            } catch (e) { console.error(e); }
        }

        function changeBet(delta) {
            playSound('click');
            betAmount = Math.max(500, Math.min(100000, betAmount + delta));
            document.getElementById('betDisplay').textContent = betAmount.toLocaleString();
        }
        function setBet(v) {
            playSound('click');
            betAmount = v;
            document.getElementById('betDisplay').textContent = betAmount.toLocaleString();
        }

        async function spin() {
            if (spinning) return;
            if (balance < betAmount) {
                document.getElementById('resultMsg').textContent = '❌ Không đủ tiền!';
                document.getElementById('resultMsg').className = 'result-msg result-lose';
                return;
            }
            spinning = true;
            const btn = document.getElementById('spinBtn');
            btn.disabled = true; btn.classList.add('spinning'); btn.textContent = '🔄 ĐANG QUAY...';
            document.getElementById('resultMsg').textContent = '';
            playSound('spin');

            try {
                const res = await fetch('/api/slot/spin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ bet: betAmount }) });
                const data = await res.json();
                if (data.error) {
                    document.getElementById('resultMsg').textContent = '❌ ' + data.error;
                    document.getElementById('resultMsg').className = 'result-msg result-lose';
                    resetBtn(btn); return;
                }
                await Promise.all([
                    animateReel(0, data.symbols[0], 1200),
                    animateReel(1, data.symbols[1], 1700),
                    animateReel(2, data.symbols[2], 2200),
                ]);
                balance = Number(data.newBalance);
                document.getElementById('balance').textContent = balance.toLocaleString();

                if (data.win > 0) {
                    if (data.multiplier >= 10) { playSound('bigWin'); showBigWin(data.symbols, data.win); }
                    else {
                        playSound('win');
                        document.getElementById('resultMsg').innerHTML = `🎉 THẮNG <strong>+${data.win.toLocaleString()} $</strong> (x${data.multiplier})`;
                        document.getElementById('resultMsg').className = 'result-msg result-win';
                    }
                } else {
                    playSound('lose');
                    document.getElementById('resultMsg').textContent = '😢 Chưa trúng, thử lại!';
                    document.getElementById('resultMsg').className = 'result-msg result-lose';
                }
                addHistory(data.symbols, data.win, betAmount);
            } catch (e) {
                document.getElementById('resultMsg').textContent = '❌ Lỗi kết nối!';
                document.getElementById('resultMsg').className = 'result-msg result-lose';
            }
            resetBtn(btn);
        }

        function resetBtn(btn) { spinning = false; btn.disabled = false; btn.classList.remove('spinning'); btn.textContent = '🎰 QUAY'; }

        function addHistory(symbols, win, bet) {
            const list = document.getElementById('historyList');
            const item = document.createElement('div');
            item.className = 'history-item';
            const isWin = win > 0;
            item.innerHTML = `<span class="history-symbols">${symbols.join(' ')}</span><span class="${isWin ? 'history-win' : 'history-lose'}">${isWin ? '+' + win.toLocaleString() : '-' + bet.toLocaleString()} $</span>`;
            list.insertBefore(item, list.firstChild);
            if (list.children.length > 20) list.removeChild(list.lastChild);
        }

        function showBigWin(symbols, amount) {
            document.getElementById('winSymbols').textContent = symbols.join(' ');
            document.getElementById('winAmount').textContent = '+' + amount.toLocaleString() + ' $';
            document.getElementById('winOverlay').classList.add('active');
            spawnConfetti();
        }
        function closeWin() { document.getElementById('winOverlay').classList.remove('active'); }

        function spawnConfetti() {
            const c = document.getElementById('confettiContainer');
            const cols = ['#ffe600', '#ff6b6b', '#00ff9d', '#bc13fe', '#00f3ff', '#ff9e00'];
            for (let i = 0; i < 60; i++) {
                const el = document.createElement('div');
                el.className = 'confetti';
                el.style.left = Math.random() * 100 + '%';
                el.style.background = cols[Math.floor(Math.random() * cols.length)];
                el.style.animationDelay = Math.random() * 2 + 's';
                el.style.animationDuration = (2 + Math.random() * 2) + 's';
                el.style.width = (5 + Math.random() * 10) + 'px';
                el.style.height = (5 + Math.random() * 10) + 'px';
                el.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                c.appendChild(el);
            }
            setTimeout(() => c.innerHTML = '', 4000);
        }


        document.addEventListener('keydown', (e) => { if (e.code === 'Space' && !spinning) { e.preventDefault(); spin(); } });

        // Ensure fonts are loaded before calculating emoji offsets
        document.fonts.ready.then(() => {
            // Small delay to ensure layout is stable
            setTimeout(() => {
                setupCanvases();
                initReels();
                fetchBalance();
            }, 100);
        });


        // Particles
        (function () {
            const c = document.getElementById('slotParticles');
            const cols = ['rgba(138,43,226,0.4)', 'rgba(0,243,255,0.3)', 'rgba(255,230,0,0.25)'];
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.background = cols[Math.floor(Math.random() * cols.length)];
                p.style.animationDuration = (6 + Math.random() * 10) + 's';
                p.style.animationDelay = Math.random() * 8 + 's';
                p.style.width = p.style.height = (2 + Math.random() * 3) + 'px';
                c.appendChild(p);
            }
        })();
    </script>
</body>
