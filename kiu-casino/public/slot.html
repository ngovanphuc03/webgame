<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Mega Slot - Quay số may mắn tại Pixel PlayZone">
    <meta name="theme-color" content="#1a0033">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎰</text></svg>">
    <title>🎰 Mega Slot - Pixel PlayZone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(ellipse at top, #1a0033 0%, #0a0015 50%, #000000 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* ═══ ANIMATED BACKGROUND ═══ */
        .bg-stars {
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(2px 2px at 20% 30%, white, transparent),
                radial-gradient(2px 2px at 60% 70%, white, transparent),
                radial-gradient(1px 1px at 50% 50%, white, transparent),
                radial-gradient(1px 1px at 80% 10%, white, transparent),
                radial-gradient(2px 2px at 90% 60%, white, transparent),
                radial-gradient(1px 1px at 33% 80%, white, transparent);
            background-size: 200% 200%;
            animation: stars-twinkle 8s ease-in-out infinite;
            opacity: 0.4;
            z-index: -2;
        }

        @keyframes stars-twinkle {

            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 0.6;
            }
        }

        .ambient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: -1;
            animation: orb-drift 12s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: rgba(255, 0, 150, 0.15);
            top: -10%;
            left: -10%;
        }

        .orb-2 {
            width: 350px;
            height: 350px;
            background: rgba(138, 43, 226, 0.12);
            bottom: -5%;
            right: -10%;
            animation-delay: 6s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: rgba(255, 215, 0, 0.08);
            top: 40%;
            left: 50%;
            animation-delay: 3s;
        }

        @keyframes orb-drift {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(30px, -20px) scale(1.15);
            }
        }

        .particle-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            bottom: -10px;
            animation: pfloat linear infinite;
        }

        @keyframes pfloat {
            0% {
                transform: translateY(0) rotate(0deg) scale(0);
                opacity: 0;
            }

            10% {
                opacity: 0.8;
                transform: scale(1);
            }

            90% {
                opacity: 0.3;
            }

            100% {
                transform: translateY(-100vh) rotate(360deg) scale(0);
                opacity: 0;
            }
        }


        /* ═══ TOP BAR ═══ */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 28px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid rgba(255, 0, 150, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .back-btn {
            background: linear-gradient(135deg, rgba(255, 0, 150, 0.2), rgba(138, 43, 226, 0.2));
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 700;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .back-btn:hover {
            background: linear-gradient(135deg, rgba(255, 0, 150, 0.4), rgba(138, 43, 226, 0.4));
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 150, 0.4);
        }

        .balance-pill {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border: 2px solid #FFE55C;
            border-radius: 50px;
            padding: 10px 24px;
            font-weight: 900;
            color: #000;
            font-size: 16px;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.4);
            position: relative;
            overflow: hidden;
            animation: balance-glow 2s ease-in-out infinite;
        }

        @keyframes balance-glow {

            0%,
            100% {
                box-shadow: 0 4px 20px rgba(255, 215, 0, 0.4);
            }

            50% {
                box-shadow: 0 4px 30px rgba(255, 215, 0, 0.8);
            }
        }

        .balance-pill::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: bshine 3s ease infinite;
        }

        @keyframes bshine {
            0% {
                left: -100%;
            }

            100% {
                left: 200%;
            }
        }


        /* ═══ MACHINE ═══ */
        .machine-wrapper {
            margin-top: 30px;
            width: 95vw;
            max-width: 480px;
            position: relative;
        }

        .machine-wrapper::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 32px;
            background: conic-gradient(from 0deg, #ff0096, #bc13fe, #FFD700, #ff0096);
            z-index: -1;
            filter: blur(20px);
            opacity: 0.4;
            animation: mg 5s linear infinite;
        }

        @keyframes mg {
            to {
                filter: blur(20px) hue-rotate(360deg);
            }
        }

        .machine {
            background: linear-gradient(180deg, rgba(26, 0, 51, 0.95) 0%, rgba(10, 0, 30, 0.98) 100%);
            border-radius: 28px;
            padding: 30px 24px;
            border: 2px solid rgba(255, 0, 150, 0.3);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            position: relative;
        }

        .machine::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        }

        .machine-title {
            text-align: center;
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, #FFD700, #FFA500, #FFD700);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: tshimmer 3s ease infinite;
            letter-spacing: 4px;
            margin-bottom: 24px;
            text-transform: uppercase;
            filter: drop-shadow(0 2px 10px rgba(255, 215, 0, 0.5));
        }

        @keyframes tshimmer {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }


        /* ═══ REELS ═══ */
        .reels-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 24px 16px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.6), rgba(20, 0, 40, 0.5));
            border-radius: 20px;
            border: 3px solid rgba(255, 0, 150, 0.4);
            position: relative;
            box-shadow:
                inset 0 4px 20px rgba(0, 0, 0, 0.6),
                0 8px 30px rgba(255, 0, 150, 0.2);
        }

        .reels-container::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(255, 0, 150, 0.1), rgba(138, 43, 226, 0.1));
            pointer-events: none;
        }

        .win-line {
            position: absolute;
            left: 12px;
            right: 12px;
            height: 4px;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.6), transparent);
            z-index: 2;
            pointer-events: none;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .reel-wrapper {
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            border: 3px solid rgba(138, 43, 226, 0.5);
            background: linear-gradient(135deg, rgba(26, 0, 51, 0.9), rgba(13, 13, 32, 0.9));
            box-shadow:
                inset 0 0 20px rgba(0, 0, 0, 0.6),
                0 0 20px rgba(138, 43, 226, 0.3);
            transition: all 0.3s ease;
            width: 115px;
            height: 115px;
        }

        .reel-wrapper::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 13px;
            background: linear-gradient(180deg,
                    rgba(26, 0, 51, 0.9) 0%,
                    transparent 20%,
                    transparent 80%,
                    rgba(26, 0, 51, 0.9) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .reel-canvas {
            width: 115px;
            height: 345px;
            display: block;
            transition: transform 0.0s;
        }

        .reel-wrapper.spinning {
            border-color: rgba(255, 0, 150, 0.8);
            box-shadow:
                inset 0 0 20px rgba(0, 0, 0, 0.6),
                0 0 30px rgba(255, 0, 150, 0.6);
        }

        .reel-wrapper.win {
            animation: reel-win-pulse 0.6s ease-in-out infinite;
        }

        @keyframes reel-win-pulse {

            0%,
            100% {
                border-color: rgba(255, 215, 0, 0.8);
                box-shadow:
                    inset 0 0 20px rgba(0, 0, 0, 0.6),
                    0 0 30px rgba(255, 215, 0, 0.6);
            }

            50% {
                border-color: rgba(255, 215, 0, 1);
                box-shadow:
                    inset 0 0 20px rgba(0, 0, 0, 0.6),
                    0 0 40px rgba(255, 215, 0, 1);
            }
        }


        /* ═══ PAYOUT TABLE ═══ */
        .payout-table {
            margin-top: 20px;
            padding: 18px;
            background: linear-gradient(135deg, rgba(26, 0, 51, 0.6), rgba(13, 0, 30, 0.6));
            border-radius: 16px;
            border: 2px solid rgba(138, 43, 226, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .payout-title {
            text-align: center;
            font-size: 14px;
            font-weight: 900;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .payout-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            font-size: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .payout-row:hover {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        .payout-row:last-child {
            border: none;
        }

        .payout-symbols {
            font-size: 18px;
            letter-spacing: 2px;
        }

        .payout-mult {
            color: #00ff9d;
            font-weight: 900;
            font-size: 15px;
            text-shadow: 0 0 10px rgba(0, 255, 157, 0.4);
        }


        /* ═══ CONTROLS ═══ */
        .controls {
            margin-top: 20px;
        }

        .bet-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .bet-label {
            font-weight: 900;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .bet-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            border: 2px solid rgba(255, 0, 150, 0.5);
            background: linear-gradient(135deg, rgba(255, 0, 150, 0.2), rgba(138, 43, 226, 0.2));
            color: #fff;
            font-size: 24px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(255, 0, 150, 0.2);
        }

        .bet-btn:hover {
            background: linear-gradient(135deg, rgba(255, 0, 150, 0.4), rgba(138, 43, 226, 0.4));
            border-color: rgba(255, 0, 150, 0.8);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 150, 0.4);
        }

        .bet-btn:active {
            transform: scale(0.95);
        }

        .bet-amount {
            min-width: 100px;
            text-align: center;
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            padding: 8px 16px;
            background-color: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            border: 2px solid rgba(255, 215, 0, 0.4);
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .preset-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .preset-btn {
            padding: 10px 16px;
            border-radius: 10px;
            border: 2px solid rgba(138, 43, 226, 0.4);
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.2), rgba(255, 0, 150, 0.1));
            color: #fff;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .preset-btn:hover {
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.4), rgba(255, 0, 150, 0.3));
            border-color: rgba(138, 43, 226, 0.8);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
        }

        .preset-btn.active {
            background: linear-gradient(135deg, #bc13fe, #ff0096);
            border-color: #bc13fe;
            box-shadow: 0 4px 15px rgba(188, 19, 254, 0.6);
        }


        .spin-btn {
            width: 100%;
            padding: 18px;
            margin-top: 14px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #ff0096, #bc13fe);
            color: #fff;
            font-size: 22px;
            font-weight: 900;
            cursor: pointer;
            letter-spacing: 4px;
            box-shadow: 0 8px 30px rgba(255, 0, 150, 0.5);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
        }

        .spin-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            animation: spinshine 2.5s ease infinite;
        }

        @keyframes spinshine {
            0% {
                left: -100%;
            }

            100% {
                left: 200%;
            }
        }

        .spin-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(255, 0, 150, 0.7);
        }

        .spin-btn:active:not(:disabled) {
            transform: translateY(-1px);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .spin-btn.spinning {
            animation: spinpulse 0.6s ease-in-out infinite;
            background: linear-gradient(135deg, #bc13fe, #6c5ce7);
        }

        @keyframes spinpulse {

            0%,
            100% {
                box-shadow: 0 8px 25px rgba(188, 19, 254, 0.4);
            }

            50% {
                box-shadow: 0 8px 40px rgba(188, 19, 254, 0.8);
            }
        }

        /* AUTO SPIN SECTION */
        .auto-spin-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .auto-spin-btn {
            padding: 8px 18px;
            border-radius: 10px;
            border: 2px solid rgba(0, 243, 255, 0.5);
            background: rgba(0, 243, 255, 0.1);
            color: #00f3ff;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
        }

        .auto-spin-btn:hover {
            background: rgba(0, 243, 255, 0.3);
        }

        .auto-spin-btn.active {
            background: linear-gradient(135deg, #00f3ff, #0099ff);
            color: #000;
            border-color: #00f3ff;
            box-shadow: 0 4px 15px rgba(0, 243, 255, 0.6);
        }

        .result-msg {
            text-align: center;
            margin-top: 14px;
            font-weight: 900;
            font-size: 18px;
            min-height: 28px;
            animation: fadeUp 0.3s ease;
        }

        @keyframes fadeUp {
            0% {
                transform: translateY(8px);
                opacity: 0;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .result-win {
            background: linear-gradient(135deg, #00ff9d, #00ff00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            filter: drop-shadow(0 2px 10px rgba(0, 255, 157, 0.5));
        }

        .result-lose {
            color: #ff6b6b;
            text-shadow: 0 2px 10px rgba(255, 107, 107, 0.3);
        }


        /* ═══ HISTORY ═══ */
        .history {
            margin-top: 24px;
            width: 95vw;
            max-width: 480px;
            background: linear-gradient(135deg, rgba(26, 0, 51, 0.6), rgba(10, 0, 30, 0.6));
            border-radius: 20px;
            padding: 20px;
            border: 2px solid rgba(138, 43, 226, 0.3);
            margin-bottom: 35px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .history-title {
            font-size: 16px;
            font-weight: 900;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 14px;
            text-align: center;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            font-size: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            animation: fadeUp 0.3s ease;
            transition: all 0.2s;
            border-radius: 8px;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .history-item:last-child {
            border: none;
        }

        .history-symbols {
            font-size: 20px;
            letter-spacing: 4px;
        }

        .history-win {
            color: #00ff9d;
            font-weight: 900;
            text-shadow: 0 0 8px rgba(0, 255, 157, 0.3);
        }

        .history-lose {
            color: #ff6b6b;
            font-weight: 700;
        }


        /* ═══ WIN OVERLAY ═══ */
        .win-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(12px);
        }

        .win-overlay.active {
            display: flex;
        }

        .win-box {
            background: linear-gradient(135deg, #1a0033, #2a0a4e);
            border: 3px solid #FFD700;
            border-radius: 28px;
            padding: 40px;
            text-align: center;
            box-shadow:
                0 0 80px rgba(255, 215, 0, 0.3),
                0 0 150px rgba(255, 0, 150, 0.2);
            animation: wpop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 380px;
            width: 90vw;
        }

        @keyframes wpop {
            0% {
                transform: scale(0) rotate(-8deg);
                opacity: 0;
            }

            100% {
                transform: scale(1) rotate(0);
                opacity: 1;
            }
        }

        .win-box h2 {
            font-size: 36px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            filter: drop-shadow(0 2px 10px rgba(255, 215, 0, 0.5));
        }

        .win-box .win-amount {
            font-size: 48px;
            color: #00ff9d;
            font-weight: 900;
            text-shadow: 0 0 30px rgba(0, 255, 157, 0.5);
        }

        .win-box .win-symbols {
            font-size: 50px;
            margin: 16px 0;
            letter-spacing: 8px;
        }

        .win-box button {
            margin-top: 22px;
            padding: 14px 40px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .win-box button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(255, 215, 0, 0.6);
        }


        /* ═══ CONFETTI ═══ */
        .confetti-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 200;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: cfall 3s linear forwards;
        }

        @keyframes cfall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* ═══ WIN COUNT ANIMATION ═══ */
        .win-counter {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px;
            font-weight: 900;
            color: #FFD700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
            z-index: 150;
            pointer-events: none;
            animation: win-count-pop 1.5s ease-out forwards;
        }

        @keyframes win-count-pop {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }

            30% {
                transform: translate(-50%, -50%) scale(1.3);
                opacity: 1;
            }

            70% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }

            100% {
                transform: translate(-50%, -80%) scale(0.8);

        /* ═══ STREAK INDICATOR ═══ */
        .streak-bar {
            display: flex;

            align-items: center;

            margin-top: 8px;

        .streak-dot {

        .streak-dot.win {

        }

        .streak-dot.lose {
            background: #ff6b6b;
            box-shadow: 0 0 10px rgba(255, 107, 107, 0.4);

        /* ═══ RESPONSIVE ═══ */
        @media (max-width: 500px) {
            .machine {
                padding: 20px 16px;
            }

            .reel-wrapper {
                width: 95px;
                height: 95px;

            .reel-canvas {

            .preset-btn {
                padding: 8px 12px;
                font-size: 11px;

                font-size: 36px;

        @media (max-width: 370px) {
            .reel-wrapper {
                width: 82px;
                height: 82px;
            }

            .reel-canvas {
                width: 82px;
                height: 246px;
            }

            .machine-title {
                font-size: 22px;

            .reels-container {
                gap: 5px;

        /* ═══ SCROLLBAR ═══ */
        ::-webkit-scrollbar {

        ::-webkit-scrollbar-track {
            background: transparent;

        ::-webkit-scrollbar-thumb {

            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(138, 43, 226, 0.6);

                </div>

                <div class="bet-row">
                    <span class="bet-label">Cược:</span>

                    <button class="preset-btn" data-bet="10000" onclick="setBet(10000)">10K</button>

                    <button class="auto-spin-btn" id="stopAutoBtn" onclick="stopAutoSpin()"
                        style="display:none;border-color:#ff6b6b;color:#ff6b6b;">⏹ Dừng</button>

    <div class="history">

        <div id="historyList"></div>
    </div>

    <div class="win-overlay" id="winOverlay">
        <div class="win-box">
            <h2>🎉 JACKPOT!</h2>
            <div class="win-symbols" id="winSymbols"></div>
            <div class="win-amount" id="winAmount"></div>
            <button onclick="closeWin()">Tiếp Tục</button>
        </div>
    </div>

    <div class="confetti-container" id="confettiContainer"></div>

    <script>
        const SYMBOLS = ['🍒', '🍋', '🍊', '⭐', '7️⃣', '💎'];
        const WEIGHTS = [25, 22, 20, 18, 10, 5];
        const PAYOUTS = { '💎': 50, '7️⃣': 30, '⭐': 20, '🍒': 10, '🍋': 5, '🍊': 3 };

        let balance = 0, betAmount = 1000, spinning = false;
        let autoSpinCount = 0, autoSpinTimer = null;
        let streakHistory = []; // track last 10 results

        const SFX = {
            spin: new Audio('/sounds/spin.mp3'),
            win: new Audio('/sounds/win.mp3'),
            lose: new Audio('/sounds/lose.mp3'),
            bigWin: new Audio('/sounds/slot_win.mp3'),
            click: new Audio('/sounds/click.mp3'),
        };
        Object.values(SFX).forEach(a => { a.volume = 0.5; a.preload = 'auto'; });
        SFX.bigWin.volume = 0.7;
        function playSound(n) { try { SFX[n].currentTime = 0; SFX[n].play().catch(() => { }); } catch (e) { } }

        // ═══ HAPTIC FEEDBACK ═══
        function vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

        // ═══ CANVAS REEL ENGINE (Strip-based) ═══
        const DPR = window.devicePixelRatio || 1;
        const reels = [];
        const CELL_H = 115; // visible height = 1 cell
        const STRIP_CELLS = 3; // canvas has 3 cells tall

        function setupCanvases() {
            for (let i = 0; i < 3; i++) {
                const canvas = document.getElementById('reel' + i);
                const wrapper = canvas.parentElement;
                const wrapperRect = wrapper.getBoundingClientRect();
                const w = Math.round(wrapperRect.width);
                const cellH = Math.round(wrapperRect.height);
                const totalH = cellH * STRIP_CELLS;
                canvas.width = w * DPR;
                canvas.height = totalH * DPR;
                canvas.style.width = w + 'px';
                canvas.style.height = totalH + 'px';
                const ctx = canvas.getContext('2d');
                ctx.scale(DPR, DPR);
                // Start positioned so middle cell is visible
                canvas.style.transform = `translateY(-${cellH}px)`;
                reels.push({ canvas, ctx, w, cellH, totalH, wrapper });
            }
        }

        function drawStatic(ri, symbol) {
            const { ctx, w, cellH, totalH, canvas } = reels[ri];
            ctx.clearRect(0, 0, w, totalH);
            // Draw symbol only in the middle cell (cell index 1)
            const fs = Math.floor(cellH * 0.55);
            ctx.font = fs + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(symbol, w / 2, cellH * 1.5);
            // Position canvas so middle cell is in view
            canvas.style.transition = 'none';
            canvas.style.transform = `translateY(-${cellH}px)`;
        }

        function drawStrip(ri, symbols3) {
            // symbols3 = [top, center, bottom]
            const { ctx, w, cellH, totalH } = reels[ri];
            ctx.clearRect(0, 0, w, totalH);
            const fs = Math.floor(cellH * 0.55);
            ctx.font = fs + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for (let i = 0; i < 3; i++) {
                if (symbols3[i]) {
                    const alpha = i === 1 ? 1 : 0.35;
                    ctx.globalAlpha = alpha;
                    ctx.fillText(symbols3[i], w / 2, cellH * i + cellH / 2);
                }
            }
            ctx.globalAlpha = 1;
        }

        function animateReel(ri, finalSymbol, duration) {
            return new Promise(resolve => {
                const { ctx, w, cellH, totalH, canvas, wrapper } = reels[ri];
                const fs = Math.floor(cellH * 0.55);
                const fontStr = fs + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';

                // Build symbol sequence
                const seqLen = 25 + ri * 8;
                const seq = [];
                for (let i = 0; i < seqLen; i++) seq.push(SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
                seq.push(finalSymbol);
                // Add one more after final for the bottom peek
                seq.push(SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
                const lastIdx = seq.length - 2; // index of finalSymbol

                const startTime = performance.now();
                wrapper.classList.add('spinning');

                function easeOutCubic(t) {
                    return 1 - Math.pow(1 - t, 3);
                }

                function frame(now) {
                    const elapsed = now - startTime;
                    const t = Math.min(elapsed / duration, 1);
                    const eased = easeOutCubic(t);
                    // pos goes from 0 to lastIdx
                    const pos = eased * lastIdx;
                    const idx = Math.floor(pos);
                    const frac = pos - idx;

                    // Which 3 symbols to show: [idx-1, idx, idx+1] offset by frac
                    const topSym = idx > 0 ? seq[idx - 1] : null;
                    const midSym = seq[idx];
                    const botSym = idx + 1 < seq.length ? seq[idx + 1] : null;

                    // Draw 3-cell strip
                    ctx.clearRect(0, 0, w, totalH);
                    ctx.font = fontStr;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    // Speed-based blur effect
                    const speed = t < 0.7 ? 1 : (1 - t) / 0.3;

                    if (topSym) {
                        ctx.globalAlpha = 0.25 * (1 - speed * 0.5);
                        ctx.fillText(topSym, w / 2, cellH * 0 + cellH / 2);
                    }
                    ctx.globalAlpha = 1;
                    ctx.fillText(midSym, w / 2, cellH * 1 + cellH / 2);
                    if (botSym) {
                        ctx.globalAlpha = 0.25 * (1 - speed * 0.5);
                        ctx.fillText(botSym, w / 2, cellH * 2 + cellH / 2);
                    }
                    ctx.globalAlpha = 1;

                    // Shift canvas by fraction
                    const yOff = -cellH - frac * cellH;
                    canvas.style.transform = `translateY(${yOff}px)`;

                    if (t < 1) {
                        requestAnimationFrame(frame);
                    } else {
                        // Final: draw only the winning symbol, crisp and centered
                        wrapper.classList.remove('spinning');
                        drawStatic(ri, finalSymbol);
                        vibrate(30);
                        resolve();
                    }
                }
                requestAnimationFrame(frame);
            });
        }

        function initReels() {
            reels.length = 0;
            setupCanvases();
            for (let i = 0; i < 3; i++) drawStatic(i, SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
        }

        async function fetchBalance() {
            try {
                const res = await fetch('/api/me');
                if (res.ok) {
                    const d = await res.json();
                    balance = Number(d.balance);
                    animateBalanceUpdate(balance);
                }
                else window.location.href = '/';
            } catch (e) { console.error(e); }
        }

        function animateBalanceUpdate(newVal) {
            const el = document.getElementById('balance');
            const oldVal = parseInt(el.textContent.replace(/,/g, '')) || 0;
            const diff = newVal - oldVal;
            const duration = 500;
            const start = performance.now();

            function tick(now) {
                const t = Math.min((now - start) / duration, 1);
                const eased = 1 - Math.pow(1 - t, 3);
                const current = Math.round(oldVal + diff * eased);
                el.textContent = current.toLocaleString();
                if (t < 1) requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
        }

        function changeBet(delta) {
            playSound('click');
            vibrate(10);
            betAmount = Math.max(500, Math.min(100000, betAmount + delta));
            document.getElementById('betDisplay').textContent = betAmount.toLocaleString();
            updatePresetBtns();
        }

        function setBet(v) {
            playSound('click');
            vibrate(10);
            betAmount = v;
            document.getElementById('betDisplay').textContent = betAmount.toLocaleString();
            updatePresetBtns();
        }

        function updatePresetBtns() {
            document.querySelectorAll('.preset-btn').forEach(btn => {
                const val = parseInt(btn.dataset.bet);
                btn.classList.toggle('active', val === betAmount);
            });
        }

        // ═══ STREAK TRACKING ═══
        function updateStreak(isWin) {
            streakHistory.push(isWin);
            if (streakHistory.length > 10) streakHistory.shift();

            const bar = document.getElementById('streakBar');
            bar.innerHTML = '';
            streakHistory.forEach(w => {
                const dot = document.createElement('div');
                dot.className = 'streak-dot ' + (w ? 'win' : 'lose');
                bar.appendChild(dot);
            });
        }

        // ═══ WIN EFFECTS ═══
        function flashReels(symbols) {
            const wrappers = [
                document.getElementById('reel0').parentElement,
                document.getElementById('reel1').parentElement,
                document.getElementById('reel2').parentElement
            ];

            const allMatch = symbols[0] === symbols[1] && symbols[1] === symbols[2];
            const twoMatch = symbols[0] === symbols[1] || symbols[1] === symbols[2] || symbols[0] === symbols[2];

            if (allMatch) {
                wrappers.forEach(w => w.classList.add('win'));
                // Re-draw with glow
                for (let i = 0; i < 3; i++) drawStatic(i, symbols[i]);
                setTimeout(() => wrappers.forEach(w => w.classList.remove('win')), 3000);
            } else if (twoMatch) {
                if (symbols[0] === symbols[1]) { wrappers[0].classList.add('win'); wrappers[1].classList.add('win'); }
                if (symbols[1] === symbols[2]) { wrappers[1].classList.add('win'); wrappers[2].classList.add('win'); }
                if (symbols[0] === symbols[2]) { wrappers[0].classList.add('win'); wrappers[2].classList.add('win'); }
                setTimeout(() => wrappers.forEach(w => w.classList.remove('win')), 2000);
            }
        }

        // ═══ AUTO SPIN ═══
        function toggleAutoSpin(count) {
            playSound('click');
            if (autoSpinCount > 0) {
                stopAutoSpin();
                return;
            }
            autoSpinCount = count;
            document.getElementById('stopAutoBtn').style.display = 'inline-block';
            document.querySelectorAll('.auto-spin-btn:not(#stopAutoBtn)').forEach(b => b.style.opacity = '0.5');
            runAutoSpin();
        }

        function stopAutoSpin() {
            autoSpinCount = 0;
            if (autoSpinTimer) clearTimeout(autoSpinTimer);
            document.getElementById('stopAutoBtn').style.display = 'none';
            document.querySelectorAll('.auto-spin-btn:not(#stopAutoBtn)').forEach(b => b.style.opacity = '1');
        }

        async function runAutoSpin() {
            if (autoSpinCount <= 0 || spinning) {
                stopAutoSpin();
                return;
            }
            await spin();
            autoSpinCount--;
            if (autoSpinCount > 0 && balance >= betAmount) {
                autoSpinTimer = setTimeout(runAutoSpin, 800);
            } else {
                stopAutoSpin();
            }
        }

        async function spin() {
            if (spinning) return;
            if (balance < betAmount) {
                document.getElementById('resultMsg').textContent = '❌ Không đủ tiền!';
                document.getElementById('resultMsg').className = 'result-msg result-lose';
                vibrate([50, 50, 50]);
                return;
            }
            spinning = true;
            const btn = document.getElementById('spinBtn');
            btn.disabled = true; btn.classList.add('spinning'); btn.textContent = '🔄 Đang quay...';
            document.getElementById('resultMsg').textContent = '';
            playSound('spin');
            vibrate(50);

            // Remove old win classes
            document.querySelectorAll('.reel-wrapper').forEach(w => w.classList.remove('win'));

            try {
                const res = await fetch('/api/slot/spin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ bet: betAmount }) });
                const data = await res.json();
                if (data.error) {
                    document.getElementById('resultMsg').textContent = '❌ ' + data.error;
                    document.getElementById('resultMsg').className = 'result-msg result-lose';
                    resetBtn(btn); return;
                }

                // Staggered reel stop with increasing delay
                await Promise.all([
                    animateReel(0, data.symbols[0], 1000),
                    animateReel(1, data.symbols[1], 1600),
                    animateReel(2, data.symbols[2], 2200),
                ]);

                // Animate balance
                balance = Number(data.newBalance);
                animateBalanceUpdate(balance);

                if (data.win > 0) {
                    flashReels(data.symbols);
                    updateStreak(true);

                    if (data.multiplier >= 10) {
                        playSound('bigWin');
                        vibrate([100, 50, 100, 50, 100]);
                        showBigWin(data.symbols, data.win);
                    } else {
                        playSound('win');
                        vibrate([50, 30, 50]);
                        document.getElementById('resultMsg').innerHTML = `🎉 Thắng <strong>+${data.win.toLocaleString()} $</strong> (x${data.multiplier})`;
                        document.getElementById('resultMsg').className = 'result-msg result-win';
                    }
                } else {
                    playSound('lose');
                    updateStreak(false);
                    document.getElementById('resultMsg').textContent = '😢 Chưa trúng, thử lại!';
                    document.getElementById('resultMsg').className = 'result-msg result-lose';
                }
                addHistory(data.symbols, data.win, betAmount);
            } catch (e) {
                document.getElementById('resultMsg').textContent = '❌ Lỗi kết nối!';
                document.getElementById('resultMsg').className = 'result-msg result-lose';
            }
            resetBtn(btn);
        }

        function resetBtn(btn) {
            spinning = false;
            btn.disabled = false;
            btn.classList.remove('spinning');
            btn.textContent = '🎰 Quay';
        }

        function addHistory(symbols, win, bet) {
            const list = document.getElementById('historyList');
            const item = document.createElement('div');
            item.className = 'history-item';
            const isWin = win > 0;
            item.innerHTML = `<span class="history-symbols">${symbols.join(' ')}</span><span class="${isWin ? 'history-win' : 'history-lose'}">${isWin ? '+' + win.toLocaleString() : '-' + bet.toLocaleString()} $</span>`;
            list.insertBefore(item, list.firstChild);
            if (list.children.length > 20) list.removeChild(list.lastChild);
        }

        function showBigWin(symbols, amount) {
            document.getElementById('winSymbols').textContent = symbols.join(' ');
            document.getElementById('winAmount').textContent = '+' + amount.toLocaleString() + ' $';
            document.getElementById('winOverlay').classList.add('active');
            spawnConfetti();
        }

        function closeWin() { document.getElementById('winOverlay').classList.remove('active'); }

        function spawnConfetti() {
            const c = document.getElementById('confettiContainer');
            const cols = ['#FFD700', '#ff6b6b', '#00ff9d', '#bc13fe', '#00f3ff', '#ff0096', '#FFA500'];
            for (let i = 0; i < 80; i++) {
                const el = document.createElement('div');
                el.className = 'confetti';
                el.style.left = Math.random() * 100 + '%';
                el.style.background = cols[Math.floor(Math.random() * cols.length)];
                el.style.animationDelay = Math.random() * 2 + 's';
                el.style.animationDuration = (2 + Math.random() * 2) + 's';
                el.style.width = (5 + Math.random() * 12) + 'px';
                el.style.height = (5 + Math.random() * 12) + 'px';
                el.style.borderRadius = Math.random() > 0.5 ? '50%' : Math.random() > 0.5 ? '2px' : '0';
                c.appendChild(el);
            }
            setTimeout(() => c.innerHTML = '', 4000);
        }

        // Keyboard shortcut
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !spinning) { e.preventDefault(); spin(); }
        });

        // Touch prevention for double-tap zoom
        document.addEventListener('touchstart', (e) => {
            if (e.target.closest('.spin-btn, .bet-btn, .preset-btn, .auto-spin-btn')) {
                e.preventDefault();
                e.target.click();
            }
        }, { passive: false });

        // Ensure fonts are loaded before calculating emoji offsets
        document.fonts.ready.then(() => {
            setTimeout(() => {
                setupCanvases();
                initReels();
                fetchBalance();
            }, 100);
        });

        // Particles
        (function () {
            const c = document.getElementById('slotParticles');
            const cols = ['rgba(255,0,150,0.4)', 'rgba(138,43,226,0.4)', 'rgba(255,215,0,0.3)', 'rgba(0,243,255,0.3)'];
            for (let i = 0; i < 25; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.background = cols[Math.floor(Math.random() * cols.length)];
                p.style.animationDuration = (6 + Math.random() * 12) + 's';
                p.style.animationDelay = Math.random() * 8 + 's';
                p.style.width = p.style.height = (2 + Math.random() * 4) + 'px';
                c.appendChild(p);
            }
        })();
    </script>
</body>
