<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Bảng Xếp Hạng - Top người chơi tại Pixel PlayZone">
    <meta name="theme-color" content="#0a1628">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏆</text></svg>">
    <title>🏆 Bảng Xếp Hạng - Pixel PlayZone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(160deg, #0a1628 0%, #1a0a2e 50%, #0a1628 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ═══ AMBIENT ═══ */
        .ambient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: -1;
            animation: orb-drift 10s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 320px;
            height: 320px;
            background: rgba(255, 215, 0, 0.07);
            top: -2%;
            left: -8%;
        }

        .orb-2 {
            width: 260px;
            height: 260px;
            background: rgba(0, 243, 255, 0.05);
            bottom: 5%;
            right: -5%;
            animation-delay: 5s;
        }

        .orb-3 {
            width: 200px;
            height: 200px;
            background: rgba(188, 19, 254, 0.04);
            top: 45%;
            right: 20%;
            animation-delay: 3s;
        }

        @keyframes orb-drift {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(18px, -12px) scale(1.1);
            }
        }

        .star-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #ffe600;
            border-radius: 50%;
            animation: star-twinkle 3s ease-in-out infinite;
            box-shadow: 0 0 4px currentColor;
        }

        @keyframes star-twinkle {

            0%,
            100% {
                opacity: 0.15;
                transform: scale(0.8);
            }

            50% {
                opacity: 0.9;
                transform: scale(1.3);
            }
        }

        /* ═══ TOP BAR ═══ */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 25px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 20px;
            border-radius: 22px;
            cursor: pointer;
            font-weight: 700;
            text-decoration: none;
            font-size: 13px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .balance-pill {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #ffe600;
            border-radius: 50px;
            padding: 8px 20px;
            font-weight: 800;
            color: #ffe600;
            font-size: 15px;
            box-shadow: 0 0 18px rgba(255, 230, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .balance-pill::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 230, 0, 0.1), transparent);
            animation: bshine 3s ease infinite;
        }

        @keyframes bshine {
            0% {
                left: -100%;
            }

            100% {
                left: 200%;
            }
        }

        /* ═══ HEADER ═══ */
        .page-title {
            margin-top: 28px;
            font-size: 30px;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(90deg, #ffe600, #ff9e00, #ffe600);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            animation: tshimmer 3s ease infinite;
        }

        @keyframes tshimmer {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        .page-subtitle {
            color: rgba(255, 255, 255, 0.45);
            font-size: 13px;
            margin-top: 5px;
            text-align: center;
        }

        /* ═══ MY RANK ═══ */
        .my-rank-card {
            margin-top: 22px;
            background: linear-gradient(135deg, rgba(188, 19, 254, 0.12), rgba(0, 243, 255, 0.06));
            border: 1px solid rgba(188, 19, 254, 0.25);
            border-radius: 18px;
            padding: 18px 25px;
            display: flex;
            align-items: center;
            gap: 14px;
            width: 90vw;
            max-width: 580px;
            box-shadow: 0 0 25px rgba(188, 19, 254, 0.12);
            animation: rglow 3s ease-in-out infinite alternate;
            backdrop-filter: blur(10px);
        }

        @keyframes rglow {
            0% {
                box-shadow: 0 0 15px rgba(188, 19, 254, 0.1);
            }

            100% {
                box-shadow: 0 0 35px rgba(188, 19, 254, 0.25);
            }
        }

        .my-rank-pos {
            font-size: 26px;
            font-weight: 900;
            color: #ffe600;
            min-width: 45px;
            text-align: center;
        }

        .my-rank-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #bc13fe;
            object-fit: cover;
            box-shadow: 0 0 10px rgba(188, 19, 254, 0.3);
        }

        .my-rank-info {
            flex: 1;
        }

        .my-rank-name {
            font-weight: 800;
            font-size: 15px;
        }

        .my-rank-balance {
            color: #ffe600;
            font-weight: 700;
            font-size: 13px;
        }

        .my-rank-label {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ═══ PODIUM ═══ */
        .podium {
            margin-top: 22px;
            display: flex;
            align-items: flex-end;
            gap: 12px;
            justify-content: center;
        }

        .podium-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .podium-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.2);
            transition: 0.3s;
        }

        .podium-item:hover .podium-avatar {
            transform: scale(1.08);
        }

        .podium-1 .podium-avatar {
            width: 72px;
            height: 72px;
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.35);
        }

        .podium-2 .podium-avatar {
            border-color: #c0c0c0;
            box-shadow: 0 0 12px rgba(192, 192, 192, 0.25);
        }

        .podium-3 .podium-avatar {
            border-color: #cd7f32;
            box-shadow: 0 0 12px rgba(205, 127, 50, 0.25);
        }

        .podium-name {
            font-size: 12px;
            font-weight: 700;
            max-width: 75px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .podium-balance {
            font-size: 11px;
            color: #ffe600;
            font-weight: 800;
        }

        .podium-medal {
            font-size: 26px;
        }

        .podium-bar {
            width: 75px;
            border-radius: 10px 10px 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 18px;
            position: relative;
            overflow: hidden;
        }

        .podium-bar::after {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%) translateY(-100%);
            }

            100% {
                transform: translateX(100%) translateY(100%);
            }
        }

        .podium-1 .podium-bar {
            height: 95px;
            background: linear-gradient(180deg, #ffd700, #b8860b);
        }

        .podium-2 .podium-bar {
            height: 65px;
            background: linear-gradient(180deg, #c0c0c0, #808080);
        }

        .podium-3 .podium-bar {
            height: 45px;
            background: linear-gradient(180deg, #cd7f32, #8b4513);
        }

        /* ═══ LEADERBOARD ═══ */
        .leaderboard {
            margin-top: 22px;
            width: 90vw;
            max-width: 580px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 18px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 30px;
            backdrop-filter: blur(5px);
        }

        .lb-header {
            display: flex;
            padding: 8px 14px;
            font-size: 11px;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.35);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .lb-header .col-rank {
            width: 45px;
        }

        .lb-header .col-user {
            flex: 1;
        }

        .lb-header .col-balance {
            width: 110px;
            text-align: right;
        }

        .lb-row {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: 0.25s;
            border-radius: 10px;
            animation: rowIn 0.3s ease-out both;
        }

        @keyframes rowIn {
            0% {
                opacity: 0;
                transform: translateX(-8px);
            }

            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .lb-row:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .lb-row.top-1 {
            background: linear-gradient(90deg, rgba(255, 215, 0, 0.1), transparent);
        }

        .lb-row.top-2 {
            background: linear-gradient(90deg, rgba(192, 192, 192, 0.07), transparent);
        }

        .lb-row.top-3 {
            background: linear-gradient(90deg, rgba(205, 127, 50, 0.07), transparent);
        }

        .lb-row.is-me {
            background: rgba(188, 19, 254, 0.1);
            border: 1px solid rgba(188, 19, 254, 0.2);
        }

        .lb-rank {
            width: 45px;
            font-weight: 900;
            font-size: 15px;
            text-align: center;
        }

        .rank-1 {
            color: #ffd700;
        }

        .rank-2 {
            color: #c0c0c0;
        }

        .rank-3 {
            color: #cd7f32;
        }

        .lb-user {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lb-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.12);
            object-fit: cover;
        }

        .lb-name {
            font-weight: 700;
            font-size: 13px;
        }

        .lb-balance {
            width: 110px;
            text-align: right;
            font-weight: 800;
            color: #ffe600;
            font-size: 13px;
        }

        .refresh-btn {
            margin-top: 12px;
            margin-bottom: 30px;
            padding: 10px 25px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-size: 13px;
            backdrop-filter: blur(5px);
        }

        .refresh-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-1px);
        }

        .loading-text {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            margin-top: 25px;
        }

        /* ═══ RESPONSIVE ═══ */
        @media (max-width: 500px) {
            .podium-1 .podium-avatar {
                width: 55px;
                height: 55px;
            }

            .podium-avatar {
                width: 42px;
                height: 42px;
            }

            .podium-bar {
                width: 56px;
            }

            .my-rank-card {
                padding: 14px;
            }

            .page-title {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
    <div class="star-container" id="starContainer"></div>

    <div class="top-bar">
        <a href="/" class="back-btn">← LOBBY</a>
        <div class="balance-pill">💰 <span id="balance">0</span> $</div>
    </div>

    <h1 class="page-title">🏆 BẢNG XẾP HẠNG</h1>
    <p class="page-subtitle">Top người chơi giàu nhất server</p>

    <div class="my-rank-card" id="myRankCard" style="display:none;">
        <div class="my-rank-pos" id="myRankPos">#?</div>
        <img class="my-rank-avatar" id="myRankAvatar" src="https://ui-avatars.com/api/?name=U" alt="avatar">
        <div class="my-rank-info">
            <div class="my-rank-label">Hạng của bạn</div>
            <div class="my-rank-name" id="myRankName">-</div>
            <div class="my-rank-balance" id="myRankBalance">0 $</div>
        </div>
    </div>

    <div class="podium" id="podium"></div>

    <div class="leaderboard">
        <div class="lb-header">
            <div class="col-rank">#</div>
            <div class="col-user">Người chơi</div>
            <div class="col-balance">Tài sản</div>
        </div>
        <div id="lbBody">
            <p class="loading-text" style="text-align:center;padding:20px;">⏳ Đang tải...</p>
        </div>
    </div>

    <button class="refresh-btn" onclick="loadLeaderboard()">🔄 Làm mới</button>

    <script>
        let myUserId = null;

        function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

        async function fetchBalance() {
            try {
                const res = await fetch('/api/me');
                if (res.ok) { const d = await res.json(); document.getElementById('balance').textContent = Number(d.balance).toLocaleString(); return d; }
                else window.location.href = '/';
            } catch (e) { console.error(e); }
            return null;
        }

        async function loadLeaderboard() {
            const lbBody = document.getElementById('lbBody');
            try {
                const [meRes, lbRes] = await Promise.all([fetch('/api/me'), fetch('/api/leaderboard')]);
                if (!meRes.ok) { window.location.href = '/'; return; }
                const me = await meRes.json();
                document.getElementById('balance').textContent = Number(me.balance).toLocaleString();

                if (!lbRes.ok) {
                    const err = await lbRes.json().catch(() => ({}));
                    lbBody.innerHTML = `<p class="loading-text" style="text-align:center;color:#ff6b6b;padding:20px;">❌ ${escapeHtml(err.error || 'Lỗi tải bảng xếp hạng')}</p>`;
                    return;
                }
                const lb = await lbRes.json();

                if (!lb || !lb.leaderboard || !lb.leaderboard.length) {
                    document.getElementById('podium').innerHTML = '';
                    lbBody.innerHTML = '<p class="loading-text" style="text-align:center;padding:20px;">📭 Chưa có dữ liệu xếp hạng</p>';
                    return;
                }

                const list = lb.leaderboard;

                if (lb.my_rank) {
                    const card = document.getElementById('myRankCard');
                    card.style.display = 'flex';
                    document.getElementById('myRankPos').textContent = '#' + lb.my_rank;
                    document.getElementById('myRankName').textContent = me.username;
                    document.getElementById('myRankAvatar').src = me.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(me.username || 'U');
                    document.getElementById('myRankBalance').textContent = Number(me.balance).toLocaleString() + ' $';
                }

                if (list.length >= 3) renderPodium(list.slice(0, 3));
                else document.getElementById('podium').innerHTML = '';

                renderList(list, lb.my_user_id);
            } catch (e) {
                console.error('Leaderboard error:', e);
                lbBody.innerHTML = '<p class="loading-text" style="text-align:center;color:#ff6b6b;padding:20px;">❌ Không thể kết nối server</p>';
            }
        }

        function renderPodium(top3) {
            const podium = document.getElementById('podium');
            if (top3.length < 3) { podium.innerHTML = ''; return; }
            const order = [top3[1], top3[0], top3[2]];
            const classes = ['podium-2', 'podium-1', 'podium-3'];
            const medals = ['🥈', '🥇', '🥉'];
            podium.innerHTML = order.map((u, i) => `
                <div class="podium-item ${classes[i]}">
                    <div class="podium-medal">${medals[i]}</div>
                    <img class="podium-avatar" src="${u.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(u.username || 'U')}" alt="avatar" onerror="this.src='https://ui-avatars.com/api/?name=U'">
                    <div class="podium-name">${escapeHtml(u.username || 'User')}</div>
                    <div class="podium-balance">${Number(u.balance).toLocaleString()} $</div>
                    <div class="podium-bar">${i === 1 ? '1' : (i === 0 ? '2' : '3')}</div>
                </div>
            `).join('');
        }

        function renderList(list, myId) {
            const body = document.getElementById('lbBody');
            if (!list.length) { body.innerHTML = '<p class="loading-text" style="text-align:center;">Chưa có dữ liệu</p>'; return; }
            body.innerHTML = list.map((u, i) => {
                const rank = i + 1;
                let rankClass = rank === 1 ? 'top-1' : rank === 2 ? 'top-2' : rank === 3 ? 'top-3' : '';
                const isMe = u.user_id === myId;
                const rankColor = rank <= 3 ? `rank-${rank}` : '';
                const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
                return `
                    <div class="lb-row ${rankClass} ${isMe ? 'is-me' : ''}" style="animation-delay: ${i * 0.03}s">
                        <div class="lb-rank ${rankColor}">${medal}</div>
                        <div class="lb-user">
                            <img class="lb-avatar" src="${u.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(u.username || 'U')}" alt="" onerror="this.src='https://ui-avatars.com/api/?name=U'">
                            <span class="lb-name">${escapeHtml(u.username || 'User')} ${isMe ? '(Bạn)' : ''}</span>
                        </div>
                        <div class="lb-balance">${Number(u.balance).toLocaleString()} $</div>
                    </div>`;
            }).join('');
        }

        // Stars
        function createStars() {
            const c = document.getElementById('starContainer');
            const cols = ['#ffe600', '#00f3ff', '#bc13fe', '#fff'];
            for (let i = 0; i < 35; i++) {
                const s = document.createElement('div');
                s.className = 'star';
                s.style.left = Math.random() * 100 + '%';
                s.style.top = Math.random() * 100 + '%';
                s.style.animationDelay = Math.random() * 3 + 's';
                const col = cols[Math.floor(Math.random() * cols.length)];
                s.style.background = col; s.style.color = col;
                s.style.width = s.style.height = (Math.random() * 2.5 + 1) + 'px';
                c.appendChild(s);
            }
        }
        createStars();
        loadLeaderboard();
    </script>
</body>

</html>
