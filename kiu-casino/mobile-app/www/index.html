<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Casino</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0612 0%, #1a0f2e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #ffd700, #fff, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .loading {
            margin-top: 30px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 215, 0, 0.2);
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .status {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        .error {
            margin-top: 30px;
            padding: 20px;
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid rgba(220, 53, 69, 0.5);
            border-radius: 10px;
            display: none;
        }

        .retry-btn {
            margin-top: 15px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #ffd700, #b8860b);
            border: none;
            border-radius: 25px;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="logo">👑</div>
    <h1>ROYAL CASINO</h1>
    <p style="color: rgba(255,255,255,0.6);">VIP Gaming Experience</p>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p class="status">Đang kết nối đến server...</p>
    </div>

    <div class="error" id="error">
        <p>Không thể kết nối đến server.</p>
        <p style="font-size: 12px; margin-top: 10px; opacity: 0.7;">Vui lòng kiểm tra kết nối mạng.</p>
        <button class="retry-btn" onclick="location.reload()">Thử lại</button>
    </div>

    <script>
        // This file is a fallback - normally the app loads directly from server
        // If you see this page, it means the server URL in capacitor.config.ts is not configured correctly

        setTimeout(function () {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
        }, 10000);
    </script>
</body>

</html>
